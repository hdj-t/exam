<script>window.DECKS = [{"id":"lecture-1-era-of-cloud-computing","label":"L1","title":"The Era of Cloud Computing","cards":[{"id":"1lvicyx","k":"def","f":"Cloud Computing","b":"renting computing (servers, storage, networks, software) from a provider over the internet, on demand, instead of buying and running your own machines."},{"id":"ad48uu","k":"def","f":"Bare-metal era","b":"one organization buys, owns, cools, patches and physically secures its own servers in its own data room."},{"id":"3jwz6f","k":"q","f":"What were the problems of the bare-metal era ?","b":"\u003col>\u003cli>High \u003cb>CAPEX\u003c/b>: hardware is bought up front, before demand is known.\u003c/li>\u003cli>\u003cb>Fixed capacity\u003c/b>: you either over-provision (waste) or under-provision (outage).\u003c/li>\u003cli>Every patch, backup and physical control is the owner&#39;s job alone.\u003c/li>\u003cli>Scaling means buying, shipping and racking new machines: \u003cb>weeks, not minutes\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"1uz7uag","k":"def","f":"The Power Wall","b":"around the mid-2000s chips could no longer get meaningfully faster, because higher clock speeds mean exponentially more \u003cb>heat and power\u003c/b> draw."},{"id":"17oqszv","k":"q","f":"What was the industry&#39;s answer to the Power Wall ?","b":"\u003cul>\u003cli>Stop chasing raw speed: add \u003cb>more cores\u003c/b> and \u003cb>more machines\u003c/b>.\u003c/li>\u003cli>Spread the work across them: \u003cb>parallel and distributed computing\u003c/b>.\u003c/li>\u003cli>This is why cloud data centers are built from \u003cb>thousands of ordinary machines\u003c/b>, not one extraordinary one.\u003c/li>\u003c/ul>"},{"id":"5yolf","k":"q","f":"What is &quot;scaling out&quot; (horizontal scaling) and what are its building blocks ?","b":"\u003col>\u003cli>\u003cb>Server\u003c/b>: one physical machine (CPU, RAM, disk, NIC).\u003c/li>\u003cli>\u003cb>Rack\u003c/b>: 10–40+ servers in one cabinet, sharing power and networking.\u003c/li>\u003cli>\u003cb>Aisle / Pod\u003c/b>: rows of racks grouped for airflow, power and network design.\u003c/li>\u003cli>\u003cb>Data center\u003c/b>: thousands of racks, the physical body of &quot;the cloud&quot;.\u003c/li>\u003c/ol>"},{"id":"bf17x9","k":"def","f":"Elastic Computing","b":"the ability to automatically \u003cb>acquire\u003c/b> more computing resources when demand rises and \u003cb>release\u003c/b> them when demand falls, paying only for what is actually used."},{"id":"s4o121","k":"def","f":"Multi-tenant cloud","b":"many independent customers (\u003cb>tenants\u003c/b>) share the same physical hardware, while each tenant&#39;s data and workloads stay \u003cb>logically isolated\u003c/b>."},{"id":"10flx2p","k":"q","f":"Who enforces isolation in a multi-tenant cloud ?","b":"\u003cul>\u003cli>\u003cb>Software\u003c/b>: the hypervisor or the container runtime. Its correctness is now a \u003cb>core security control\u003c/b>.\u003c/li>\u003c/ul>"},{"id":"1xq4bez","k":"q","f":"What new attack surface does multi-tenancy create ?","b":"\u003col>\u003cli>\u003cb>Hypervisor escape\u003c/b> (breaking out of a VM).\u003c/li>\u003cli>\u003cb>Side-channel attacks\u003c/b> (e.g. cache timing between neighbours).\u003c/li>\u003cli>\u003cb>Noisy-neighbour\u003c/b> resource abuse.\u003c/li>\u003c/ol>"},{"id":"11wj2fu","k":"def","f":"IaaS (Infrastructure as a Service)","b":"the provider supplies raw virtualized compute, storage and networking; you install and manage everything above it."},{"id":"5r3hiz","k":"def","f":"PaaS (Platform as a Service)","b":"the provider manages the OS, runtime and middleware; you deploy only your code and data."},{"id":"161g6g8","k":"def","f":"SaaS (Software as a Service)","b":"the provider runs the whole application; you just use it (usually in a browser) and manage your data and user access."},{"id":"1i9tj6q","k":"def","f":"DaaS (Desktop as a Service)","b":"a complete virtual desktop (OS, apps, user profile) streamed from the cloud to any device. It is really \u003cb>SaaS applied to the desktop\u003c/b>."},{"id":"1240rsh","k":"tbl","f":"Compare: IaaS \u003ci>vs\u003c/i> PaaS \u003ci>vs\u003c/i> SaaS \u003ci>vs\u003c/i> DaaS","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>IaaS\u003c/th>\u003cth>PaaS\u003c/th>\u003cth>SaaS\u003c/th>\u003cth>DaaS\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>You manage\u003c/td>\u003ctd>OS, runtime, apps, data\u003c/td>\u003ctd>Apps &amp; data only\u003c/td>\u003ctd>Your data &amp; access\u003c/td>\u003ctd>Your files &amp; profile\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Provider manages\u003c/td>\u003ctd>Virtualization, servers, storage, network\u003c/td>\u003ctd>+ OS, runtime, middleware\u003c/td>\u003ctd>The entire stack\u003c/td>\u003ctd>Full OS + app stack\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>Amazon EC2, Azure VMs, Google Compute Engine\u003c/td>\u003ctd>Azure App Service, Google App Engine, Heroku\u003c/td>\u003ctd>Google Workspace, Microsoft 365, Salesforce, Zoom\u003c/td>\u003ctd>Amazon WorkSpaces, Windows 365, Citrix DaaS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical users\u003c/td>\u003ctd>Sysadmins, DevOps, infrastructure engineers\u003c/td>\u003ctd>Application developers, small teams\u003c/td>\u003ctd>Everyone\u003c/td>\u003ctd>Remote workforces, call centers, students\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control\u003c/td>\u003ctd>Maximum\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>Minimum\u003c/td>\u003ctd>Minimum\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"lfc5xq","k":"q","f":"In SaaS, what does the customer still own ?","b":"\u003col>\u003cli>Identity and access management (account security).\u003c/li>\u003cli>Data classification and the data you upload.\u003c/li>\u003cli>End-user device security.\u003c/li>\u003c/ol>"},{"id":"sb3092","k":"q","f":"Why do organizations use DaaS ?","b":"\u003cul>\u003cli>Consistent, centrally-managed desktops for remote or contract staff.\u003c/li>\u003cli>Sensitive data \u003cb>never leaves the data center\u003c/b>: the endpoint only displays pixels, so a lost laptop does not mean lost data.\u003c/li>\u003c/ul>"},{"id":"1idn1ot","k":"def","f":"Shared Responsibility","b":"every cloud service has a line between what the \u003cb>provider\u003c/b> secures and what \u003cb>you\u003c/b> secure. The line \u003cb>moves with the service model\u003c/b>."},{"id":"1257bjc","k":"q","f":"What are the three security takeaways of Lecture 1 ?","b":"\u003col>\u003cli>\u003cb>Shared responsibility\u003c/b>: know exactly where the line sits before designing a control.\u003c/li>\u003cli>\u003cb>New attack surface\u003c/b>: multi-tenancy, hypervisors and APIs did not exist in the bare-metal era.\u003c/li>\u003cli>\u003cb>Elasticity cuts both ways\u003c/b>: auto-scaling defends against load spikes, but a misconfigured resource can also scale an attacker&#39;s \u003cb>cost abuse or cryptomining\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"y28x7o","k":"q","f":"Bare metal vs cloud — compare.","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Point\u003c/th>\u003cth>Bare metal\u003c/th>\u003cth>Cloud\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cost\u003c/td>\u003ctd>CAPEX, paid up front\u003c/td>\u003ctd>Pay for what you use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Capacity\u003c/td>\u003ctd>Fixed at purchase\u003c/td>\u003ctd>Elastic, on demand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time to scale\u003c/td>\u003ctd>Weeks\u003c/td>\u003ctd>Minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hardware\u003c/td>\u003ctd>Owned by one organization\u003c/td>\u003ctd>Shared by many tenants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security duty\u003c/td>\u003ctd>All on the owner\u003c/td>\u003ctd>Shared with the provider\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sm-key\">One-sentence summary: the Power Wall forced computing to scale horizontally, giving rise to elastic, multi-tenant clouds offered at four levels — IaaS, PaaS, SaaS, DaaS — each shifting the security boundary.\u003c/div>"},{"id":"9an15a","k":"q","f":"(Discussion) A bank moves its core app from bare metal to SaaS. What controls does it lose direct control over ?","b":"\u003cul>\u003cli>OS and patching, the runtime, the application code, physical security and network controls: all move to the provider. The bank keeps identity/access, its data, and its users&#39; devices.\u003c/li>\u003c/ul>"}]},{"id":"lecture-2-types-of-clouds","label":"L2","title":"Types of Clouds, Providers & Data Centers","cards":[{"id":"1mvync9","k":"q","f":"What are the two questions about any cloud ?","b":"\u003col>\u003cli>\u003cb>Service model\u003c/b> — WHAT do you get? IaaS · PaaS · SaaS · DaaS (Lecture 1).\u003c/li>\u003cli>\u003cb>Deployment model\u003c/b> — WHO owns the infrastructure and WHO shares it? Private · Public · Hybrid · Multi-cloud (Lecture 2).\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">The two choices are \u003cb>independent\u003c/b>. Example: Gmail is \u003cb>SaaS\u003c/b> (service model) delivered from a \u003cb>public\u003c/b> cloud (deployment model).\u003c/div>"},{"id":"jaglsk","k":"def","f":"Private Cloud","b":"cloud infrastructure \u003cb>dedicated to a single organization\u003c/b>, run in its own data center or in a provider&#39;s dedicated space."},{"id":"5vbx60","k":"q","f":"What are the characteristics of a private cloud ?","b":"\u003col>\u003cli>One tenant: no sharing with other customers.\u003c/li>\u003cli>Full control of hardware, network and policy.\u003c/li>\u003cli>High upfront cost (\u003cb>CapEx\u003c/b>) and in-house staff.\u003c/li>\u003cli>Elasticity limited by the hardware you own.\u003c/li>\u003c/ol>"},{"id":"m4v0hi","k":"q","f":"Name technologies used to build a private cloud.","b":"\u003cul>\u003cli>OpenStack · VMware vSphere · Proxmox · Kubernetes on your own servers.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">Security angle: you own the whole stack, so you own the \u003cb>whole security burden\u003c/b> (physical access, patching, monitoring, incident response).\u003c/div>"},{"id":"kmlxnc","k":"def","f":"Public Cloud","b":"infrastructure \u003cb>owned and operated by a provider\u003c/b> and rented to many customers (tenants) over the internet."},{"id":"wmllj8","k":"q","f":"What are the characteristics of a public cloud ?","b":"\u003col>\u003cli>\u003cb>Multi-tenant\u003c/b>: resources shared and isolated logically.\u003c/li>\u003cli>\u003cb>Pay-as-you-go\u003c/b> (OpEx), no upfront hardware.\u003c/li>\u003cli>Near-instant elasticity and global regions.\u003c/li>\u003cli>The provider secures the infrastructure layers.\u003c/li>\u003c/ol>"},{"id":"1hpkb7l","k":"q","f":"Name the major public cloud providers.","b":"\u003cul>\u003cli>AWS · Microsoft Azure · Google Cloud (also Alibaba, Oracle, IBM, DigitalOcean).\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">Security angle: \u003cb>shared responsibility\u003c/b> — the provider secures the cloud, you secure what you put \u003cb>in\u003c/b> it. \u003cb>Misconfiguration\u003c/b> is a leading cause of public-cloud breaches.\u003c/div>"},{"id":"abiqqb","k":"tbl","f":"Compare: Private cloud \u003ci>vs\u003c/i> Public cloud","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Private cloud\u003c/th>\u003cth>Public cloud\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ownership\u003c/td>\u003ctd>Single organization\u003c/td>\u003ctd>Provider; shared by many tenants\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cost model\u003c/td>\u003ctd>High upfront (CapEx)\u003c/td>\u003ctd>Pay-as-you-go (OpEx)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Elasticity\u003c/td>\u003ctd>Limited by owned hardware\u003c/td>\u003ctd>Near-unlimited, on demand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Control\u003c/td>\u003ctd>Full\u003c/td>\u003ctd>Limited to what the provider exposes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time to deploy\u003c/td>\u003ctd>Weeks to months\u003c/td>\u003ctd>Minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Security duty\u003c/td>\u003ctd>Entirely the organization\u003c/td>\u003ctd>Shared with the provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best for\u003c/td>\u003ctd>Strict compliance, steady workloads\u003c/td>\u003ctd>Variable demand, fast growth\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"cdzdjp","k":"def","f":"Hybrid Cloud","b":"a \u003cb>private\u003c/b> cloud (or on-premises) and a \u003cb>public\u003c/b> cloud working together, connected by a VPN or dedicated link."},{"id":"fs3n92","k":"q","f":"What are the uses of hybrid cloud ?","b":"\u003col>\u003cli>\u003cb>Cloud bursting\u003c/b>: run normally in-house; rent public capacity only for peaks.\u003c/li>\u003cli>\u003cb>Data residency\u003c/b>: keep regulated data local; use the public cloud for everything else.\u003c/li>\u003cli>\u003cb>Gradual migration\u003c/b>: move workloads to the cloud step by step.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Security angle: the \u003cb>link between the two worlds\u003c/b> is a new attack surface; encrypt it and keep policies consistent on both sides.\u003c/div>"},{"id":"1i381ul","k":"def","f":"Multi-Cloud","b":"using \u003cb>two or more public cloud providers\u003c/b>, for different workloads or for the same workload."},{"id":"jp74ff","k":"tbl","f":"Compare: Multi-cloud benefits \u003ci>vs\u003c/i> Multi-cloud challenges","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Multi-cloud benefits\u003c/th>\u003cth>Multi-cloud challenges\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Less lock-in\u003c/td>\u003ctd>More skills needed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Resilience to one provider&#39;s outage\u003c/td>\u003ctd>Different IAM and tools per provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best service for each task\u003c/td>\u003ctd>Egress fees between clouds\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1aqpskm","k":"tbl","f":"Compare: Hybrid \u003ci>vs\u003c/i> Multi-cloud","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Hybrid\u003c/th>\u003cth>Multi-cloud\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Private + public, working together\u003c/td>\u003ctd>Two or more \u003cb>public\u003c/b> providers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"77vex4","k":"def","f":"Provider Lock-in","b":"switching providers becomes so costly or difficult that you stay even when you would rather leave."},{"id":"gy7osr","k":"q","f":"What creates lock-in ?","b":"\u003col>\u003cli>Proprietary services and APIs (managed databases, serverless).\u003c/li>\u003cli>\u003cb>Data gravity\u003c/b>: large datasets are slow and costly to move out.\u003c/li>\u003cli>\u003cb>Egress\u003c/b> (data-out) fees.\u003c/li>\u003cli>Team skills and tooling tied to one platform.\u003c/li>\u003cli>Long-term contracts and commitments.\u003c/li>\u003c/ol>"},{"id":"thj319","k":"q","f":"How to reduce lock-in ?","b":"\u003col>\u003cli>Containers and Kubernetes for portable workloads.\u003c/li>\u003cli>Infrastructure as Code (e.g. Terraform).\u003c/li>\u003cli>Open standards and portable data formats.\u003c/li>\u003cli>Regular exports and tested backups.\u003c/li>\u003cli>A written \u003cb>exit plan\u003c/b> before you sign.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Security angle: lock-in is also an \u003cb>availability and resilience\u003c/b> risk (outage or changed terms, and no quick alternative).\u003c/div>"},{"id":"nm892","k":"def","f":"Hyperscale","b":"providers running data centers with very large server counts across a global footprint of \u003cb>regions and availability zones\u003c/b>."},{"id":"zmxwea","k":"q","f":"What makes a provider hyperscale ?","b":"\u003col>\u003cli>Data centers with very large server counts.\u003c/li>\u003cli>Global footprint of regions and zones.\u003c/li>\u003cli>Custom hardware, chips and networking.\u003c/li>\u003cli>Automation of almost everything.\u003c/li>\u003c/ol>"},{"id":"68qa7k","k":"def","f":"Region","b":"a geographic area containing several availability zones."},{"id":"1iuvm87","k":"def","f":"Availability Zone","b":"a separate facility (one or more data centers) in a region, linked to the others by fast private networks, so \u003cb>one failure doesn&#39;t take everything down\u003c/b>."},{"id":"xnu6oj","k":"def","f":"Rack","b":"a standard frame (about \u003cb>42U\u003c/b>) holding servers and a \u003cb>top-of-rack switch\u003c/b>."},{"id":"18xr2ey","k":"def","f":"Aisle","b":"the space between rows, used to control cool and hot air flow (cold aisle in, hot aisle out)."},{"id":"182hf1v","k":"def","f":"Pod","b":"a group of racks sharing power, cooling and network uplinks — the unit you add as you grow."},{"id":"2zwm0h","k":"q","f":"What is the power path in a data center ?","b":"\u003cul>\u003cli>Utility grid → \u003cb>UPS\u003c/b> (batteries bridge the gap) / backup \u003cb>generator\u003c/b> → \u003cb>PDU\u003c/b> (distributes power to each rack) → rack.\u003c/li>\u003c/ul>"},{"id":"p7gy5l","k":"q","f":"How is a data center cooled ?","b":"\u003col>\u003cli>Hot/cold aisle containment keeps air streams apart.\u003c/li>\u003cli>Air-conditioning units (CRAC/CRAH) move the heat out.\u003c/li>\u003cli>Chilled water and liquid cooling for very dense racks.\u003c/li>\u003cli>Site and climate choices can cut cooling cost.\u003c/li>\u003c/ol>"},{"id":"1g3ol05","k":"def","f":"PUE (Power Usage Effectiveness)","b":"total facility power ÷ power used by IT equipment. \u003cb>1.0 is ideal\u003c/b>; lower = less energy wasted on cooling and power losses."},{"id":"9qmh2r","k":"tbl","f":"Compare: North-South traffic \u003ci>vs\u003c/i> East-West traffic","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>North-South traffic\u003c/th>\u003cth>East-West traffic\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Between users outside and servers inside the data center\u003c/td>\u003ctd>Between servers inside (replication, microservice calls, data processing)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Seen by the perimeter firewall\u003c/td>\u003ctd>Usually the \u003cb>larger\u003c/b> share; perimeter firewalls rarely see it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"eabqtm","k":"def","f":"Leaf-Spine","b":"every leaf switch connects to every spine switch, so any two servers are the \u003cb>same number of hops\u003c/b> apart."},{"id":"tnhmeo","k":"q","f":"Why use leaf-spine ?","b":"\u003col>\u003cli>Predictable latency (equal hops).\u003c/li>\u003cli>More servers → add leaves; more bandwidth → add spines.\u003c/li>\u003cli>Many equal-cost paths: one failed link barely matters.\u003c/li>\u003c/ol>"},{"id":"16salww","k":"def","f":"Fat-Tree","b":"the idea of many parallel equal paths with full bandwidth; leaf-spine is its common practical form."},{"id":"1bq1ugh","k":"def","f":"Unified data center network","b":"one Ethernet fabric carries user, storage and management traffic instead of a separate network for each (fewer devices and cables, simpler operations; needs priorities and isolation)."},{"id":"otmtf8","k":"q","f":"What are the data-center security takeaways ?","b":"\u003col>\u003cli>Control physical access to racks and cages.\u003c/li>\u003cli>Separate the \u003cb>management network\u003c/b> from user and storage traffic.\u003c/li>\u003cli>Watch east-west traffic, not only the perimeter.\u003c/li>\u003cli>Treat power and cooling redundancy as \u003cb>availability controls\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"oztwg1","k":"tbl","f":"Fill in the table: Model · Who secures what · Key risk · Typical controls","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Who secures what\u003c/th>\u003cth>Key risk\u003c/th>\u003cth>Typical controls\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Private\u003c/td>\u003ctd>The organization, all layers\u003c/td>\u003ctd>Under-resourced patching and monitoring\u003c/td>\u003ctd>Hardening, SIEM, physical access control\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Public\u003c/td>\u003ctd>Shared with the provider\u003c/td>\u003ctd>Misconfigured storage and IAM\u003c/td>\u003ctd>Least privilege, MFA, encryption, posture checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hybrid\u003c/td>\u003ctd>Both sides, plus the link\u003c/td>\u003ctd>Weak link, inconsistent policies\u003c/td>\u003ctd>Encrypted tunnels, unified identity, segmentation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multi-cloud\u003c/td>\u003ctd>Each provider separately\u003c/td>\u003ctd>Bigger attack surface, tool sprawl\u003c/td>\u003ctd>Central identity, policy-as-code, unified logging\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"hcdxgq","k":"q","f":"Mini case — a national bank must keep records in the country, has unpredictable salary-day peaks, and fears one vendor. Which model ?","b":"\u003col>\u003cli>Regulated data → private or \u003cb>hybrid\u003c/b>.\u003c/li>\u003cli>Unpredictable demand → public elasticity.\u003c/li>\u003cli>Fear of one vendor → \u003cb>multi-cloud\u003c/b>.\u003c/li>\u003c/ol>\n\u003cul>\u003cli>Recommendation: \u003cb>hybrid\u003c/b> (records stay in a private/in-country cloud, the app front-end bursts to public), ideally with \u003cb>more than one public provider\u003c/b>.\u003c/li>\u003c/ul>"}]},{"id":"lecture-3-vms-and-containers","label":"L3","title":"Virtual Machines & Containers","cards":[{"id":"2opqjr","k":"def","f":"Virtualization","b":"slicing one physical server into several isolated virtual machines. It is what makes cloud sharing possible."},{"id":"iakpni","k":"q","f":"Why virtualize ? (three reasons)","b":"\u003col>\u003cli>\u003cb>Consolidation\u003c/b>: physical servers usually idle at low utilization; packing many VMs on one host raises utilization and cuts hardware, power and space.\u003c/li>\u003cli>\u003cb>Isolation\u003c/b>: each VM has its own OS and resources; a crash or compromise in one should not reach its neighbours.\u003c/li>\u003cli>\u003cb>Elasticity\u003c/b>: a VM is software — create, clone, resize or move it in minutes. This is the engine behind on-demand IaaS.\u003c/li>\u003c/ol>"},{"id":"1cap4zq","k":"def","f":"Hypervisor (Virtual Machine Monitor)","b":"software that creates VMs and shares CPU, memory and I/O among them."},{"id":"yf6lqw","k":"tbl","f":"Compare: Type 1 — bare metal \u003ci>vs\u003c/i> Type 2 — hosted","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Type 1 — bare metal\u003c/th>\u003cth>Type 2 — hosted\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Runs on\u003c/td>\u003ctd>Directly on the hardware\u003c/td>\u003ctd>As an application on a host OS (Windows / Linux)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>ESXi, Hyper-V, KVM, Xen\u003c/td>\u003ctd>VMware Workstation, VirtualBox\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Used in\u003c/td>\u003ctd>Data centers / cloud providers\u003c/td>\u003ctd>Desktops and labs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"5r9k1y","k":"q","f":"What are the approaches to virtualization ?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Guest OS changed?\u003c/th>\u003cth>Trade-off\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Full virtualization\u003c/td>\u003ctd>Hypervisor emulates the full hardware; \u003cb>binary translation\u003c/b> for privileged instructions\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Compatible, but slower\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Para-virtualization\u003c/td>\u003ctd>Guest knows it is virtual and calls the hypervisor directly (\u003cb>hypercalls\u003c/b>)\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003ctd>Fast, needs a modified OS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hardware-assisted\u003c/td>\u003ctd>CPU extensions (\u003cb>Intel VT-x, AMD-V\u003c/b>) trap privileged operations in hardware\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Fast and compatible — \u003cb>today&#39;s default\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sm-key\">Lab check: if VT-x / AMD-V is \u003cb>disabled in BIOS\u003c/b>, 64-bit guests may fail to start.\u003c/div>"},{"id":"1cfq9gp","k":"q","f":"What does the hypervisor virtualize ?","b":"\u003col>\u003cli>\u003cb>CPU\u003c/b>: schedules vCPUs onto physical cores. \u003cb>Over-subscription\u003c/b> lets total vCPUs exceed cores (efficient, but can cause contention).\u003c/li>\u003cli>\u003cb>Memory\u003c/b>: maps guest memory to host memory; \u003cb>ballooning\u003c/b> and \u003cb>page sharing\u003c/b> reclaim unused RAM.\u003c/li>\u003cli>\u003cb>I/O\u003c/b>: presents virtual disks (often files on shared storage) and virtual NICs (connected to virtual switches).\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Security consequence: \u003cb>whoever controls the hypervisor controls every VM above it\u003c/b> — keep it minimal and patched.\u003c/div>"},{"id":"gehr9v","k":"def","f":"VM","b":"mostly \u003cb>files\u003c/b> — virtual disks plus a configuration — which is why VMs are easy to copy and recover."},{"id":"14bp1eb","k":"q","f":"What is the VM lifecycle ?","b":"\u003col>\u003cli>\u003cb>Create\u003c/b>: pick vCPU, RAM, disk, network; install or use an image.\u003c/li>\u003cli>\u003cb>Run\u003c/b>: start, pause, suspend, resize.\u003c/li>\u003cli>\u003cb>Snapshot\u003c/b>: save the state at a point in time, to roll back after a mistake or failed update.\u003c/li>\u003cli>\u003cb>Clone\u003c/b>: copy a VM or a \u003cb>golden template\u003c/b> to deploy many identical machines.\u003c/li>\u003cli>\u003cb>Retire\u003c/b>: delete the VM and \u003cb>securely wipe\u003c/b> its disks.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Security: snapshots and clones keep \u003cb>old data and old secrets\u003c/b> (keys, passwords, unpatched software). Protect them like backups.\u003c/div>"},{"id":"mqa7b3","k":"def","f":"VM Migration","b":"moving a VM between hosts to balance load, patch hosts, or evacuate failing hardware."},{"id":"17o3ft9","k":"tbl","f":"Compare: Cold migration \u003ci>vs\u003c/i> Live migration","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Cold migration\u003c/th>\u003cth>Live migration\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Shut the VM down, copy it, start it on the new host\u003c/td>\u003ctd>Move a \u003cb>running\u003c/b> VM with almost no downtime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Simple, but there is downtime\u003c/td>\u003ctd>Users usually don&#39;t notice\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"11sp1ld","k":"q","f":"What are the steps of live migration (pre-copy method) ?","b":"\u003col>\u003cli>Copy all memory pages while the VM keeps running.\u003c/li>\u003cli>Re-copy pages that changed (repeat).\u003c/li>\u003cli>Pause briefly; send the last pages and CPU state.\u003c/li>\u003cli>Resume on the new host.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Memory travels over the network: \u003cb>encrypt the migration channel\u003c/b>.\u003c/div>"},{"id":"o25xdb","k":"def","f":"Container","b":"an ordinary process on the \u003cb>host kernel\u003c/b>, wrapped by Linux features that limit what it can see and use. No guest OS."},{"id":"7gcgxk","k":"def","f":"Namespaces","b":"control what a container can \u003cb>SEE\u003c/b> — separate views of processes (PID), network, mounts, hostname and users."},{"id":"1jfol65","k":"def","f":"cgroups (control groups)","b":"control what a container can \u003cb>USE\u003c/b> — limits on CPU, memory and I/O so one container can&#39;t starve the others."},{"id":"7b641o","k":"tbl","f":"Compare: Virtual machine \u003ci>vs\u003c/i> Container","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Virtual machine\u003c/th>\u003cth>Container\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Isolation\u003c/td>\u003ctd>\u003cb>Strong\u003c/b>: separate kernel per VM\u003c/td>\u003ctd>\u003cb>Weaker\u003c/b>: shared host kernel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Startup\u003c/td>\u003ctd>Minutes\u003c/td>\u003ctd>Seconds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Size\u003c/td>\u003ctd>Gigabytes\u003c/td>\u003ctd>Megabytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Density per host\u003c/td>\u003ctd>Tens\u003c/td>\u003ctd>Hundreds\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guest OS\u003c/td>\u003ctd>Any (Windows, Linux…)\u003c/td>\u003ctd>Same kernel family as the host\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stack\u003c/td>\u003ctd>App → Guest OS → Hypervisor → Hardware\u003c/td>\u003ctd>App → Container engine → Host kernel → Hardware\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best for\u003c/td>\u003ctd>Legacy apps, strong tenant separation\u003c/td>\u003ctd>Microservices, CI/CD, scale-out\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1ti4q0s","k":"def","f":"Docker","b":"packages an application and everything it needs, so it runs the same on a laptop, a lab server or a cloud VM."},{"id":"1a3wnok","k":"q","f":"What are Docker&#39;s components ?","b":"\u003col>\u003cli>\u003cb>Dockerfile\u003c/b>: a text recipe — base image, files, commands.\u003c/li>\u003cli>\u003cb>Image\u003c/b>: a read-only, \u003cb>layered\u003c/b> template built from the Dockerfile.\u003c/li>\u003cli>\u003cb>Container\u003c/b>: a running instance of an image, with a thin writable layer.\u003c/li>\u003cli>\u003cb>Engine (daemon)\u003c/b>: builds images and runs containers on the host.\u003c/li>\u003cli>\u003cb>Registry\u003c/b>: stores and distributes images (Docker Hub, private registry).\u003c/li>\u003cli>\u003cb>Volume / Network\u003c/b>: persistent data outside the container; virtual networks between containers.\u003c/li>\u003c/ol>"},{"id":"169e6jd","k":"q","f":"What is the Docker workflow ?","b":"\u003cul>\u003cli>\u003cb>Build → Ship → Run\u003c/b>: Dockerfile —\u003ccode>docker build\u003c/code>→ Image —\u003ccode>docker push\u003c/code>→ Registry —\u003ccode>docker pull\u003c/code>/\u003ccode>docker run\u003c/code>→ Container.\u003c/li>\u003c/ul>"},{"id":"12p5s2r","k":"tbl","f":"Compare: VM risks \u003ci>vs\u003c/i> Container risks","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>VM risks\u003c/th>\u003cth>Container risks\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>VM escape\u003c/b> through a hypervisor flaw\u003c/td>\u003ctd>\u003cb>Kernel exploit\u003c/b> reaches every container\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Side-channel attacks between co-located VMs\u003c/td>\u003ctd>\u003cb>Privileged\u003c/b> containers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stale snapshots\u003c/td>\u003ctd>Vulnerable or untrusted images\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VM sprawl\u003c/td>\u003ctd>\u003cb>Secrets baked into images\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"snhx7z","k":"q","f":"What are the good security practices ?","b":"\u003col>\u003cli>Patch the hypervisor and host kernel; keep them minimal.\u003c/li>\u003cli>Use trusted, scanned images; pin versions; \u003cb>never store secrets in an image\u003c/b>.\u003c/li>\u003cli>Don&#39;t run containers as \u003cb>root\u003c/b> or with \u003ccode>--privileged\u003c/code>; drop capabilities.\u003c/li>\u003cli>Separate sensitive workloads on different hosts or inside VMs.\u003c/li>\u003c/ol>"},{"id":"tntb6d","k":"q","f":"Mini case — VM or container ?","b":"\u003col>\u003cli>Old Windows-only grading system → \u003cb>VM\u003c/b> (needs another OS).\u003c/li>\u003cli>Student portal with registration spikes → \u003cb>containers\u003c/b> (fast scale-out).\u003c/li>\u003cli>Lab where outsiders run untrusted code → \u003cb>VM\u003c/b> (strong isolation).\u003c/li>\u003c/ol>\n\u003cul>\u003cli>They can be combined: containers inside VMs.\u003c/li>\u003c/ul>"}]},{"id":"lecture-4-virtual-networks-and-storage","label":"L4","title":"Virtual Networks & Virtual Storage","cards":[{"id":"1mid7zj","k":"q","f":"Why must the network be built in software in the cloud ?","b":"\u003col>\u003cli>\u003cb>Isolation per tenant\u003c/b>: each customer needs a private network others can&#39;t see, even on the same physical switches.\u003c/li>\u003cli>\u003cb>Agility\u003c/b>: a network, subnet or firewall rule is created in seconds by an \u003cb>API call\u003c/b>, not by a technician with a cable.\u003c/li>\u003cli>\u003cb>Mobility\u003c/b>: when a VM live-migrates it keeps its IP and network policy — the network must \u003cb>follow the VM\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"68aqfy","k":"def","f":"Virtual NIC (vNIC)","b":"a software network card given to a VM, with its own MAC address."},{"id":"2uwzpa","k":"def","f":"Virtual switch (vSwitch)","b":"forwards frames between VMs on the same host \u003cb>in software\u003c/b>; frames for other hosts leave through the physical uplink."},{"id":"k89s3x","k":"q","f":"Compare the VM network modes.","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>How the VM connects\u003c/th>\u003cth>Reaches the internet\u003c/th>\u003cth>Reachable from the LAN\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Bridged\u003c/b>\u003c/td>\u003ctd>A separate device on your real network with its own LAN address\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Servers other machines must reach\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>NAT\u003c/b> (Lab 3)\u003c/td>\u003ctd>Shares the host&#39;s address; VMware translates\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>No (unless port forwarding)\u003c/td>\u003ctd>Labs, safe default\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Host-only\u003c/b>\u003c/td>\u003ctd>Private network between VM and host only\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Isolated testing, malware analysis\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sm-key\">Rule: choose the \u003cb>least exposed\u003c/b> mode that works. Bridged puts the VM directly on your LAN.\u003c/div>"},{"id":"xv4zmm","k":"def","f":"VLAN (Virtual LAN)","b":"splits one physical switch into several separate \u003cb>broadcast domains\u003c/b>."},{"id":"wsntn3","k":"q","f":"How does a VLAN work ?","b":"\u003col>\u003cli>\u003cb>Access ports\u003c/b> belong to one VLAN.\u003c/li>\u003cli>\u003cb>Trunk ports\u003c/b> carry several VLANs; each frame is tagged with \u003cb>802.1Q (4 bytes)\u003c/b>.\u003c/li>\u003cli>The VLAN ID is \u003cb>12 bits → 1 to 4094 usable\u003c/b>.\u003c/li>\u003cli>Different VLANs talk only through a \u003cb>router or Layer 3 switch\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"1n0hoyh","k":"q","f":"Why are VLANs not enough for the cloud ?","b":"\u003col>\u003cli>Only \u003cb>4094\u003c/b> IDs — a cloud has thousands of tenants.\u003c/li>\u003cli>Each VLAN is a flat \u003cb>Layer 2\u003c/b> domain tied to one switched network.\u003c/li>\u003c/ol>"},{"id":"1ep2910","k":"def","f":"Underlay","b":"the real, physical routed IP network (e.g. leaf-spine)."},{"id":"193ryr6","k":"def","f":"Overlay","b":"the virtual network the tenant sees, built \u003cb>on top of\u003c/b> the underlay with tunnels."},{"id":"4m8qnh","k":"q","f":"What are the four steps of an overlay (VXLAN) ?","b":"\u003col>\u003cli>\u003cb>Send\u003c/b>: VM A sends a normal frame to VM B (it doesn&#39;t know a tunnel exists).\u003c/li>\u003cli>\u003cb>Wrap\u003c/b>: the VTEP on Host 1 looks up (VNI, MAC B), finds Host 2, and adds outer Ethernet + IP + \u003cb>UDP 4789\u003c/b> + VXLAN headers (~50 bytes).\u003c/li>\u003cli>\u003cb>Route\u003c/b>: the underlay routes by the \u003cb>outer IP only\u003c/b>; tenant addresses stay hidden.\u003c/li>\u003cli>\u003cb>Unwrap\u003c/b>: the VTEP on Host 2 reads the VNI, removes the outer headers, and delivers the original frame to VM B.\u003c/li>\u003c/ol>"},{"id":"19fni3p","k":"def","f":"VXLAN","b":"wraps the tenant&#39;s whole Ethernet frame inside a \u003cb>UDP\u003c/b> packet — &quot;Layer 2 over Layer 3&quot;."},{"id":"6en214","k":"def","f":"VNI (VXLAN Network Identifier)","b":"24 bits → about \u003cb>16 million\u003c/b> virtual networks (2²⁴)."},{"id":"1nehzvc","k":"def","f":"VTEP (VXLAN Tunnel Endpoint)","b":"sits in the host&#39;s vSwitch or a leaf switch, and wraps/unwraps frames."},{"id":"1fsqyza","k":"q","f":"What is the VXLAN header layout ?","b":"\u003cul>\u003cli>Outer Ethernet \u003cb>14 B\u003c/b> · Outer IP \u003cb>20 B\u003c/b> · UDP \u003cb>8 B (port 4789)\u003c/b> · VXLAN header \u003cb>8 B (carries the VNI)\u003c/b> · inner Ethernet frame → ≈ \u003cb>50 B overhead\u003c/b>.\u003c/li>\u003c/ul>"},{"id":"1fm6zxq","k":"def","f":"MTU pitfall","b":"the 50 extra bytes can push packets over 1500 → raise the underlay MTU (e.g. \u003cb>9000\u003c/b>) or lower the VM MTU to about \u003cb>1450\u003c/b>."},{"id":"1wgvt6v","k":"tbl","f":"Compare: VLAN \u003ci>vs\u003c/i> VXLAN","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>VLAN\u003c/th>\u003cth>VXLAN\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Segment ID\u003c/td>\u003ctd>12 bits: 4094 usable\u003c/td>\u003ctd>24-bit VNI: ~16 million\u003c/td>\u003c/tr>\u003ctr>\u003ctd>How it isolates\u003c/td>\u003ctd>A tag on the Ethernet frame (802.1Q)\u003c/td>\u003ctd>The frame is wrapped in UDP/IP (tunnel)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reach\u003c/td>\u003ctd>Within one switched Layer 2 network\u003c/td>\u003ctd>Across a routed IP network, even between sites\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overhead\u003c/td>\u003ctd>4 bytes\u003c/td>\u003ctd>~50 bytes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Configuration\u003c/td>\u003ctd>Switch ports and trunks, often manual\u003c/td>\u003ctd>Tunnel endpoints + control plane (e.g. BGP EVPN), automated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best for\u003c/td>\u003ctd>Campus, small or fixed data centers\u003c/td>\u003ctd>Multi-tenant clouds, large data centers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1r5d1o","k":"q","f":"Map the public-cloud network building blocks.","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Building block\u003c/th>\u003cth>Does\u003c/th>\u003cth>AWS\u003c/th>\u003cth>Azure\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Virtual network\u003c/td>\u003ctd>Your private address space\u003c/td>\u003ctd>VPC\u003c/td>\u003ctd>VNet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Subnet\u003c/td>\u003ctd>A slice, public or private\u003c/td>\u003ctd>Subnet\u003c/td>\u003ctd>Subnet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Route table\u003c/td>\u003ctd>Where traffic goes next\u003c/td>\u003ctd>Route table\u003c/td>\u003ctd>Route table (UDR)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Internet access\u003c/td>\u003ctd>In/outbound paths\u003c/td>\u003ctd>Internet gateway, NAT gateway\u003c/td>\u003ctd>Public IP, NAT Gateway\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Firewall rules\u003c/td>\u003ctd>Allow/deny by port, protocol, source\u003c/td>\u003ctd>Security group (\u003cb>stateful\u003c/b>), NACL (\u003cb>stateless\u003c/b>)\u003c/td>\u003ctd>NSG\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sm-key\">Default deny. \u003cb>Never\u003c/b> allow SSH (22) or RDP (3389) from \u003cb>0.0.0.0/0\u003c/b>. Keep databases in \u003cb>private\u003c/b> subnets.\u003c/div>"},{"id":"5o64ml","k":"def","f":"SDN (Software-Defined Networking)","b":"separates the \u003cb>control plane\u003c/b> (decides the rules, centralized in a controller) from the \u003cb>data plane\u003c/b> (switches that only forward packets by the rules)."},{"id":"4ahk4j","k":"tbl","f":"Compare: Traditional network \u003ci>vs\u003c/i> SDN","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Traditional network\u003c/th>\u003cth>SDN\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Every switch runs its own control logic, configured one by one\u003c/td>\u003ctd>Logic centralized in software (the controller)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hard to change and automate\u003c/td>\u003ctd>One policy change reaches every switch in seconds, via API\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"dk6d17","k":"q","f":"What are the SDN layers and APIs ?","b":"\u003col>\u003cli>\u003cb>Applications\u003c/b> (routing, firewall, load balancing, monitoring) — talk to the controller through the \u003cb>Northbound API (REST)\u003c/b>.\u003c/li>\u003cli>\u003cb>SDN controller\u003c/b> = control plane, global view.\u003c/li>\u003cli>\u003cb>Switches\u003c/b> = data plane — controlled through the \u003cb>Southbound API (OpenFlow)\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"1oz56su","k":"def","f":"OpenFlow","b":"a southbound protocol; the switch keeps \u003cb>flow tables\u003c/b> — if a packet \u003cb>matches\u003c/b> these fields, perform this \u003cb>action\u003c/b>."},{"id":"omzq82","k":"tbl","f":"Fill in the table: Priority · Match · Action","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Priority\u003c/th>\u003cth>Match\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>300\u003c/td>\u003ctd>src 10.0.1.5, TCP 22\u003c/td>\u003ctd>Drop\u003c/td>\u003c/tr>\u003ctr>\u003ctd>200\u003c/td>\u003ctd>dst 10.0.2.0/24\u003c/td>\u003ctd>Forward to port 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>100\u003c/td>\u003ctd>VLAN 20\u003c/td>\u003ctd>Forward to port 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>anything else (\u003cb>table-miss\u003c/b>)\u003c/td>\u003ctd>Send to controller\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"rpdmka","k":"q","f":"What happens when no flow entry matches ?","b":"\u003col>\u003cli>The switch sends a \u003cb>packet-in\u003c/b> message to the controller.\u003c/li>\u003cli>The controller decides and replies with a \u003cb>flow-mod\u003c/b>.\u003c/li>\u003cli>Later packets of that flow match the new entry and are forwarded at full speed.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">OVS is the most common OpenFlow software switch; \u003cb>P4\u003c/b> goes further and programs how the switch parses packets.\u003cbr>Security: the controller is a \u003cb>high-value target\u003c/b> — whoever controls it controls the network. Isolate it, authenticate switches, use TLS, restrict API access.\u003c/div>"},{"id":"qygsq7","k":"tbl","f":"Compare: Block \u003ci>vs\u003c/i> File \u003ci>vs\u003c/i> Object","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Block\u003c/th>\u003cth>File\u003c/th>\u003cth>Object\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Data unit\u003c/td>\u003ctd>Fixed-size blocks\u003c/td>\u003ctd>Files in folders\u003c/td>\u003ctd>Object + metadata + ID\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Access\u003c/td>\u003ctd>Raw disk: iSCSI, Fibre Channel\u003c/td>\u003ctd>NFS, SMB over the network\u003c/td>\u003ctd>HTTP \u003cb>REST API\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Examples\u003c/td>\u003ctd>AWS EBS, Azure Disk, SAN\u003c/td>\u003ctd>AWS EFS, Azure Files, NAS\u003c/td>\u003ctd>AWS \u003cb>S3\u003c/b>, Azure Blob, MinIO\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Strength\u003c/td>\u003ctd>Low latency, high speed\u003c/td>\u003ctd>Familiar, shared by many users\u003c/td>\u003ctd>Huge scale, cheap, durable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limit\u003c/td>\u003ctd>One VM at a time, no sharing\u003c/td>\u003ctd>Scaling and locking get harder\u003c/td>\u003ctd>Not for databases or editing in place\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Best for\u003c/td>\u003ctd>VM disks, databases\u003c/td>\u003ctd>Shared folders, home directories\u003c/td>\u003ctd>Backups, media, logs, big data\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"k0ud7r","k":"tbl","f":"Compare: Traditional storage \u003ci>vs\u003c/i> Software-defined storage","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Traditional storage\u003c/th>\u003cth>Software-defined storage\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>DAS\u003c/b> (disks in one server), \u003cb>NAS\u003c/b> (file server), \u003cb>SAN\u003c/b> (dedicated block network)\u003c/td>\u003ctd>Software on commodity servers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Scale-up\u003c/b>: buy a bigger, costlier array\u003c/td>\u003ctd>\u003cb>Scale-out\u003c/b>: add nodes, capacity and speed grow\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vendor hardware and tools\u003c/td>\u003ctd>Pools many disks into one logical store; policies by API\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>Examples: \u003cb>Ceph, HDFS, VMware vSAN, MinIO\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1b9gfn8","k":"def","f":"Replication","b":"3 full copies on different nodes — simple and fast, but \u003cb>3× the space\u003c/b>."},{"id":"qqov47","k":"def","f":"Erasure coding","b":"data split into 4 pieces + 2 parity — survives \u003cb>2 failures at 1.5× space\u003c/b>."},{"id":"1jkym23","k":"tbl","f":"Fill in the table: Area · Typical risk · Good practice","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Typical risk\u003c/th>\u003cth>Good practice\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VLAN &amp; vSwitch\u003c/td>\u003ctd>VLAN hopping via trunk misconfiguration; unseen east-west traffic\u003c/td>\u003ctd>Disable unused ports, fix native VLAN, micro-segmentation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overlay (VXLAN)\u003c/td>\u003ctd>Unencrypted tunnels; attacker on the underlay reads/injects\u003c/td>\u003ctd>Secure the underlay; IPsec or WireGuard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud network rules\u003c/td>\u003ctd>Security groups open to 0.0.0.0/0; exposed databases\u003c/td>\u003ctd>Least privilege, private subnets, rule audits\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SDN controller\u003c/td>\u003ctd>Single point of control and failure; rogue switches\u003c/td>\u003ctd>Isolate, TLS, authenticate, redundant controllers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage\u003c/td>\u003ctd>Public buckets, unencrypted data, leaked snapshots/backups\u003c/td>\u003ctd>Block public access, encrypt at rest &amp; in transit, manage keys, versioning\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1uj0rz5","k":"q","f":"Mini case — university private cloud (Teaching, Research, Administration): which storage for each need ?","b":"\u003col>\u003cli>Exam PDFs for 2,000 students → \u003cb>object\u003c/b> (scale, cheap, read-mostly).\u003c/li>\u003cli>Lab VM disks → \u003cb>block\u003c/b> (low latency, one VM per disk).\u003c/li>\u003cli>Shared Linux home folder → \u003cb>file\u003c/b> (NFS/SMB, shared).\u003c/li>\u003c/ol>\n\u003cul>\u003cli>Keep student VMs away from admin: separate segments (VLAN/VXLAN per tenant) + default-deny firewall rules. VLANs may be enough for 3 tenants; move to \u003cb>VXLAN\u003c/b> when tenants/segments grow or span sites.\u003c/li>\u003c/ul>"}]},{"id":"lecture-5-distributed-systems-and-cloud-native","label":"L5","title":"Distributed Systems & Cloud-Native","cards":[{"id":"gfwneu","k":"q","f":"Why distribute ?","b":"\u003col>\u003cli>\u003cb>Scale\u003c/b>: data and traffic exceed what one server can store or process.\u003c/li>\u003cli>\u003cb>Availability\u003c/b>: if one machine dies, another continues.\u003c/li>\u003cli>\u003cb>Locality\u003c/b>: place data near users and near the computation to cut latency.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">The price: machines fail independently, messages are delayed or lost, and clocks disagree.\u003c/div>"},{"id":"uf8a3u","k":"q","f":"What can go wrong in a distributed system ?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Failure\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Crash\u003c/td>\u003ctd>A node stops and may restart\u003c/td>\u003ctd>Power loss, kernel panic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Message loss / delay\u003c/td>\u003ctd>Arrives late, twice, or never\u003c/td>\u003ctd>Congested link\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Network partition\u003c/td>\u003ctd>Cluster splits into groups that can&#39;t talk\u003c/td>\u003ctd>Switch or inter-site link fails\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clock skew\u003c/td>\u003ctd>Nodes disagree about time\u003c/td>\u003ctd>Drifting clocks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Byzantine\u003c/b>\u003c/td>\u003ctd>A node lies or behaves arbitrarily\u003c/td>\u003ctd>Compromised or buggy node\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sm-key\">Raft and Paxos tolerate crashes and lost messages, \u003cb>not Byzantine nodes\u003c/b> — authenticate membership.\u003c/div>"},{"id":"m1erl3","k":"def","f":"Consensus","b":"a group of nodes agrees on a \u003cb>single value\u003c/b>, even when some nodes fail."},{"id":"bs15no","k":"q","f":"Where is consensus needed ?","b":"\u003col>\u003cli>Electing \u003cb>one leader\u003c/b>.\u003c/li>\u003cli>A \u003cb>replicated log\u003c/b> of operations in the same order.\u003c/li>\u003cli>Distributed locks and configuration.\u003c/li>\u003cli>Committing a transaction across nodes.\u003c/li>\u003c/ol>"},{"id":"1mhvdss","k":"q","f":"What are the required properties of consensus ?","b":"\u003col>\u003cli>\u003cb>Agreement\u003c/b>: no two nodes decide differently.\u003c/li>\u003cli>\u003cb>Validity\u003c/b>: the decided value was proposed by someone.\u003c/li>\u003cli>\u003cb>Termination\u003c/b>: every working node eventually decides.\u003c/li>\u003c/ol>"},{"id":"47t5gb","k":"def","f":"FLP result","b":"no algorithm can guarantee agreement in a fully asynchronous network with even one crash — real protocols use \u003cb>timeouts\u003c/b>."},{"id":"hiy87r","k":"def","f":"Quorum (majority)","b":"any two majorities share at least one node, so two groups can never decide differently."},{"id":"14w5bw9","k":"tbl","f":"Fill in the table: Nodes (N) · Majority · Failures tolerated","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Nodes (N)\u003c/th>\u003cth>Majority\u003c/th>\u003cth>Failures tolerated\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>2\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>3\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>4\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1hrnkh1","k":"def","f":"Paxos (Lamport)","b":"the classic consensus algorithm — proven correct but famously hard to understand."},{"id":"rify4g","k":"q","f":"What are the Paxos roles ?","b":"\u003col>\u003cli>\u003cb>Proposer\u003c/b>: suggests a value and drives the protocol.\u003c/li>\u003cli>\u003cb>Acceptor\u003c/b>: votes; a value is chosen when a \u003cb>majority\u003c/b> of acceptors accept it.\u003c/li>\u003cli>\u003cb>Learner\u003c/b>: finds out which value was chosen and applies it.\u003c/li>\u003c/ol>"},{"id":"8bz6af","k":"q","f":"What are the two Paxos phases ?","b":"\u003col>\u003cli>\u003cb>Prepare\u003c/b>: proposer sends Prepare(n); acceptors reply \u003cb>Promise(n)\u003c/b> — ignore lower numbers, report any value already accepted.\u003c/li>\u003cli>\u003cb>Accept\u003c/b>: with a majority of promises, proposer sends Accept(n, v); a majority of accepts → v is chosen.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Multi-Paxos (stable leader) is used in Google \u003cb>Chubby\u003c/b> and \u003cb>Spanner\u003c/b>, and \u003cb>Ceph\u003c/b> monitors.\u003c/div>"},{"id":"xnu6qx","k":"def","f":"Raft","b":"consensus designed to be \u003cb>understandable\u003c/b>, with \u003cb>one strong leader\u003c/b> that replicates every change to followers."},{"id":"stdv68","k":"q","f":"What are the three parts of Raft ?","b":"\u003col>\u003cli>\u003cb>Leader election\u003c/b>. 2. \u003cb>Log replication\u003c/b>. 3. \u003cb>Safety\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"xnsmzq","k":"def","f":"Term","b":"a logical clock — each election starts a new term."},{"id":"tju8y8","k":"def","f":"Heartbeat","b":"an empty AppendEntries the leader sends regularly to stay in charge."},{"id":"1ogc1wz","k":"q","f":"What are Raft&#39;s two RPCs ?","b":"\u003cul>\u003cli>\u003cb>RequestVote\u003c/b> (elections) and \u003cb>AppendEntries\u003c/b> (replication + heartbeat).\u003c/li>\u003c/ul>"},{"id":"1x9ct0g","k":"q","f":"What are the Raft node states and transitions ?","b":"\u003cul>\u003cli>\u003cb>Follower\u003c/b> → (election timeout) → \u003cb>Candidate\u003c/b> → (majority of votes) → \u003cb>Leader\u003c/b>; a leader/candidate that sees a \u003cb>higher term\u003c/b> steps down to follower.\u003c/li>\u003c/ul>"},{"id":"zbrkur","k":"q","f":"How does leader election work ?","b":"\u003col>\u003cli>\u003cb>Timeout\u003c/b>: the leader goes silent; followers wait a \u003cb>random\u003c/b> timeout (~150–300 ms).\u003c/li>\u003cli>\u003cb>Candidate\u003c/b>: the first to time out increments the term, votes for itself, asks for votes.\u003c/li>\u003cli>\u003cb>Vote\u003c/b>: each node votes at most \u003cb>once per term\u003c/b>.\u003c/li>\u003cli>\u003cb>Leader\u003c/b>: with a majority (e.g. 3 of 5) it becomes leader and sends heartbeats.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">\u003cb>Split vote\u003c/b> → nobody wins → new election; random timeouts make another tie unlikely.\u003c/div>"},{"id":"rajtj7","k":"q","f":"How does log replication work ?","b":"\u003col>\u003cli>Client sends a command to the leader.\u003c/li>\u003cli>Leader appends it to its own log.\u003c/li>\u003cli>Leader sends \u003cb>AppendEntries\u003c/b> to followers.\u003c/li>\u003cli>When a \u003cb>majority\u003c/b> has stored it → \u003cb>commit\u003c/b>.\u003c/li>\u003cli>Apply to the state machine and reply to the client.\u003c/li>\u003c/ol>"},{"id":"e1t9aw","k":"tbl","f":"Fill in the table: Raft under failure · What happens · Why safe","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Raft under failure\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Why safe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Leader crashes\u003c/td>\u003ctd>Followers time out, elect a new leader in a higher term\u003c/td>\u003ctd>Committed entries are on a majority\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Follower crashes\u003c/td>\u003ctd>Leader continues while a majority lives; follower catches up later\u003c/td>\u003ctd>No decision needs every node\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Partition 3 | 2\u003c/td>\u003ctd>3-side keeps a leader; 2-side can&#39;t commit\u003c/td>\u003ctd>Only one side has a majority → \u003cb>no split brain\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Old leader returns\u003c/td>\u003ctd>Sees a higher term, steps down\u003c/td>\u003ctd>Stale leaders can&#39;t commit\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1ysdk33","k":"def","f":"Election restriction","b":"a candidate whose log is behind \u003cb>cannot win\u003c/b>, protecting committed data."},{"id":"1i4xnnr","k":"tbl","f":"Fill in the table: System · Protocol · Keeps in agreement","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>System\u003c/th>\u003cth>Protocol\u003c/th>\u003cth>Keeps in agreement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>etcd\u003c/b>\u003c/td>\u003ctd>Raft\u003c/td>\u003ctd>All Kubernetes cluster state, including Secrets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consul\u003c/td>\u003ctd>Raft\u003c/td>\u003ctd>Service discovery and configuration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ZooKeeper\u003c/td>\u003ctd>ZAB (Paxos-like)\u003c/td>\u003ctd>Coordination for Hadoop, Kafka, HBase\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ceph\u003c/td>\u003ctd>Paxos\u003c/td>\u003ctd>Cluster map held by monitors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Spanner, CockroachDB\u003c/td>\u003ctd>Paxos, Raft\u003c/td>\u003ctd>Replicated data in global SQL\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ffa7ol","k":"tbl","f":"Fill in the table: Level · Guarantee · Example · Cost","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Guarantee\u003c/th>\u003cth>Example\u003c/th>\u003cth>Cost\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Strong\u003c/b> (linearizable)\u003c/td>\u003ctd>Every read returns the latest write\u003c/td>\u003ctd>Bank balance, leader lock\u003c/td>\u003ctd>Highest latency; may refuse requests in a partition\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Sequential\u003c/b>\u003c/td>\u003ctd>Same order for everyone, not necessarily real time\u003c/td>\u003ctd>Replicated log\u003c/td>\u003ctd>Slightly cheaper\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Causal\u003c/b>\u003c/td>\u003ctd>If A caused B, everyone sees A before B\u003c/td>\u003ctd>Comment after its post\u003c/td>\u003ctd>Moderate\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Eventual\u003c/b>\u003c/td>\u003ctd>Replicas converge when writes stop; reads may be stale\u003c/td>\u003ctd>DNS, like counters, cart\u003c/td>\u003ctd>Fastest, most available\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"19w6xh2","k":"def","f":"CAP theorem","b":"in a network \u003cb>Partition\u003c/b>, you must choose \u003cb>Consistency\u003c/b> (reject some requests) or \u003cb>Availability\u003c/b> (answer, maybe stale)."},{"id":"1ukf54d","k":"tbl","f":"Fill in the table: Choice · During a partition · Examples","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Choice\u003c/th>\u003cth>During a partition\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>CP\u003c/b>\u003c/td>\u003ctd>Minority side refuses requests\u003c/td>\u003ctd>etcd, ZooKeeper, HBase\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>AP\u003c/b>\u003c/td>\u003ctd>Every side answers; reconcile later\u003c/td>\u003ctd>Cassandra, DynamoDB, CouchDB\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1sl6sw","k":"def","f":"PACELC","b":"without a partition, the trade-off is \u003cb>latency vs consistency\u003c/b>."},{"id":"1k73l7w","k":"tbl","f":"Compare: Conventional \u003ci>vs\u003c/i> Cloud-native","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Aspect\u003c/th>\u003cth>Conventional\u003c/th>\u003cth>Cloud-native\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Architecture\u003c/td>\u003ctd>One large \u003cb>monolith\u003c/b>\u003c/td>\u003ctd>Small independent \u003cb>microservices\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Runtime\u003c/td>\u003ctd>Installed on a specific server/VM\u003c/td>\u003ctd>Containers managed by an orchestrator (Kubernetes)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scaling\u003c/td>\u003ctd>Scale \u003cb>up\u003c/b> (bigger server)\u003c/td>\u003ctd>Scale \u003cb>out\u003c/b> (more small instances, automatic)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failure\u003c/td>\u003ctd>Avoided; assumes reliable hardware\u003c/td>\u003ctd>\u003cb>Expected\u003c/b>; designed to self-heal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>State\u003c/td>\u003ctd>Stored on the local server\u003c/td>\u003ctd>Services \u003cb>stateless\u003c/b>; state in external stores\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Releases\u003c/td>\u003ctd>Rare, large, manual\u003c/td>\u003ctd>Frequent, small, automated (\u003cb>CI/CD\u003c/b>)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"xp6kl0","k":"def","f":"MapReduce","b":"a programming model — split huge data, process pieces in parallel (\u003cb>map\u003c/b>), group by key (\u003cb>shuffle and sort\u003c/b>), then combine (\u003cb>reduce\u003c/b>)."},{"id":"167xhg4","k":"q","f":"Word count example — lines &quot;cloud is big&quot;, &quot;cloud is shared&quot;, &quot;big data is big&quot; ?","b":"\u003col>\u003cli>\u003cb>Map\u003c/b> emits (word, 1) for every word.\u003c/li>\u003cli>\u003cb>Shuffle\u003c/b> groups: big:[1,1,1] cloud:[1,1] data:[1] is:[1,1,1] shared:[1].\u003c/li>\u003cli>\u003cb>Reduce\u003c/b> sums: big 3, cloud 2, data 1, is 3, shared 1 (total 10).\u003c/li>\u003c/ol>"},{"id":"11dir5r","k":"q","f":"What are two key ideas of MapReduce ?","b":"\u003col>\u003cli>\u003cb>Bring computation to the data\u003c/b>: map tasks run on the machines that already store the block.\u003c/li>\u003cli>\u003cb>Failures are handled\u003c/b>: a failed or slow task is simply re-run elsewhere.\u003c/li>\u003c/ol>"},{"id":"1xurdko","k":"def","f":"Amdahl&#39;s law","b":"S(N) = 1 / ((1 − p) + p / N), p = parallel fraction, N = machines."},{"id":"1lv1d91","k":"def","f":"Hadoop","b":"three layers — \u003cb>HDFS\u003c/b> (distributed storage), \u003cb>YARN\u003c/b> (resource scheduling), \u003cb>MapReduce\u003c/b> (processing engine)."},{"id":"xn6kb5","k":"def","f":"HDFS","b":"files cut into \u003cb>128 MB blocks\u003c/b>, each stored on \u003cb>3 DataNodes\u003c/b>; the \u003cb>NameNode\u003c/b> holds metadata (file → blocks → DataNodes); clients read directly from DataNodes."},{"id":"18nsnq3","k":"q","f":"How is the NameNode single point of failure solved ?","b":"\u003cul>\u003cli>\u003cb>Active + standby\u003c/b> NameNode, edits kept in a quorum of \u003cb>JournalNodes\u003c/b>, failover coordinated by \u003cb>ZooKeeper\u003c/b> (consensus again).\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">Languages: Java natively; \u003cb>Hadoop Streaming\u003c/b> lets any stdin/stdout program (Python, Perl) be a mapper/reducer; \u003cb>Hive\u003c/b> (SQL-like) and \u003cb>Pig\u003c/b> (scripting) add layers.\u003c/div>"},{"id":"1jkym23","k":"tbl","f":"Fill in the table: Area · Typical risk · Good practice","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Typical risk\u003c/th>\u003cth>Good practice\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Consensus cluster (etcd, ZooKeeper)\u003c/td>\u003ctd>Unauthenticated members; whoever controls a majority controls the state (incl. Kubernetes Secrets)\u003c/td>\u003ctd>Mutual TLS, client auth, encryption at rest, isolation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consistency &amp; CAP\u003c/td>\u003ctd>Stale reads honour revoked permissions; split brain\u003c/td>\u003ctd>Strong reads for authz, short token lifetimes, fencing tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hadoop &amp; HDFS\u003c/td>\u003ctd>Open web UIs/RPC ports, weak default auth\u003c/td>\u003ctd>\u003cb>Kerberos\u003c/b>, ACLs, encryption zones, audit logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cloud-native apps\u003c/td>\u003ctd>Vulnerable images, secrets in code, over-privileged accounts, supply chain\u003c/td>\u003ctd>Image scanning &amp; signing, secret managers, least privilege\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MapReduce jobs\u003c/td>\u003ctd>Untrusted code; poisoned input\u003c/td>\u003ctd>Tenant isolation, quotas, input validation, sandboxing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"196227n","k":"q","f":"Mini case — exam results replicated across three sites: grades vs &quot;last login&quot; ?","b":"\u003col>\u003cli>Grades → \u003cb>strong / CP\u003c/b> (must never be stale or conflicting).\u003c/li>\u003cli>Last login → \u003cb>eventual / AP\u003c/b> is acceptable.\u003c/li>\u003cli>Raft with \u003cb>3 nodes, one per site\u003c/b> (or 5 across sites): if one site is cut off, the other two keep a majority and continue; the isolated site can&#39;t commit.\u003c/li>\u003cli>Failed logins with MapReduce: \u003cb>map\u003c/b> emits (studentId, 1) for each failed-login line; \u003cb>reduce\u003c/b> sums per student and outputs those above a threshold.\u003c/li>\u003c/ol>"}]}];</script>
