<script>window.DECKS = [{"id":"lecture-1-principles-and-core-concepts","label":"L1","title":"Principles & Core Concepts","cards":[{"id":"1a1yrum","k":"def","f":"Computer network","b":"a group of connected devices that communicate and exchange information (computers, phones, servers, switches, routers, access points, cameras, printers, IoT)."},{"id":"fx8t36","k":"tbl","f":"Fill in the table: Device · Main role","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Device\u003c/th>\u003cth>Main role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Switch\u003c/td>\u003ctd>Connects devices \u003cb>inside\u003c/b> a local network\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Router\u003c/td>\u003ctd>Connects one network to \u003cb>another\u003c/b> / the Internet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Server\u003c/td>\u003ctd>Provides data or services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wireless AP\u003c/td>\u003ctd>Connects wireless devices (provides Wi-Fi)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ssw7cf","k":"def","f":"Network security","b":"protecting network devices, services, users and information against \u003cb>unauthorized access, misuse, modification, damage, or interruption\u003c/b>."},{"id":"1eadbkc","k":"q","f":"What does network security protect ?","b":"\u003col>\u003cli>Stored and transmitted data.\u003c/li>\u003cli>User accounts and passwords.\u003c/li>\u003cli>Servers, applications, devices and communication channels.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Key idea: connecting devices improves communication, but \u003cb>every connection can also create a security risk\u003c/b>.\u003c/div>"},{"id":"1sypety","k":"q","f":"What are the common consequences of a security incident ?","b":"\u003col>\u003cli>Loss of confidential information.\u003c/li>\u003cli>Financial loss.\u003c/li>\u003cli>Service interruption.\u003c/li>\u003cli>Loss of important files.\u003c/li>\u003cli>Legal or reputation problems.\u003c/li>\u003cli>Loss of user trust.\u003c/li>\u003c/ol>"},{"id":"7m04a9","k":"def","f":"Confidentiality","b":"only authorized users can \u003cb>read\u003c/b> information."},{"id":"1gau08w","k":"def","f":"Integrity","b":"information stays \u003cb>correct\u003c/b> and is changed only by authorized users."},{"id":"1rsi6eu","k":"def","f":"Availability","b":"authorized users can access systems and data \u003cb>when needed\u003c/b>."},{"id":"1smy4xq","k":"tbl","f":"Fill in the table: Objective · Typical protections · Violation example","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Objective\u003c/th>\u003cth>Typical protections\u003c/th>\u003cth>Violation example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>Encryption, passwords, access control, VPN\u003c/td>\u003ctd>Attacker captures an unencrypted username and password\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>Hashes, digital signatures, permissions, logging\u003c/td>\u003ctd>&quot;Transfer $100&quot; changed to &quot;Transfer $1,000&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>Backups, redundancy, UPS, updates, DoS protection\u003c/td>\u003ctd>Server flooded with traffic, can&#39;t serve users\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"hahlra","k":"q","f":"Apply CIA to a university examination system.","b":"\u003col>\u003cli>Confidentiality → students can&#39;t view exam questions before the exam.\u003c/li>\u003cli>Integrity → students can&#39;t change grades.\u003c/li>\u003cli>Availability → the system is accessible during the exam.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">A secure system needs \u003cb>all three\u003c/b>. Protecting only one is not enough.\u003c/div>"},{"id":"1yyeoyc","k":"tbl","f":"Fill in the table: Concept · Question · Example","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Concept\u003c/th>\u003cth>Question\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Authentication\u003c/b>\u003c/td>\u003ctd>Who are you?\u003c/td>\u003ctd>Password, fingerprint, smart card, OTP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Authorization\u003c/b>\u003c/td>\u003ctd>What are you allowed to do?\u003c/td>\u003ctd>Student views grades; teacher modifies grades\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Accountability\u003c/b>\u003c/td>\u003ctd>What did you do?\u003c/td>\u003ctd>Logs record who changed data, when, from which device\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"fl84fr","k":"def","f":"Asset","b":"anything valuable that must be protected."},{"id":"odk121","k":"def","f":"Threat","b":"something that can \u003cb>potentially\u003c/b> cause harm."},{"id":"mkp6fn","k":"def","f":"Vulnerability","b":"a \u003cb>weakness\u003c/b> in a system, device, configuration, policy or procedure."},{"id":"har5in","k":"def","f":"Attack","b":"an \u003cb>intentional action\u003c/b> that tries to exploit a vulnerability."},{"id":"um76v8","k":"def","f":"Risk","b":"the possibility that a threat exploits a vulnerability and causes harm. \u003cb>Risk ≈ Likelihood × Impact\u003c/b>."},{"id":"1jsknau","k":"def","f":"Security control","b":"a protection used to \u003cb>reduce risk\u003c/b>."},{"id":"18bzetz","k":"tbl","f":"Compare: Passive attack \u003ci>vs\u003c/i> Active attack","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Passive attack\u003c/th>\u003cth>Active attack\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Observes\u003c/b> or collects information\u003c/td>\u003ctd>\u003cb>Changes\u003c/b> information or system operation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normally doesn&#39;t modify data\u003c/td>\u003ctd>May modify, delete, inject or disrupt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Often \u003cb>difficult to detect\u003c/b>\u003c/td>\u003ctd>Often produces visible effects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Mainly affects \u003cb>confidentiality\u003c/b>\u003c/td>\u003ctd>Mainly affects \u003cb>integrity and availability\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sniffing, traffic analysis\u003c/td>\u003ctd>DoS, malware, spoofing, unauthorized access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"zrqhk7","k":"tbl","f":"Fill in the table: Category · Purpose · Examples","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Administrative\u003c/b>\u003c/td>\u003ctd>Rules and human processes\u003c/td>\u003ctd>Security policy, password policy, training, incident procedures\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Technical\u003c/b>\u003c/td>\u003ctd>Hardware or software protection\u003c/td>\u003ctd>Firewall, encryption, antivirus, IDS, authentication, ACLs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Physical\u003c/b>\u003c/td>\u003ctd>Protect facilities and equipment\u003c/td>\u003ctd>Locks, guards, cameras, access cards, fire alarms, backup power\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"wydgwe","k":"q","f":"How should controls be chosen ?","b":"\u003cul>\u003cli>According to the \u003cb>assets\u003c/b> protected, likely \u003cb>threats\u003c/b>, known \u003cb>vulnerabilities\u003c/b>, and the \u003cb>impact\u003c/b> of an incident. Strong security combines all three categories.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">A firewall can&#39;t replace user training; a strong password can&#39;t replace physical protection of the server room.\u003c/div>"},{"id":"84pbfb","k":"def","f":"Defense in depth","b":"using \u003cb>several layers\u003c/b> of security so that if one layer fails, another still reduces the damage."},{"id":"cumgjs","k":"q","f":"List the layers of defense in depth from the lecture.","b":"\u003col>\u003cli>Locked server room — physical protection.\u003c/li>\u003cli>Authentication &amp; strong passwords — control user access.\u003c/li>\u003cli>Firewall &amp; antivirus — block threats and malware.\u003c/li>\u003cli>Encryption — protect sensitive data.\u003c/li>\u003cli>Network monitoring — detect suspicious activity.\u003c/li>\u003cli>Regular backups — recover lost data.\u003c/li>\u003cli>Security awareness training — reduce human errors.\u003c/li>\u003c/ol>"},{"id":"6eromh","k":"q","f":"University case study — assets, threats, controls ?","b":"\u003cul>\u003cli>\u003cb>Assets\u003c/b>: student records, exam questions, passwords, research files.\u003c/li>\u003cli>\u003cb>Threats / vulnerabilities\u003c/b>: attackers, malware, weak passwords, old software, open Wi-Fi, no backups.\u003c/li>\u003cli>\u003cb>Controls\u003c/b>: MFA, firewall, encryption, updates, antivirus, monitoring, backups, training.\u003c/li>\u003c/ul>"},{"id":"w9ukpe","k":"q","f":"What are the rules for ethical use of security tools ?","b":"\u003col>\u003cli>Work only on systems you have \u003cb>permission\u003c/b> for.\u003c/li>\u003cli>Follow laboratory and university rules.\u003c/li>\u003cli>Don&#39;t access other users&#39; files or capture private information.\u003c/li>\u003cli>Don&#39;t scan external systems without authorization.\u003c/li>\u003cli>Protect passwords and report security problems to the instructor.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Technical ability does \u003cb>not\u003c/b> provide legal permission.\u003c/div>"}]},{"id":"lecture-2-layer-2-security","label":"L2","title":"Layer 2 (Ethernet) Security","cards":[{"id":"8chdyf","k":"def","f":"Layer 2 (Data Link)","b":"provides \u003cb>local\u003c/b> network communication using frames, MAC addresses, switches and VLANs."},{"id":"7o30hi","k":"def","f":"Ethernet","b":"the most common wired LAN technology; information is carried in \u003cb>frames\u003c/b>."},{"id":"1sin2o6","k":"q","f":"What are the fields of an Ethernet frame ?","b":"\u003col>\u003cli>\u003cb>Destination MAC\u003c/b>: the intended receiver.\u003c/li>\u003cli>\u003cb>Source MAC\u003c/b>: the sending interface — switches use it for \u003cb>learning\u003c/b>.\u003c/li>\u003cli>\u003cb>Type/Length\u003c/b>: the carried protocol (IPv4, IPv6, ARP).\u003c/li>\u003cli>\u003cb>Payload\u003c/b>: the actual information.\u003c/li>\u003cli>\u003cb>FCS (Frame Check Sequence)\u003c/b>: detects transmission errors; damaged frames are discarded.\u003c/li>\u003c/ol>"},{"id":"1v52l52","k":"tbl","f":"Compare: MAC address \u003ci>vs\u003c/i> IP address","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>MAC address\u003c/th>\u003cth>IP address\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Layer 2\u003c/td>\u003ctd>Layer 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Local frame delivery\u003c/td>\u003ctd>Communication between networks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Used by switches\u003c/td>\u003ctd>Used by routers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e.g. 00:25:96:FF:12:34\u003c/td>\u003ctd>e.g. 192.168.10.5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"6l6yio","k":"def","f":"MAC address table","b":"maps MAC addresses to switch ports."},{"id":"bhrxoa","k":"tbl","f":"Compare: Situation \u003ci>vs\u003c/i> Switch action","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Switch action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Known destination MAC\u003c/td>\u003ctd>Forward only to the correct port\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unknown destination MAC\u003c/td>\u003ctd>\u003cb>Flood\u003c/b> to all other ports in the same VLAN (except the incoming one)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Broadcast FF:FF:FF:FF:FF:FF\u003c/td>\u003ctd>Send to all ports in the broadcast domain (except the incoming one)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ex8gjy","k":"q","f":"Why does Layer 2 need security ?","b":"\u003cul>\u003cli>Its protocols were built for fast local communication and \u003cb>trust\u003c/b> what devices send: the switch learns any source MAC, ARP accepts IP-to-MAC claims, DHCP clients accept configuration, STP exchanges BPDUs — all can be abused.\u003c/li>\u003c/ul>"},{"id":"uegr7q","k":"def","f":"MAC flooding","b":"the attacker sends many frames with \u003cb>fake source MACs\u003c/b> to fill/disturb the MAC table; unknown unicast is then flooded, exposing traffic and reducing performance."},{"id":"1niwzzh","k":"def","f":"MAC spoofing","b":"the attacker uses \u003cb>another device&#39;s MAC\u003c/b> to imitate it."},{"id":"1v5dkzf","k":"tbl","f":"Compare: MAC flooding \u003ci>vs\u003c/i> MAC spoofing","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>MAC flooding\u003c/th>\u003cth>MAC spoofing\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Goal\u003c/td>\u003ctd>Disturb the MAC table\u003c/td>\u003ctd>Imitate another device\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protection\u003c/td>\u003ctd>\u003cb>Port Security\u003c/b>\u003c/td>\u003ctd>\u003cb>802.1X\u003c/b>, Port Security, stronger authentication\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"xs3bh6","k":"q","f":"What can Port Security do ?","b":"\u003col>\u003cli>\u003cb>Limit the number\u003c/b> of MAC addresses allowed on a port.\u003c/li>\u003cli>Use \u003cb>static\u003c/b>, \u003cb>dynamically learned\u003c/b> or \u003cb>sticky\u003c/b> secure MACs.\u003c/li>\u003cli>\u003cb>Drop\u003c/b> unauthorized traffic or \u003cb>disable\u003c/b> the port on a violation.\u003c/li>\u003c/ol>"},{"id":"1xz7vnv","k":"def","f":"ARP (Address Resolution Protocol)","b":"discovers the MAC address associated with an IPv4 address on the local network."},{"id":"1x4e8sh","k":"def","f":"ARP spoofing","b":"sending \u003cb>false ARP replies\u003c/b> (e.g. &quot;192.168.1.1 is at CC:CC:…:03&quot;, the attacker&#39;s MAC), because basic ARP doesn&#39;t strongly authenticate replies → traffic goes through the attacker (\u003cb>Man-in-the-Middle\u003c/b>)."},{"id":"mzjj11","k":"q","f":"What are the possible results of ARP spoofing ?","b":"\u003col>\u003cli>Traffic interception. 2. Traffic modification. 3. Session hijacking. 4. Denial of service.\u003c/li>\u003c/ol>"},{"id":"aw4r7d","k":"q","f":"How to protect against ARP spoofing ?","b":"\u003col>\u003cli>\u003cb>Dynamic ARP Inspection (DAI)\u003c/b>.\u003c/li>\u003cli>\u003cb>DHCP Snooping\u003c/b>.\u003c/li>\u003cli>Network segmentation.\u003c/li>\u003cli>Encryption of application traffic.\u003c/li>\u003cli>Monitoring for unusual or duplicate ARP entries.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">\u003cb>DAI\u003c/b> validates ARP using trusted IP-to-MAC bindings, commonly learned from the \u003cb>DHCP Snooping database\u003c/b>.\u003c/div>"},{"id":"ulpnco","k":"def","f":"DHCP","b":"automatically gives clients an IP address, mask, default gateway, DNS server and lease time."},{"id":"ulprz3","k":"def","f":"DORA","b":"the normal DHCP process — \u003cb>D\u003c/b>iscover → \u003cb>O\u003c/b>ffer → \u003cb>R\u003c/b>equest → \u003cb>A\u003c/b>cknowledge."},{"id":"as82ka","k":"tbl","f":"Fill in the table: Attack · What happens · Effect / protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>What happens\u003c/th>\u003cth>Effect / protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Rogue DHCP server\u003c/b>\u003c/td>\u003ctd>An unauthorized server gives false settings (fake gateway, malicious DNS)\u003c/td>\u003ctd>Traffic redirected → \u003cb>DHCP Snooping\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>DHCP starvation\u003c/b>\u003c/td>\u003ctd>Many fake DHCP requests consume the address pool\u003c/td>\u003ctd>Users get no IP → DHCP Snooping + \u003cb>rate limiting\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"m6gaom","k":"q","f":"What does DHCP Snooping do ?","b":"\u003col>\u003cli>Classifies switch ports as \u003cb>trusted\u003c/b> or \u003cb>untrusted\u003c/b>.\u003c/li>\u003cli>Blocks DHCP \u003cb>server\u003c/b> messages from untrusted ports.\u003c/li>\u003cli>Builds a \u003cb>binding database\u003c/b> (IP, MAC, VLAN, port, lease).\u003c/li>\u003cli>Supports \u003cb>DAI\u003c/b> and \u003cb>IP Source Guard\u003c/b>.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Trusted ports lead toward the real DHCP server; user-facing ports are untrusted.\u003c/div>"},{"id":"um3iia","k":"def","f":"VLAN","b":"logically separates a switched network into different \u003cb>broadcast domains\u003c/b> (students, staff, servers…), reducing exposure and allowing different policies."},{"id":"cmxmo8","k":"tbl","f":"Fill in the table: VLAN hopping type · Idea · Basic protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>VLAN hopping type\u003c/th>\u003cth>Idea\u003c/th>\u003cth>Basic protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Switch spoofing\u003c/b>\u003c/td>\u003ctd>Attacker pretends to be a switch and negotiates a \u003cb>trunk\u003c/b>\u003c/td>\u003ctd>Configure user ports as \u003cb>access\u003c/b> ports; disable automatic trunk negotiation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Double tagging\u003c/b>\u003c/td>\u003ctd>A frame with \u003cb>two VLAN tags\u003c/b> crosses VLAN boundaries\u003c/td>\u003ctd>Use a dedicated unused \u003cb>native VLAN\u003c/b>; no user devices on it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"19rjr6r","k":"def","f":"STP (Spanning Tree Protocol)","b":"prevents switching loops and elects a \u003cb>root bridge\u003c/b>."},{"id":"ubkxhr","k":"def","f":"STP manipulation","b":"an unauthorized switch sends \u003cb>superior BPDUs\u003c/b> to become root → change topology, redirect traffic, or cause instability."},{"id":"5681kl","k":"tbl","f":"Compare: BPDU Guard \u003ci>vs\u003c/i> Root Guard","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>BPDU Guard\u003c/th>\u003cth>Root Guard\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Used on \u003cb>host-facing access ports\u003c/b>\u003c/td>\u003ctd>Used where the root must not appear\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unexpected BPDU → port disabled\u003c/td>\u003ctd>Prevents an unexpected switch from becoming root\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protects \u003cb>edge ports\u003c/b>\u003c/td>\u003ctd>Protects the \u003cb>root-bridge position\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"15hmfrq","k":"def","f":"IEEE 802.1X","b":"authenticates users/devices \u003cb>before\u003c/b> normal network access."},{"id":"16obqrn","k":"tbl","f":"Fill in the table: 802.1X component · Role","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>802.1X component\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Supplicant\u003c/b>\u003c/td>\u003ctd>The user device requesting access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Authenticator\u003c/b>\u003c/td>\u003ctd>The switch or access point controlling the port\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Authentication server\u003c/b>\u003c/td>\u003ctd>Verifies credentials\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1c78653","k":"tbl","f":"Fill in the table: Control · Main purpose","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Control\u003c/th>\u003cth>Main purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Port Security\u003c/td>\u003ctd>Limits which MACs can use a port\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disable unused ports\u003c/td>\u003ctd>Reduces unauthorized physical access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VLAN segmentation\u003c/td>\u003ctd>Separates users/services into zones\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DHCP Snooping\u003c/td>\u003ctd>Blocks rogue DHCP; builds trusted bindings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DAI\u003c/td>\u003ctd>Validates ARP against trusted bindings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IP Source Guard\u003c/td>\u003ctd>Filters source IP/MAC on untrusted interfaces\u003c/td>\u003c/tr>\u003ctr>\u003ctd>BPDU Guard\u003c/td>\u003ctd>Stops STP on user-facing ports\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Root Guard\u003c/td>\u003ctd>Protects the intended root\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IEEE 802.1X\u003c/td>\u003ctd>Authenticates before access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"6sl112","k":"tbl","f":"Fill in the table: Attack · Objective · Protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Objective\u003c/th>\u003cth>Protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MAC flooding\u003c/td>\u003ctd>Fill/disturb the MAC table\u003c/td>\u003ctd>Port Security\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MAC spoofing\u003c/td>\u003ctd>Imitate another device\u003c/td>\u003ctd>802.1X, Port Security\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ARP spoofing\u003c/td>\u003ctd>Redirect or intercept traffic\u003c/td>\u003ctd>DAI, DHCP Snooping, encryption\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rogue DHCP\u003c/td>\u003ctd>Give clients false configuration\u003c/td>\u003ctd>DHCP Snooping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DHCP starvation\u003c/td>\u003ctd>Exhaust IP addresses\u003c/td>\u003ctd>DHCP Snooping, rate limiting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VLAN hopping\u003c/td>\u003ctd>Reach another VLAN\u003c/td>\u003ctd>Access mode, no negotiation, secure native VLAN\u003c/td>\u003c/tr>\u003ctr>\u003ctd>STP manipulation\u003c/td>\u003ctd>Change switching topology\u003c/td>\u003ctd>BPDU Guard, Root Guard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unauthorized connection\u003c/td>\u003ctd>Gain network access\u003c/td>\u003ctd>Disable unused ports, 802.1X\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"11ttala","k":"q","f":"University case — fix each problem.","b":"\u003col>\u003cli>All users in one VLAN → separate VLANs (students, teachers, admin, servers, guests).\u003c/li>\u003cli>Unused ports active → shut them down and put them in an unused VLAN.\u003c/li>\u003cli>Unknown devices connect → 802.1X. Too many MACs on a port → Port Security.\u003c/li>\u003cli>Rogue DHCP possible → DHCP Snooping. ARP spoofing → DAI.\u003c/li>\u003cli>Students connect switches → BPDU Guard. Unexpected root → Root Guard.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Don&#39;t trust a device just because it&#39;s connected; a MAC isn&#39;t identity; combine controls (\u003cb>defense in depth\u003c/b>).\u003c/div>"}]},{"id":"lecture-3-layer-3-ipv4-and-ipsec","label":"L3","title":"Layer 3: IPv4 & IPsec Security","cards":[{"id":"1s8sw8b","k":"def","f":"Layer 3 (Network layer)","b":"moves packets \u003cb>between networks\u003c/b>. IPv4 delivers packets; ACLs, filtering and IPsec add security."},{"id":"um1cl8","k":"def","f":"IPv4","b":"a \u003cb>connectionless\u003c/b> network-layer protocol with \u003cb>32-bit\u003c/b> addresses written in dotted decimal (192.168.10.25)."},{"id":"12vrjg5","k":"q","f":"What are the IPv4 header fields and their role ?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Version\u003c/td>\u003ctd>Always 4 for IPv4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IHL\u003c/td>\u003ctd>Header length (where data begins)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DSCP/ECN\u003c/td>\u003ctd>Priority / quality of service\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Total Length\u003c/td>\u003ctd>Header + data size\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Identification, Flags, Fragment Offset\u003c/td>\u003ctd>Fragmentation and reassembly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>TTL\u003c/b>\u003c/td>\u003ctd>Decreases by 1 at each router; at 0 the packet is discarded (prevents endless loops)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protocol\u003c/td>\u003ctd>Upper layer: ICMP, TCP, UDP, \u003cb>ESP\u003c/b>, \u003cb>AH\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Header Checksum\u003c/td>\u003ctd>Detects errors in the header\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Source / Destination\u003c/td>\u003ctd>Claimed sender (32 bits) / intended receiver (32 bits)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"45gtry","k":"q","f":"Why does IPv4 need extra security ?","b":"\u003cul>\u003cli>It was designed for \u003cb>delivery\u003c/b> only: it doesn&#39;t encrypt contents or strongly authenticate the source address.\u003c/li>\u003c/ul>"},{"id":"pxgg16","k":"tbl","f":"Compare: Threat \u003ci>vs\u003c/i> What can happen","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Threat\u003c/th>\u003cth>What can happen\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>IP spoofing\u003c/b>\u003c/td>\u003ctd>A false source address is placed in a packet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Packet interception\u003c/td>\u003ctd>Unencrypted data read on an untrusted path\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ICMP abuse\u003c/td>\u003ctd>Ping sweeps, reconnaissance, floods, false control messages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DoS / DDoS\u003c/td>\u003ctd>Bandwidth, router or server resources exhausted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fragmentation attacks\u003c/td>\u003ctd>Odd fragments confuse filters or consume reassembly resources\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Routing attacks\u003c/td>\u003ctd>Traffic redirected, dropped or intercepted\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"mpl15n","k":"def","f":"IP spoofing","b":"faking the source IPv4 address to \u003cb>hide the sender, imitate another device, bypass IP-based restrictions, or support DoS\u003c/b>."},{"id":"um0z9s","k":"def","f":"ICMP","b":"diagnostics and error reporting — ping uses \u003cb>Echo Request / Echo Reply\u003c/b>; traceroute also depends on ICMP."},{"id":"10g3vdv","k":"tbl","f":"Fill in the table: Topic · Explanation · Protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Topic\u003c/th>\u003cth>Explanation\u003c/th>\u003cth>Protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ping sweep\u003c/td>\u003ctd>ICMP to many addresses to find live hosts\u003c/td>\u003ctd>Permit only required ICMP, rate-limit, log\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DoS / DDoS\u003c/td>\u003ctd>Floods make a service unavailable\u003c/td>\u003ctd>Filtering, rate limiting, monitoring, upstream protection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fragmentation\u003c/td>\u003ctd>Tiny/overlapping/incomplete fragments confuse devices\u003c/td>\u003ctd>Drop malformed fragments, reassemble/inspect, update\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"rskzxo","k":"q","f":"How are routers protected against routing attacks ?","b":"\u003cul>\u003cli>Strong admin authentication, \u003cb>SSH\u003c/b>, restricted management addresses, \u003cb>routing-protocol authentication\u003c/b>, updates, backups, logging, disabling unnecessary services.\u003c/li>\u003c/ul>"},{"id":"g0f7s9","k":"def","f":"ACL (Access Control List)","b":"an \u003cb>ordered\u003c/b> set of permit/deny rules checking source, destination, protocol, port or ICMP type."},{"id":"1jnw618","k":"tbl","f":"Compare: Standard ACL \u003ci>vs\u003c/i> Extended ACL","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Standard ACL\u003c/th>\u003cth>Extended ACL\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Mainly checks the \u003cb>source\u003c/b> IPv4 address\u003c/td>\u003ctd>Checks \u003cb>source, destination, protocol and TCP/UDP port\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e.g. permit 192.168.10.0/24\u003c/td>\u003ctd>e.g. permit HTTPS from 192.168.20.0/24 to 172.16.10.10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"15cskkd","k":"q","f":"What are the ACL processing principles ?","b":"\u003col>\u003cli>Rules are checked \u003cb>in order\u003c/b>.\u003c/li>\u003cli>The \u003cb>first matching rule\u003c/b> is applied.\u003c/li>\u003cli>\u003cb>Specific rules before general\u003c/b> rules.\u003c/li>\u003cli>Permit only required traffic; test before deployment.\u003c/li>\u003c/ol>"},{"id":"1bcxub4","k":"def","f":"Ingress filtering","b":"checks traffic \u003cb>entering\u003c/b> the network; rejects impossible or suspicious source addresses."},{"id":"pxw2qa","k":"def","f":"Egress filtering","b":"checks traffic \u003cb>leaving\u003c/b>; stops internal systems from using unauthorized source addresses."},{"id":"wlfuqe","k":"def","f":"uRPF (Unicast Reverse Path Forwarding)","b":"accepts a packet only if its source is reachable through the \u003cb>expected return path\u003c/b>."},{"id":"mbg1wn","k":"def","f":"Network segmentation","b":"separates students, staff, administration, servers and management networks."},{"id":"frns6j","k":"def","f":"IPsec","b":"protects IP communication \u003cb>at the network layer\u003c/b>, useful across untrusted networks like the Internet. Adds encryption, integrity, authentication and \u003cb>anti-replay\u003c/b>."},{"id":"8tf35h","k":"tbl","f":"Fill in the table: Component · Main role","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Main role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>AH\u003c/b> (Authentication Header)\u003c/td>\u003ctd>Integrity, data-origin authentication, anti-replay — \u003cb>no confidentiality\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>ESP\u003c/b> (Encapsulating Security Payload)\u003c/td>\u003ctd>\u003cb>Encryption\u003c/b> (confidentiality) + integrity, authentication, anti-replay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SA\u003c/b> (Security Association)\u003c/td>\u003ctd>How traffic is protected: algorithms, keys, peer, lifetime, \u003cb>SPI\u003c/b>, anti-replay info\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>IKEv2\u003c/b>\u003c/td>\u003ctd>Authenticates peers, negotiates parameters, establishes keys, creates/manages SAs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"fbx2f3","k":"tbl","f":"Compare: AH \u003ci>vs\u003c/i> ESP","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>AH\u003c/th>\u003cth>ESP\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>\u003cb>No\u003c/b>\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes (when configured)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Source authentication\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes (when configured)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anti-replay\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>VPN use\u003c/td>\u003ctd>Limited\u003c/td>\u003ctd>\u003cb>Commonly used\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"16hki3f","k":"tbl","f":"Compare: Transport mode \u003ci>vs\u003c/i> Tunnel mode","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Feature\u003c/th>\u003cth>Transport mode\u003c/th>\u003cth>Tunnel mode\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Protects\u003c/td>\u003ctd>Mainly the original \u003cb>payload\u003c/b>\u003c/td>\u003ctd>The \u003cb>entire original packet\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>IP header\u003c/td>\u003ctd>Original header stays visible\u003c/td>\u003ctd>A \u003cb>new outer IP header\u003c/b> is added\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Typical use\u003c/td>\u003ctd>Host-to-host\u003c/td>\u003ctd>\u003cb>Gateway-to-gateway, site-to-site VPN\u003c/b>, remote access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Overhead\u003c/td>\u003ctd>Lower\u003c/td>\u003ctd>Higher\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"4s8dej","k":"def","f":"Security Association (SA)","b":"a \u003cb>one-directional\u003c/b> logical agreement — two-way traffic needs \u003cb>one SA in each direction\u003c/b>."},{"id":"1e8kl53","k":"q","f":"What does IKEv2 do ?","b":"\u003col>\u003cli>Authenticates the two peers.\u003c/li>\u003cli>Negotiates security algorithms and parameters.\u003c/li>\u003cli>Establishes keys and creates IPsec SAs.\u003c/li>\u003cli>Maintains the relationship and re-keys when needed.\u003c/li>\u003c/ol>"},{"id":"2j7igh","k":"q","f":"Site-to-site example (192.168.10.0/24 ↔ 192.168.20.0/24) — what do the gateways do ?","b":"\u003cul>\u003cli>Identify protected traffic → authenticate each other → establish SAs → encrypt packets → decrypt at the other site.\u003c/li>\u003c/ul>"},{"id":"1q2wsh8","k":"tbl","f":"Fill in the table: Requirement · Recommended protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Requirement\u003c/th>\u003cth>Recommended protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Students must not access router management\u003c/td>\u003ctd>Management ACL + segmentation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Internet packet claims an internal source\u003c/td>\u003ctd>Ingress filtering + uRPF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Only required traffic to the grade server\u003c/td>\u003ctd>Extended ACL\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Two buildings exchange private data over the Internet\u003c/td>\u003ctd>IPsec tunnel mode\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suspicious ICMP traffic\u003c/td>\u003ctd>Rate limiting + logging + monitoring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Routing information must be protected\u003c/td>\u003ctd>Routing authentication + router hardening\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]}];</script>
