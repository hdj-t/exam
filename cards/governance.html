<script>window.DECKS = [{"id":"lecture-1-cybersecurity-governance","label":"L1","title":"Cybersecurity Governance: CIA, AAA & Controls","cards":[{"id":"kcrg5d","k":"def","f":"Security","b":"what helps an organization continue to exist and operate despite attempts to steal data or compromise its physical and logical assets. It is a \u003cb>business management responsibility\u003c/b>, not merely an IT concern."},{"id":"h8krhb","k":"def","f":"IT/IS","b":"the hardware and software that support business operations; security protects their reliable operation and supports the organization&#39;s \u003cb>mission, goals and objectives\u003c/b>."},{"id":"1d1sz6c","k":"q","f":"What are the three common methods to evaluate security ?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Primary objective\u003c/th>\u003cth>How it works\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Risk assessment\u003c/b>\u003c/td>\u003ctd>Identify assets, threats and vulnerabilities to calculate exposure\u003c/td>\u003ctd>Evaluates impact vs likelihood; sets mitigation priorities\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Vulnerability assessment\u003c/b>\u003c/td>\u003ctd>Find known software, hardware and configuration weaknesses\u003c/td>\u003ctd>\u003cb>Automated scanning tools\u003c/b> and baselining\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Penetration testing\u003c/b>\u003c/td>\u003ctd>Stress-test defenses against simulated real attacks\u003c/td>\u003ctd>\u003cb>Trusted/ethical testers\u003c/b> find exploitable flaws and logic gaps\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"5nm7od","k":"q","f":"How should security controls be selected ?","b":"\u003cul>\u003cli>To give the \u003cb>greatest protection at the lowest reasonable cost\u003c/b>, meeting the organization&#39;s needs, complying with laws, and backed by \u003cb>evidence\u003c/b> (to defend actions in court and avoid fines, penalties or negligence claims).\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">Security is an \u003cb>ongoing process\u003c/b>, never a finished project — technology, users, vulnerabilities and attacks keep changing.\u003c/div>"},{"id":"1ucn62j","k":"q","f":"What are the five pillars of information security ?","b":"\u003col>\u003cli>Confidentiality. 2. Integrity. 3. Availability. 4. Authenticity. 5. Nonrepudiation.\u003c/li>\u003c/ol>\n\u003cul>\u003cli>The first three form the \u003cb>CIA Triad\u003c/b>, the primary goals of information security.\u003c/li>\u003c/ul>"},{"id":"x5awn5","k":"def","f":"Confidentiality","b":"information is disclosed only to authorized individuals or systems."},{"id":"1to39e8","k":"q","f":"What causes unauthorized disclosure and how is it prevented ?","b":"\u003cul>\u003cli>Causes: deliberate attacks, human error, poor policies, misconfigured controls.\u003c/li>\u003cli>Protections: encryption, access control, strong authentication, data classification, training.\u003c/li>\u003c/ul>"},{"id":"1trxg84","k":"tbl","f":"Fill in the table: Confidentiality concept · Meaning","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Confidentiality concept\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sensitivity\u003c/td>\u003ctd>Potential harm from disclosure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Discretion\u003c/td>\u003ctd>Controlling disclosure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Concealment / Secrecy\u003c/td>\u003ctd>Hiding / preventing disclosure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Privacy\u003c/td>\u003ctd>Protecting personal information\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Seclusion\u003c/td>\u003ctd>Storing information in a restricted location\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isolation\u003c/td>\u003ctd>Keeping information separate\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"2v26eo","k":"def","f":"Integrity","b":"protects the \u003cb>accuracy, correctness and reliability\u003c/b> of information — preventing unauthorized changes and minimizing mistakes by authorized users."},{"id":"7iyib9","k":"q","f":"Integrity — threats, protections, concepts ?","b":"\u003cul>\u003cli>Threats: viruses, unauthorized access, software errors, malicious modifications, \u003cb>logic bombs\u003c/b>, \u003cb>backdoors\u003c/b>.\u003c/li>\u003cli>Protections: access controls, strong authentication, intrusion detection, \u003cb>hash verification\u003c/b>, input validation, training.\u003c/li>\u003cli>Concepts: accuracy, truthfulness, validity, accountability, responsibility, completeness, comprehensiveness.\u003c/li>\u003c/ul>"},{"id":"153lcqu","k":"def","f":"Availability","b":"authorized users can access information and systems \u003cb>when needed\u003c/b>, without unacceptable interruption."},{"id":"1m4gpxf","k":"q","f":"Availability — threats, protections, concepts ?","b":"\u003cul>\u003cli>Threats: hardware failure, software errors, environmental problems, power loss, \u003cb>DoS\u003c/b>, communication interruptions.\u003c/li>\u003cli>Protections: performance monitoring, access controls, firewalls, \u003cb>redundant systems\u003c/b>, tested backups, \u003cb>fault tolerance\u003c/b>, \u003cb>BCP\u003c/b> (removes single points of failure).\u003c/li>\u003cli>Concepts: \u003cb>usability\u003c/b> (ease of use), \u003cb>accessibility\u003c/b> (different users can interact), \u003cb>timeliness\u003c/b> (reasonable response time).\u003c/li>\u003c/ul>"},{"id":"1nfe06o","k":"tbl","f":"Fill in the table: CIA · Question","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>CIA\u003c/th>\u003cth>Question\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>\u003cb>Who can see or read\u003c/b> the information?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>Is it \u003cb>accurate, valid and unmodified\u003c/b>?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>Can authorized users access it \u003cb>on demand\u003c/b>?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"z1l1do","k":"def","f":"DAD Triad","b":"the \u003cb>opposite / failure state\u003c/b> of CIA."},{"id":"4wsxbf","k":"tbl","f":"Fill in the table: DAD · Violates","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>DAD\u003c/th>\u003cth>Violates\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>D\u003c/b>isclosure — unauthorized access\u003c/td>\u003ctd>Confidentiality\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>A\u003c/b>lteration — malicious or accidental change\u003c/td>\u003ctd>Integrity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>D\u003c/b>estruction / DoS — damaged or inaccessible\u003c/td>\u003ctd>Availability\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"c3cpdm","k":"def","f":"Overprotection","b":"over-protecting confidentiality or integrity can \u003cb>restrict availability\u003c/b>, and over-providing availability can \u003cb>destroy confidentiality and integrity\u003c/b> — security must be balanced."},{"id":"1e1ygtq","k":"def","f":"Authenticity","b":"data is \u003cb>genuine\u003c/b> and originates from its \u003cb>claimed origin\u003c/b>."},{"id":"13k0qje","k":"def","f":"Nonrepudiation","b":"a subject \u003cb>cannot deny\u003c/b> performing an action (supported by identification, authentication, authorization, auditing, accounting, digital certificates, transaction logs)."},{"id":"btuoe0","k":"def","f":"AAA services","b":"five elements that must all be implemented to avoid structural weaknesses."},{"id":"xuz75t","k":"tbl","f":"Fill in the table: Element · Definition · Mechanisms","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Element\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Mechanisms\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1. \u003cb>Identification\u003c/b>\u003c/td>\u003ctd>Claiming an identity\u003c/td>\u003ctd>Usernames, smart cards, tokens, biometric identifiers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. \u003cb>Authentication\u003c/b>\u003c/td>\u003ctd>Proving the claimed identity\u003c/td>\u003ctd>Passwords, PINs, OTP tokens, certificates, biometric match\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. \u003cb>Authorization\u003c/b>\u003c/td>\u003ctd>Granting specific permissions\u003c/td>\u003ctd>RBAC, ABAC, ACLs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4. \u003cb>Auditing\u003c/b>\u003c/td>\u003ctd>Recording activity\u003c/td>\u003ctd>System, access and intrusion logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5. \u003cb>Accounting (Accountability)\u003c/b>\u003c/td>\u003ctd>Reviewing logs for compliance; holding subjects \u003cb>legally liable\u003c/b>\u003c/td>\u003ctd>SIEM log aggregation, compliance reviews, forensics, nonrepudiation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1oq6qqt","k":"def","f":"Defense in depth (layering)","b":"multiple security controls \u003cb>in series\u003c/b> (not in parallel), so an attack is checked by every control and the failure of one doesn&#39;t break the whole solution."},{"id":"ect8uq","k":"tbl","f":"Compare: Series (layering) \u003ci>vs\u003c/i> Parallel","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Series (layering)\u003c/th>\u003cth>Parallel\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Narrow and deep\u003c/td>\u003ctd>Useful in distributed computing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Failure of one control doesn&#39;t expose everything\u003c/td>\u003ctd>One path failing can bypass the rest\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"10ik2rz","k":"def","f":"Defense in breadth (diversity of defense)","b":"using products from \u003cb>different vendors\u003c/b> so one vulnerability can&#39;t break several layers at once."},{"id":"13d15i7","k":"def","f":"Abstraction","b":"grouping similar elements into \u003cb>roles, classes or groups\u003c/b> that receive the same controls and permissions (from object-oriented programming)."},{"id":"tb9d8m","k":"def","f":"Unknown environment doctrine","b":"users don&#39;t need to know how an object works inside, only the correct inputs and outputs (like user-mode apps calling system calls → \u003cb>mediated access\u003c/b>)."},{"id":"vpc8si","k":"def","f":"Data hiding","b":"placing data in a logical compartment that is \u003cb>invisible and unreachable\u003c/b> to unauthorized subjects."},{"id":"ydst2e","k":"tbl","f":"Compare: Data hiding \u003ci>vs\u003c/i> Security through obscurity","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Data hiding\u003c/th>\u003cth>Security through obscurity\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Real protection\u003c/b>: data is functionally unviewable and inaccessible\u003c/td>\u003ctd>Relies only on \u003cb>secrecy\u003c/b>, hoping no one finds it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separate security containers\u003c/td>\u003ctd>&quot;Digital hide and seek&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>e.g. multilevel systems, apps can&#39;t touch hardware directly, steganography\u003c/td>\u003ctd>e.g. shipping software with a known flaw and hoping nobody notices\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"z0ds3d","k":"def","f":"Security boundary","b":"the line between areas, subnets or environments with \u003cb>different security requirements\u003c/b> (e.g. LAN vs Internet)."},{"id":"1h20joj","k":"q","f":"What are the rules for security boundaries ?","b":"\u003col>\u003cli>They exist in \u003cb>physical and logical\u003c/b> environments — both need their own mechanisms and policy.\u003c/li>\u003cli>Policy must define \u003cb>where control begins and ends\u003c/b> (logical: where communications reach your devices; physical: walls, building, campus fence — also the reach of \u003cb>legal responsibility\u003c/b>).\u003c/li>\u003cli>Evaluate each boundary separately for the most \u003cb>cost-effective\u003c/b> solution.\u003c/li>\u003cli>Never spend more on a countermeasure than the \u003cb>value\u003c/b> of the protected asset.\u003c/li>\u003c/ol>"},{"id":"1r9uzov","k":"def","f":"Security governance","b":"practices that \u003cb>support, evaluate, define and direct\u003c/b> an organization&#39;s security efforts — ideally by a \u003cb>board of directors / governance committee\u003c/b> (in small organizations, the CEO or CISO)."},{"id":"uv6yno","k":"q","f":"What are the key points of security governance ?","b":"\u003col>\u003cli>Closely linked with \u003cb>corporate and IT governance\u003c/b> (keep processes running, growth, minimize downtime and loss).\u003c/li>\u003cli>Driven by \u003cb>legislative/regulatory compliance\u003c/b>, industry guidelines, licensing.\u003c/li>\u003cli>Must be \u003cb>audited and validated\u003c/b> periodically (harder when countries&#39; laws conflict).\u003c/li>\u003cli>Security is a \u003cb>business operations issue\u003c/b>, not only back-end IT.\u003c/li>\u003cli>Frameworks: \u003cb>NIST SP 800-53\u003c/b>, \u003cb>NIST SP 800-100\u003c/b> (government-focused, adaptable by companies).\u003c/li>\u003c/ol>"},{"id":"zk06t5","k":"def","f":"Third-party governance","b":"external oversight required by laws, regulations, standards, contracts or licensing (outside auditors/investigators) — and also \u003cb>oversight of external providers\u003c/b> you rely on (guards, maintenance, support, accounting), who must comply with your security stance."},{"id":"w4voux","k":"q","f":"How is third-party compliance verified ?","b":"\u003col>\u003cli>\u003cb>On-site assessments\u003c/b> — firsthand view of deployed controls.\u003c/li>\u003cli>Auditors follow protocols like \u003cb>COBIT\u003c/b> with a requirements checklist.\u003c/li>\u003cli>\u003cb>Open document exchange\u003c/b> between the organization and the governing body.\u003c/li>\u003cli>Organization submits \u003cb>security policies and self-assessment reports\u003c/b> → \u003cb>documentation review\u003c/b>.\u003c/li>\u003c/ol>"}]},{"id":"lecture-2-governance-and-risk-management","label":"L2","title":"Governance & Risk Management (L1 continued)","cards":[{"id":"jbkbsf","k":"def","f":"Security management planning","b":"creating, implementing and enforcing a security policy that \u003cb>aligns security with the strategy, goals, mission and objectives\u003c/b> of the organization (based on business cases, budget limits and scarce resources)."},{"id":"9yjz9h","k":"def","f":"Business case","b":"a documented argument that defines a \u003cb>need to make a decision or take action\u003c/b> — often used to justify a new security project."},{"id":"7s1asm","k":"def","f":"Resource limitations","b":"money, people, technology and space are limited, so each effort must give the \u003cb>maximum benefit\u003c/b>."},{"id":"9i3dw3","k":"tbl","f":"Compare: Top-down approach \u003ci>vs\u003c/i> Bottom-up approach","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Top-down approach\u003c/th>\u003cth>Bottom-up approach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Senior management\u003c/b> initiates and defines policy\u003c/td>\u003ctd>\u003cb>IT staff\u003c/b> make security decisions without senior management\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Middle management turns policy into standards, baselines, guidelines, procedures\u003c/td>\u003ctd>Rarely used\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Most effective\u003c/b>\u003c/td>\u003ctd>Considered \u003cb>problematic\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"abldhe","k":"tbl","f":"Compare: CIO (Chief Information Officer) \u003ci>vs\u003c/i> CTO (Chief Technical Officer)","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>CIO (Chief Information Officer)\u003c/th>\u003cth>CTO (Chief Technical Officer)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Information is used effectively to meet \u003cb>business objectives\u003c/b>\u003c/td>\u003ctd>Equipment and software \u003cb>work properly\u003c/b> to support business\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1x7uvpp","k":"tbl","f":"Fill in the table: Role · Responsibility","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Responsibility\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Senior manager\u003c/b>\u003c/td>\u003ctd>\u003cb>Ultimately responsible\u003c/b> for security and assets; signs off all security issues; exercises due diligence and due care; \u003cb>legally liable\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Security professional\u003c/b> (InfoSec officer, CIRT)\u003c/td>\u003ctd>Trained engineer who follows senior management&#39;s directives; writes and implements policy — \u003cb>implementer, not decision-maker\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Asset / data owner\u003c/b>\u003c/td>\u003ctd>High-level manager who \u003cb>classifies\u003c/b> information; delegates daily work to the custodian\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Custodian\u003c/b>\u003c/td>\u003ctd>Operational tasks: implements controls, daily maintenance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>User\u003c/b>\u003c/td>\u003ctd>Complies with policy, handles data responsibly, reports anomalies/incidents\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Auditor\u003c/b>\u003c/td>\u003ctd>\u003cb>Independently verifies\u003c/b> controls, policies and practices for compliance\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1nzlylp","k":"tbl","f":"Compare: Data owner \u003ci>vs\u003c/i> Custodian","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Data owner\u003c/th>\u003cth>Custodian\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Decides the \u003cb>classification\u003c/b>\u003c/td>\u003ctd>\u003cb>Implements\u003c/b> the protection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>High-level manager\u003c/td>\u003ctd>Operational staff\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"83vb1d","k":"def","f":"Due diligence","b":"the \u003cb>research, investigation and planning\u003c/b> phase — discovering risks, evaluating third parties, preparing properly. (&quot;\u003cb>Knowing\u003c/b>&quot;)"},{"id":"cwup92","k":"def","f":"Due care","b":"the \u003cb>execution\u003c/b> phase — practical procedures that protect assets, implement policy, and prevent negligence. (&quot;\u003cb>Doing\u003c/b>&quot;)"},{"id":"1maybfl","k":"def","f":"Security policy","b":"the \u003cb>top tier\u003c/b> — scope of security, assets to protect, objectives, vision and goals. Types: \u003cb>organizational\u003c/b>, \u003cb>issue-specific\u003c/b> (e.g. network service, department), \u003cb>system-specific\u003c/b>."},{"id":"101ydtr","k":"def","f":"Standards","b":"\u003cb>compulsory\u003c/b> requirements for uniform use of hardware, software, technology and controls."},{"id":"18t5c2n","k":"def","f":"Baselines","b":"the \u003cb>minimum level of security\u003c/b> every system must meet before production."},{"id":"1xu1xtc","k":"def","f":"Guidelines","b":"\u003cb>recommendations\u003c/b> on how to implement standards and baselines (not mandatory)."},{"id":"103ccqx","k":"def","f":"Procedures","b":"\u003cb>step-by-step\u003c/b> instructions for performing security operations."},{"id":"7lwwoy","k":"tbl","f":"Fill in the table: Document · Mandatory? · Detail level","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Document\u003c/th>\u003cth>Mandatory?\u003c/th>\u003cth>Detail level\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Policy\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Broadest: what and why\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Standard\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003ctd>Specific required tech/controls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Baseline\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003ctd>Minimum security per system\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Guideline\u003c/td>\u003ctd>\u003cb>No\u003c/b> (advice)\u003c/td>\u003ctd>How to implement\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Procedure\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Most detailed: exact steps\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"kzf4qu","k":"def","f":"Threat modeling","b":"a \u003cb>proactive\u003c/b> engineering process during design to anticipate adversary tactics and prioritize defenses."},{"id":"bo4406","k":"tbl","f":"Fill in the table: Approach · Starts from","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Approach\u003c/th>\u003cth>Starts from\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Attacker-focused\u003c/b> (adversary-centric)\u003c/td>\u003ctd>Who might attack: motivations, goals, capabilities, vectors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Software-focused\u003c/b> (system-centric)\u003c/td>\u003ctd>The design, architecture and code: flaws, trust-boundary issues\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Asset-focused\u003c/b> (asset-centric)\u003c/td>\u003ctd>Critical assets, then every threat to them\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ke8wkl","k":"tbl","f":"Fill in the table: STRIDE · Definition · Violated property","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>STRIDE\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Violated property\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>S\u003c/b>poofing\u003c/td>\u003ctd>Impersonating a person, account or system\u003c/td>\u003ctd>Authenticity / Confidentiality\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>T\u003c/b>ampering\u003c/td>\u003ctd>Maliciously modifying data or configuration\u003c/td>\u003ctd>Integrity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R\u003c/b>epudiation\u003c/td>\u003ctd>Denying an action for lack of proof\u003c/td>\u003ctd>Nonrepudiation / Accountability\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>I\u003c/b>nformation disclosure\u003c/td>\u003ctd>Exposing data to unauthorized parties\u003c/td>\u003ctd>Confidentiality\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>D\u003c/b>enial of service\u003c/td>\u003ctd>Degrading or disrupting service\u003c/td>\u003ctd>Availability\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>E\u003c/b>levation of privilege\u003c/td>\u003ctd>Gaining higher permissions than authorized\u003c/td>\u003ctd>Authorization / Integrity\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"3p9eg8","k":"def","f":"Diagramming (DFD)","b":"drawing the elements of a transaction (users, web server, login process, database) to reveal threats across \u003cb>trust boundaries, data flows and storage\u003c/b>."},{"id":"sw91b8","k":"def","f":"Reduction analysis (decomposition)","b":"breaking a system into subroutines, modules or objects to analyze five concepts."},{"id":"1oyhrc8","k":"q","f":"What five concepts does reduction analysis examine ?","b":"\u003col>\u003cli>\u003cb>Trust boundaries\u003c/b> — where trust/security level changes.\u003c/li>\u003cli>\u003cb>Dataflow paths\u003c/b> — movement of data between locations.\u003c/li>\u003cli>\u003cb>Input points\u003c/b> — where external input enters.\u003c/li>\u003cli>\u003cb>Privileged operations\u003c/b> — actions needing more than normal rights.\u003c/li>\u003cli>\u003cb>Security stance and approach\u003c/b> — policy foundations and assumptions.\u003c/li>\u003c/ol>"},{"id":"1dc8gm2","k":"q","f":"How are threats prioritized ?","b":"\u003col>\u003cli>\u003cb>Probability × Damage potential\u003c/b>.\u003c/li>\u003cli>\u003cb>Risk matrix / heat map\u003c/b> (3×3: probability Low/Medium/High vs damage High/Medium/Low → HH is the worst).\u003c/li>\u003cli>\u003cb>DREAD\u003c/b>: \u003cb>D\u003c/b>amage, \u003cb>R\u003c/b>eproducibility, \u003cb>E\u003c/b>xploitability, \u003cb>A\u003c/b>ffected users, \u003cb>D\u003c/b>iscoverability.\u003c/li>\u003c/ol>"},{"id":"q9mwbr","k":"def","f":"Risk management","b":"identifying what could damage or disclose assets, evaluating it against \u003cb>asset value and countermeasure cost\u003c/b>, and implementing \u003cb>cost-effective\u003c/b> solutions to reduce risk to an \u003cb>acceptable level\u003c/b>."},{"id":"h3n9tz","k":"def","f":"Asset","b":"anything used in a business process (person, place, thing; tangible or intangible)."},{"id":"1adqyki","k":"def","f":"Asset valuation (AV)","b":"the value given to an asset — importance, cost, non-monetary expenses, productivity impact."},{"id":"1i0yjop","k":"def","f":"Threat","b":"any potential occurrence that may cause an undesirable outcome."},{"id":"jhthw","k":"def","f":"Threat agent / actor","b":"an entity that \u003cb>intentionally\u003c/b> exploits vulnerabilities (attacker, malware, disgruntled employee)."},{"id":"i09885","k":"def","f":"Threat event","b":"an accidental or intentional occurrence (fire, system failure, power outage)."},{"id":"134hrn4","k":"def","f":"Threat vector","b":"the \u003cb>path or means\u003c/b> to the target (email, Wi-Fi, USB drive)."},{"id":"13qs2cj","k":"def","f":"Vulnerability","b":"a weakness, or the \u003cb>absence of a safeguard\u003c/b>."},{"id":"14y5cg4","k":"def","f":"Exposure","b":"being \u003cb>susceptible\u003c/b> to asset loss because of a threat."},{"id":"m18cqc","k":"def","f":"Risk","b":"the likelihood that a threat exploits a vulnerability to cause harm — \u003cb>Risk = Threat × Vulnerability\u003c/b> or \u003cb>Probability of harm × Severity of harm\u003c/b>."},{"id":"jcdf8u","k":"def","f":"Safeguard (countermeasure)","b":"anything that removes or reduces a vulnerability or protects against threats (reconfiguring or removing risky services counts)."},{"id":"1v16467","k":"def","f":"Attack","b":"intentional exploitation of a vulnerability — it \u003cb>doesn&#39;t have to succeed\u003c/b> to be an attack."},{"id":"1vtktzc","k":"def","f":"Breach","b":"a \u003cb>successful\u003c/b> attack — a security mechanism was bypassed."},{"id":"yeqhf","k":"def","f":"Hazard","b":"a potential source or situation capable of causing harm."},{"id":"v0jgnr","k":"tbl","f":"Compare: Attack \u003ci>vs\u003c/i> Breach","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>Breach\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Attempt to exploit\u003c/td>\u003ctd>\u003cb>Successful\u003c/b> attempt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>May fail\u003c/td>\u003ctd>Mechanism bypassed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1ei5y9c","k":"tbl","f":"Fill in the table: Threat agent · Threat event · Threat vector","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Threat agent\u003c/th>\u003cth>Threat event\u003c/th>\u003cth>Threat vector\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Who\u003c/b> (intentional actor)\u003c/td>\u003ctd>\u003cb>What happens\u003c/b> (accidental or intentional)\u003c/td>\u003ctd>\u003cb>How/through what\u003c/b> it reaches the target\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"stih4g","k":"q","f":"What is the cyclical relationship of risk elements ?","b":"\u003col>\u003cli>\u003cb>Threats\u003c/b> exploit \u003cb>vulnerabilities\u003c/b>.\u003c/li>\u003cli>Vulnerabilities result in \u003cb>exposure\u003c/b>.\u003c/li>\u003cli>Exposure \u003cb>is risk\u003c/b>.\u003c/li>\u003cli>Risk is mitigated by \u003cb>safeguards\u003c/b>.\u003c/li>\u003cli>Safeguards protect \u003cb>assets\u003c/b>.\u003c/li>\u003cli>Assets are endangered by \u003cb>threats\u003c/b>.\u003c/li>\u003c/ol>"}]}];</script>
