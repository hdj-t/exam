<script>window.DECKS = [{"id":"lecture-1-application-security","label":"L1","title":"Application Security","cards":[{"id":"1111bzf","k":"def","f":"Application security","b":"the set of measures and practices that protect software applications from threats and vulnerabilities \u003cb>throughout their life cycle\u003c/b>. It is a specific subset of cybersecurity focused on securing \u003cb>software\u003c/b> itself."},{"id":"4nai1n","k":"tbl","f":"Fill in the table: Area · What it protects · Typical measures","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>What it protects\u003c/th>\u003cth>Typical measures\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Network security\u003c/td>\u003ctd>Traffic and connections between systems\u003c/td>\u003ctd>Firewalls, segmentation, IDS, VPNs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Infrastructure / cloud\u003c/td>\u003ctd>Servers, containers, VMs, cloud accounts\u003c/td>\u003ctd>Hardening, patching, IAM, configuration baselines\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Physical security\u003c/td>\u003ctd>Buildings, data centers, devices\u003c/td>\u003ctd>Badges, locks, cameras\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Application security\u003c/b>\u003c/td>\u003ctd>The software: design, code, dependencies, runtime behaviour\u003c/td>\u003ctd>Threat modeling, secure coding, code review, SAST/DAST, dependency scanning, monitoring\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"17zry5t","k":"def","f":"Shift-left","b":"moving security activities \u003cb>earlier\u003c/b> in the life cycle so feedback arrives while the code is still fresh."},{"id":"pxqgoh","k":"def","f":"Confidentiality","b":"data is accessible only to authorized parties."},{"id":"19yrbwg","k":"def","f":"Integrity","b":"data cannot be modified by unauthorized parties."},{"id":"6h17ee","k":"def","f":"Availability","b":"the application and its data are accessible when legitimate users need them."},{"id":"xqe8mf","k":"def","f":"Authentication","b":"verifying a user, device or system \u003cb>is who it claims\u003c/b> to be."},{"id":"16t6ikc","k":"def","f":"Authorization","b":"deciding what an \u003cb>already-authenticated\u003c/b> identity may do or see."},{"id":"12nnves","k":"def","f":"Accountability","b":"trustworthy evidence of \u003cb>who did what and when\u003c/b>, so actions can be reconstructed and not denied."},{"id":"ttx472","k":"tbl","f":"Fill in the table: Objective · Core question · Mechanisms · Typical failures","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Objective\u003c/th>\u003cth>Core question\u003c/th>\u003cth>Mechanisms\u003c/th>\u003cth>Typical failures\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Confidentiality\u003c/td>\u003ctd>Can an unauthorized party read it?\u003c/td>\u003ctd>Encryption, access control, data classification\u003c/td>\u003ctd>Missing access control, unencrypted data, verbose errors, IDOR\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrity\u003c/td>\u003ctd>Can it be changed without authorization?\u003c/td>\u003ctd>Input validation, digital signatures, audit trails\u003c/td>\u003ctd>No input validation, no signatures, SQL injection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Availability\u003c/td>\u003ctd>Can users reach it when needed?\u003c/td>\u003ctd>Rate limiting, redundancy, capacity planning\u003c/td>\u003ctd>DoS, resource exhaustion, unpatched crashes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authentication\u003c/td>\u003ctd>Who are you?\u003c/td>\u003ctd>Passwords, MFA, certificates\u003c/td>\u003ctd>Weak/reused passwords, no MFA, predictable tokens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization\u003c/td>\u003ctd>What may you do?\u003c/td>\u003ctd>RBAC, policy engines\u003c/td>\u003ctd>Missing object-level checks, hidden buttons instead of server checks, broad roles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Accountability\u003c/td>\u003ctd>Can we prove who did what, when?\u003c/td>\u003ctd>Audit logs, timestamps, correlation IDs\u003c/td>\u003ctd>Missing logs, no user/time, tamperable logs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"13jdabl","k":"q","f":"What are the three pillars of application security administration ?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Pillar\u003c/th>\u003cth>Role\u003c/th>\u003cth>Examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>People\u003c/b>\u003c/td>\u003ctd>Responsibility and decisions\u003c/td>\u003ctd>Developers, security engineers, architects, Security Advocate, app owners\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Process\u003c/b>\u003c/td>\u003ctd>Consistent security activities\u003c/td>\u003ctd>Threat modeling, code review, vulnerability &amp; patch management, incident response\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Technology\u003c/b>\u003c/td>\u003ctd>Automated detection\u003c/td>\u003ctd>SAST, DAST, SCA, secrets scanning, runtime monitoring, CI/CD controls\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1wb96w","k":"tbl","f":"Fill in the table: Model · Core idea · Representative controls","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Core idea\u003c/th>\u003cth>Representative controls\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Zero Trust\u003c/b>\u003c/td>\u003ctd>No implicit trust; access continuously evaluated\u003c/td>\u003ctd>Strong identity, service-to-service auth, signed tokens, just-in-time privileges\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Shift-Left\u003c/b>\u003c/td>\u003ctd>Security earlier in the life cycle\u003c/td>\u003ctd>SAST in IDE/PR, dependency analysis, secrets scanning, pre-merge tests\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Defense in Depth\u003c/b>\u003c/td>\u003ctd>Many independent layers; no single failure = full compromise\u003c/td>\u003ctd>Validation + parameterized queries + least-privilege DB + authz + monitoring\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>DevSecOps\u003c/b>\u003c/td>\u003ctd>Security inside existing dev/ops workflows\u003c/td>\u003ctd>Findings in the same tracker and CI/CD pipeline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Risk-Based\u003c/b>\u003c/td>\u003ctd>Prioritize by business context, not only technical severity\u003c/td>\u003ctd>Asset criticality, data sensitivity, exploitability, exposure\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"utgffw","k":"tbl","f":"Fill in the table: Framework · Publisher · Focus","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Framework\u003c/th>\u003cth>Publisher\u003c/th>\u003cth>Focus\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>OWASP\u003c/b> Top 10 / ASVS\u003c/td>\u003ctd>OWASP\u003c/td>\u003ctd>Common risks catalog + verification standard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>NIST SSDF\u003c/b> (SP 800-218)\u003c/td>\u003ctd>NIST\u003c/td>\u003ctd>Prepare, Protect, Produce, Respond\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>ISO/IEC 27034\u003c/b>\u003c/td>\u003ctd>ISO\u003c/td>\u003ctd>App security inside the organization&#39;s ISMS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>CIS Controls\u003c/b>\u003c/td>\u003ctd>Center for Internet Security\u003c/td>\u003ctd>Prioritized prescriptive safeguards\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>PCI DSS\u003c/b>\u003c/td>\u003ctd>PCI SSC\u003c/td>\u003ctd>Mandatory controls for payment card data\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1hesgae","k":"def","f":"Threat modeling","b":"a systematic process to \u003cb>identify, understand, prioritize and mitigate\u003c/b> threats \u003cb>before and throughout\u003c/b> implementation — proactive instead of reactive."},{"id":"row5qr","k":"def","f":"Vulnerability","b":"a weakness. \u003cb>Threat\u003c/b> : a potential action/event that could exploit it. \u003cb>Risk\u003c/b> : the potential consequences in context."},{"id":"117lrit","k":"q","f":"What are the three fundamental threat-modeling questions ?","b":"\u003col>\u003cli>\u003cb>What are we building?\u003c/b> Components, users, assets, data flows, dependencies, trust boundaries.\u003c/li>\u003cli>\u003cb>What can go wrong?\u003c/b> Threats to C, I, A, authentication, authorization, accountability.\u003c/li>\u003cli>\u003cb>What are we going to do about it?\u003c/b> Preventive, detective, corrective controls; manage residual risk.\u003c/li>\u003c/ol>"},{"id":"1j97ys7","k":"def","f":"Data Flow Diagram (DFD)","b":"a structured picture of how information moves through the system, used to expose attack-relevant parts."},{"id":"yjm63s","k":"q","f":"What are the elements of a security DFD ?","b":"\u003col>\u003cli>\u003cb>External entities\u003c/b> (users, external apps, third parties).\u003c/li>\u003cli>\u003cb>Processes\u003c/b> (components that receive/transform/validate data).\u003c/li>\u003cli>\u003cb>Data stores\u003c/b> (databases, files, caches, queues, backups).\u003c/li>\u003cli>\u003cb>Data flows\u003c/b> (exchanges between them).\u003c/li>\u003cli>\u003cb>Trust boundaries\u003c/b> (the fifth, most important concept).\u003c/li>\u003c/ol>"},{"id":"m9xyj","k":"def","f":"Trust boundary","b":"a logical line where the level of \u003cb>trust, privilege or control changes\u003c/b> (not necessarily a network boundary)."},{"id":"cxas1m","k":"def","f":"STRIDE","b":"Microsoft&#39;s threat-modeling framework of six categories."},{"id":"1hac95i","k":"tbl","f":"Fill in the table: STRIDE · Definition · Property violated · Controls","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>STRIDE\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Property violated\u003c/th>\u003cth>Controls\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>S\u003c/b>poofing\u003c/td>\u003ctd>Pretending to be another user/device/service\u003c/td>\u003ctd>Authentication\u003c/td>\u003ctd>MFA, credential &amp; session management, token validation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>T\u003c/b>ampering\u003c/td>\u003ctd>Unauthorized modification of data, requests, config or software\u003c/td>\u003ctd>Integrity\u003c/td>\u003ctd>Encrypted channels, server-side validation, signatures, DB constraints\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>R\u003c/b>epudiation\u003c/td>\u003ctd>Denying an action with no trustworthy evidence\u003c/td>\u003ctd>Accountability / non-repudiation\u003c/td>\u003ctd>Secure audit logs, timestamps, transaction IDs, tamper-resistant logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>I\u003c/b>nformation disclosure\u003c/td>\u003ctd>Data reaches unauthorized parties\u003c/td>\u003ctd>Confidentiality\u003c/td>\u003ctd>Encryption, access control, least privilege, data minimization, safe errors\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>D\u003c/b>enial of service\u003c/td>\u003ctd>Users can&#39;t access the service / it degrades\u003c/td>\u003ctd>Availability\u003c/td>\u003ctd>Rate limiting, quotas, size limits, load balancing, DDoS protection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>E\u003c/b>levation of privilege\u003c/td>\u003ctd>Gaining permissions beyond those assigned\u003c/td>\u003ctd>Authorization\u003c/td>\u003ctd>Server-side authz, RBAC/ABAC, least privilege, object-level checks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"17w4w4s","k":"def","f":"Risk score","b":"\u003cb>Likelihood × Impact\u003c/b>, each rated \u003cb>High 3 · Medium 2 · Low 1\u003c/b> → score \u003cb>1–9\u003c/b>."},{"id":"dkze1w","k":"tbl","f":"Fill in the table: Level · Likelihood · Impact","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Likelihood\u003c/th>\u003cth>Impact\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>High (3)\u003c/td>\u003ctd>Little skill/access; tools readily available\u003c/td>\u003ctd>Many users, big loss, sensitive data, safety\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Medium (2)\u003c/td>\u003ctd>Some skill, privileged access or conditions\u003c/td>\u003ctd>One user or limited group, moderate damage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Low (1)\u003c/td>\u003ctd>Advanced skill, rare access, many conditions\u003c/td>\u003ctd>Minor, temporary, reversible\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1s1dut5","k":"q","f":"QuickBite worked example — what are the trust boundaries and top threats ?","b":"\u003cul>\u003cli>\u003cb>TB1\u003c/b> Internet → QuickBite cloud (all client devices untrusted). \u003cb>TB2\u003c/b> QuickBite → payment provider (authenticate both ways). \u003cb>TB3\u003c/b> app tier → data tier.\u003c/li>\u003cli>Top five: \u003cb>I2\u003c/b> IDOR on /orders/5521→5522 (9), \u003cb>S1\u003c/b> account takeover by credential stuffing (9), \u003cb>T1\u003c/b> price tampering (9), \u003cb>E1\u003c/b> customer calls restaurant endpoints (6), \u003cb>D2\u003c/b> API/promo flooding at peak (6).\u003c/li>\u003cli>Tie-break order: \u003cb>personal safety\u003c/b> → \u003cb>users affected\u003c/b> → \u003cb>cost\u003c/b>.\u003c/li>\u003c/ul>"},{"id":"1x69w05","k":"tbl","f":"Compare: Practice \u003ci>vs\u003c/i> Rule","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Practice\u003c/th>\u003cth>Rule\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Input validation\u003c/td>\u003ctd>Never trust input; check type, length, format, range; prefer \u003cb>allow-lists\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parameterized queries\u003c/td>\u003ctd>Keep SQL code separate from data (stops \u003ccode>&#39; OR &#39;1&#39;=&#39;1\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Output encoding\u003c/td>\u003ctd>Encode special characters so the browser shows text, not code (XSS)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Password storage\u003c/td>\u003ctd>Salted, slow hash (\u003cb>bcrypt, Argon2\u003c/b>); never MD5/SHA-1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authentication &amp; sessions\u003c/td>\u003ctd>MFA, lockout/slow-down, random session IDs, HttpOnly/Secure/SameSite, idle expiry\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Authorization &amp; least privilege\u003c/td>\u003ctd>Check permission on \u003cb>every request\u003c/b>; minimum rights (DB account can&#39;t DROP TABLE)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secrets management\u003c/td>\u003ctd>No hard-coded keys; load from env or a secrets manager; never commit to Git\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error handling &amp; logging\u003c/td>\u003ctd>Generic messages to users, details in protected logs, no sensitive data in logs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Encryption\u003c/td>\u003ctd>HTTPS/TLS in transit, encryption at rest; never invent your own crypto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secure defaults / fail-safe\u003c/td>\u003ctd>Secure out of the box; on failure \u003cb>fail closed\u003c/b> (deny)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Code review &amp; testing\u003c/td>\u003ctd>Peer review, SAST (Bandit, SonarQube), DAST, penetration testing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CSRF protection\u003c/td>\u003ctd>Stop a logged-in browser being tricked into unwanted requests (tokens, SameSite)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"lecture-2-application-security-testing","label":"L2","title":"Application Security Testing (SAST / DAST)","cards":[{"id":"1fdm7oa","k":"def","f":"Application Security Testing (AST)","b":"making applications resilient against cyber threats by \u003cb>identifying, analyzing and fixing\u003c/b> security vulnerabilities."},{"id":"1n0sys1","k":"def","f":"SAST (Static Application Security Testing)","b":"an \u003cb>inside-out, white-box\u003c/b> approach that analyzes \u003cb>source code at rest without executing it\u003c/b>."},{"id":"l8vqnf","k":"def","f":"DAST (Dynamic Application Security Testing)","b":"an \u003cb>outside-in, black-box\u003c/b> approach that tests a \u003cb>running application\u003c/b> by simulating real-world attacks against its endpoints (HTTP/APIs)."},{"id":"1lkx36v","k":"tbl","f":"Compare: SAST \u003ci>vs\u003c/i> DAST","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>SAST\u003c/th>\u003cth>DAST\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>View\u003c/td>\u003ctd>Inside-out, \u003cb>white-box\u003c/b>\u003c/td>\u003ctd>Outside-in, \u003cb>black-box\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Needs\u003c/td>\u003ctd>Source code, build scripts, configs\u003c/td>\u003ctd>A \u003cb>live, running\u003c/b> target\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Executes the app?\u003c/td>\u003ctd>\u003cb>No\u003c/b>\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>When in SDLC\u003c/td>\u003ctd>\u003cb>Early\u003c/b> (before compile/deploy)\u003c/td>\u003ctd>Later (deployed / test environment)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finds\u003c/td>\u003ctd>Structural flaws: weak crypto, hard-coded secrets, unsafe patterns\u003c/td>\u003ctd>Runtime behaviour: confirmed exploitable responses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tool in the lecture\u003c/td>\u003ctd>\u003cb>Bandit\u003c/b> (Python)\u003c/td>\u003ctd>Python \u003ccode>requests\u003c/code> script attacking a FastAPI app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Proof\u003c/td>\u003ctd>&quot;Possible&quot; issue at a code line\u003c/td>\u003ctd>Attack actually succeeds (or is defended)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1rbqoj","k":"def","f":"Bandit","b":"an open-source SAST tool that parses Python code into an \u003cb>Abstract Syntax Tree (AST)\u003c/b> to find security bugs."},{"id":"1uh8gfs","k":"q","f":"Which three vulnerabilities were planted in vulnerable_app.py ?","b":"\u003col>\u003cli>\u003cb>Hard-coded secret\u003c/b> — CWE-259 (\u003ccode>DB_PASSWORD = &quot;SuperSecretPassword123!&quot;\u003c/code>).\u003c/li>\u003cli>\u003cb>SQL injection vector\u003c/b> — CWE-89 (query built with an f-string).\u003c/li>\u003cli>\u003cb>Command injection vector\u003c/b> — CWE-78 (\u003ccode>os.system(f&quot;ping -c 1 {user_ip}&quot;)\u003c/code>).\u003c/li>\u003c/ol>"},{"id":"1qfq40i","k":"tbl","f":"Fill in the table: Bandit ID · Issue · Severity · Confidence","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Bandit ID\u003c/th>\u003cth>Issue\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Confidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>B105\u003c/b> hardcoded_password_string\u003c/td>\u003ctd>Possible hard-coded password\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>B608\u003c/b> sql_injection_string_vulnerability\u003c/td>\u003ctd>SQL injection through string formatting\u003c/td>\u003ctd>Medium\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>B605\u003c/b> start_process_with_a_shell\u003c/td>\u003ctd>Process started with a shell, possible injection\u003c/td>\u003ctd>\u003cb>High\u003c/b>\u003c/td>\u003ctd>High\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"jt746v","k":"q","f":"How was each flaw remediated (secure_app.py) ?","b":"\u003col>\u003cli>Secret → read from an \u003cb>environment variable\u003c/b>: \u003ccode>os.getenv(&quot;DATABASE_PASSWORD&quot;)\u003c/code>.\u003c/li>\u003cli>SQL → \u003cb>parameterized query\u003c/b> with \u003ccode>?\u003c/code> placeholders: \u003ccode>cursor.execute(query, (username, password))\u003c/code>.\u003c/li>\u003cli>Command → \u003ccode>subprocess.run([&quot;ping&quot;, &quot;-c&quot;, &quot;1&quot;, user_ip])\u003c/code> — an \u003cb>argument array, no shell\u003c/b>, so input is only an argument.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Re-scan: \u003cb>No issues identified\u003c/b> (Medium 0, High 0).\u003c/div>"},{"id":"1gjmvbj","k":"q","f":"What did the vulnerable FastAPI service expose ?","b":"\u003col>\u003cli>\u003ccode>/login\u003c/code> — builds the SQL query with an f-string.\u003c/li>\u003cli>\u003ccode>/ping\u003c/code> — runs \u003ccode>os.popen(f&quot;ping -c 1 {ip}&quot;)\u003c/code>.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Colab note: the API runs on 127.0.0.1 \u003cb>inside Google&#39;s machine\u003c/b>, so \u003cb>Localtunnel\u003c/b> creates a public URL; the scanner sends the \u003ccode>bypass-tunnel-reminder\u003c/code> header to skip the splash page.\u003c/div>"},{"id":"133j93c","k":"tbl","f":"Fill in the table: DAST probe · Payload · Vulnerable app · Secure app","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>DAST probe\u003c/th>\u003cth>Payload\u003c/th>\u003cth>Vulnerable app\u003c/th>\u003cth>Secure app\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>SQL injection\u003c/td>\u003ctd>username = \u003ccode>admin&#39; OR &#39;1&#39;=&#39;1\u003c/code>, any password\u003c/td>\u003ctd>\u003cb>status: success\u003c/b> — &quot;Welcome (&#39;admin&#39;, &#39;SuperSecret123&#39;)&quot;\u003c/td>\u003ctd>\u003cb>status: fail\u003c/b> — Invalid credentials\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Command injection\u003c/td>\u003ctd>ip = \u003ccode>127.0.0.1; cat /etc/hostname\u003c/code>\u003c/td>\u003ctd>Shell runs the extra command\u003c/td>\u003ctd>\u003ccode>ping: 127.0.0.1; cat /etc/hostname: Name or service not known\u003c/code> — treated as one argument\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1b03934","k":"q","f":"Why does \u003ccode>admin&#39; OR &#39;1&#39;=&#39;1\u003c/code> log in ?","b":"\u003cul>\u003cli>The quote closes the string and \u003ccode>OR &#39;1&#39;=&#39;1&#39;\u003c/code> makes the WHERE condition \u003cb>always true\u003c/b>, so the first user (admin) is returned without the right password.\u003c/li>\u003c/ul>"},{"id":"1r9sxhg","k":"q","f":"Why does \u003ccode>; cat /etc/hostname\u003c/code> work against os.popen ?","b":"\u003cul>\u003cli>The \u003cb>shell\u003c/b> treats \u003ccode>;\u003c/code> as a command separator and runs a second command. With an argument list and no shell, \u003ccode>;\u003c/code> is just part of the hostname.\u003c/li>\u003c/ul>"},{"id":"k7xks7","k":"q","f":"What is the DevSecOps lesson ?","b":"\u003cul>\u003cli>SAST catches the flaw \u003cb>early in code\u003c/b>; DAST \u003cb>confirms exploitability\u003c/b> on the running system; after fixing, both re-scans pass (SAST: no issues; DAST: attacks defended).\u003c/li>\u003c/ul>"},{"id":"1phpytv","k":"tbl","f":"Fill in the table: CWE · Name · Fix","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>CWE\u003c/th>\u003cth>Name\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CWE-259\u003c/td>\u003ctd>Hard-coded password\u003c/td>\u003ctd>Environment variables / secrets manager\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CWE-89\u003c/td>\u003ctd>SQL injection\u003c/td>\u003ctd>Parameterized queries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CWE-78\u003c/td>\u003ctd>OS command injection\u003c/td>\u003ctd>Argument arrays, no shell (subprocess list)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"lecture-3-virtualization-security","label":"L3","title":"Virtualization Security","cards":[{"id":"is2l70","k":"def","f":"Traditional server architecture","b":"each physical server has its own CPU, RAM and storage, one OS installed directly on the hardware, and one service (web, mail, database)."},{"id":"4lmj2z","k":"q","f":"What are the problems of the traditional architecture ?","b":"\u003col>\u003cli>Hardware \u003cb>underutilization\u003c/b>. 2. Increased \u003cb>costs\u003c/b>. 3. Higher \u003cb>power\u003c/b> consumption. 4. More \u003cb>maintenance\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"1geovs8","k":"def","f":"Virtualization","b":"running multiple operating systems on one physical machine by creating separate \u003cb>virtual machines (VMs)\u003c/b>, each with its own virtual CPU, RAM, storage, OS and apps."},{"id":"efufq8","k":"def","f":"Hypervisor","b":"the software layer that \u003cb>creates and runs VMs\u003c/b>, allocates physical CPU and RAM to each, and manages access to the hardware."},{"id":"1jupgb7","k":"tbl","f":"Compare: Type 1 hypervisor \u003ci>vs\u003c/i> Type 2 hypervisor","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Type 1 hypervisor\u003c/th>\u003cth>Type 2 hypervisor\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Runs \u003cb>directly on the hardware\u003c/b>\u003c/td>\u003ctd>Runs as an \u003cb>application inside a host OS\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No general-purpose OS underneath\u003c/td>\u003ctd>Layers: hardware → host OS → hypervisor → guest OSes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controls hardware and allocates it to VMs\u003c/td>\u003ctd>Host OS and hypervisor work together\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"11kbwpd","k":"q","f":"What are the four benefits of virtualization ?","b":"\u003col>\u003cli>\u003cb>Partitioning\u003c/b>: dividing one computer&#39;s resources among several VMs.\u003c/li>\u003cli>\u003cb>Isolation\u003c/b>: each VM operates separately; a fault in one doesn&#39;t affect others (\u003cb>fault isolation\u003c/b>) — but not absolute protection against hypervisor flaws or shared-hardware attacks.\u003c/li>\u003cli>\u003cb>Encapsulation\u003c/b>: a VM and its configuration are stored as \u003cb>files\u003c/b> → easy to copy, back up, move, restore.\u003c/li>\u003cli>\u003cb>Hardware independence\u003c/b>: a VM isn&#39;t tied to one physical computer and can move to another compatible server without reinstalling.\u003c/li>\u003c/ol>"},{"id":"g86ie5","k":"q","f":"What three mechanisms secure cloud virtualization ?","b":"\u003col>\u003cli>\u003cb>Hardware isolation\u003c/b>: each VM has an isolated memory space.\u003c/li>\u003cli>\u003cb>Hypervisor security\u003c/b>: the hypervisor separates VMs; \u003cb>patches\u003c/b> fix weaknesses.\u003c/li>\u003cli>\u003cb>Confidential computing\u003c/b>: AMD SEV / Intel SGX protect data \u003cb>during processing\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"1szdbe2","k":"tbl","f":"Fill in the table: Data state · Meaning · Traditional protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Data state\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Traditional protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>At rest\u003c/b>\u003c/td>\u003ctd>Stored on disks, databases\u003c/td>\u003ctd>Disk encryption\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>In transit\u003c/b>\u003c/td>\u003ctd>Moving over a network\u003c/td>\u003ctd>TLS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>In use\u003c/b>\u003c/td>\u003ctd>Being processed by the CPU, in memory\u003c/td>\u003ctd>\u003cb>Confidential computing\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1xmkoat","k":"def","f":"Confidential computing","b":"hardware-based mechanisms that protect sensitive data \u003cb>while it is processed\u003c/b>, isolating it from untrusted software (host OS, hypervisor)."},{"id":"1szwsll","k":"def","f":"Memory encryption","b":"data is \u003cb>encrypted before it is written to RAM\u003c/b> and \u003cb>decrypted when read\u003c/b>, by a hardware engine."},{"id":"jmz7fp","k":"q","f":"What are the steps of hardware memory encryption ?","b":"\u003col>\u003cli>Data is processed by the VM.\u003c/li>\u003cli>\u003cb>Encryption before storage\u003c/b> by the memory-encryption engine.\u003c/li>\u003cli>\u003cb>Encrypted storage\u003c/b> in RAM.\u003c/li>\u003cli>\u003cb>Decryption during access\u003c/b> when the processor reads it.\u003c/li>\u003cli>\u003cb>Transparent operation\u003c/b> — done in hardware; apps don&#39;t do it themselves.\u003c/li>\u003c/ol>"},{"id":"b207jv","k":"def","f":"AES (Advanced Encryption Standard)","b":"a \u003cb>symmetric\u003c/b> algorithm (same key encrypts and decrypts) working on \u003cb>128-bit blocks\u003c/b>."},{"id":"qhhg1d","k":"tbl","f":"Fill in the table: AES key size · Rounds","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>AES key size\u003c/th>\u003cth>Rounds\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>AES-128\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AES-192\u003c/td>\u003ctd>12\u003c/td>\u003c/tr>\u003ctr>\u003ctd>AES-256\u003c/td>\u003ctd>14\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"13ejhse","k":"q","f":"What are the AES round operations ?","b":"\u003col>\u003cli>\u003cb>SubBytes\u003c/b> — replace each byte using a substitution table.\u003c/li>\u003cli>\u003cb>ShiftRows\u003c/b> — shift rows to rearrange bytes.\u003c/li>\u003cli>\u003cb>MixColumns\u003c/b> — combine bytes in each column (diffusion). \u003cb>Not in the final round.\u003c/b>\u003c/li>\u003cli>\u003cb>AddRoundKey\u003c/b> — XOR with the round key.\u003c/li>\u003c/ol>"},{"id":"12csom7","k":"def","f":"Encryption key","b":"the secret value the algorithm uses. \u003cb>AES is the algorithm; the key is the value it uses.\u003c/b> Whoever gets the key can decrypt."},{"id":"1f89ixj","k":"q","f":"What does a hardware key mechanism do ?","b":"\u003col>\u003cli>\u003cb>Key generation\u003c/b> — create a secure secret key.\u003c/li>\u003cli>\u003cb>Key assignment\u003c/b> — tie it to a VM or protected environment.\u003c/li>\u003cli>\u003cb>Key protection\u003c/b> — keep it inside a hardware boundary.\u003c/li>\u003cli>\u003cb>Key use\u003c/b> — let the hardware use it without exposing it.\u003c/li>\u003cli>\u003cb>Key isolation\u003c/b> — one VM can&#39;t use another&#39;s key.\u003c/li>\u003c/ol>"},{"id":"1m9kjcc","k":"tbl","f":"Fill in the table: Term · Meaning","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Key generation\u003c/td>\u003ctd>Creating a new secret key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key derivation\u003c/td>\u003ctd>Producing a specific key from a protected \u003cb>root key\u003c/b> + other inputs (e.g. enclave identity)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Key management\u003c/td>\u003ctd>Controlling assignment, use, protection, lifetime and access\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"pb0ttc","k":"def","f":"AMD SEV (Secure Encrypted Virtualization)","b":"protects the memory of an \u003cb>entire VM\u003c/b> from the hypervisor and other software outside it."},{"id":"hv1hz4","k":"q","f":"What are the components of AMD SEV ?","b":"\u003col>\u003cli>\u003cb>Guest VM\u003c/b> — its memory is encrypted in physical RAM.\u003c/li>\u003cli>\u003cb>Hypervisor\u003c/b> — manages VMs but must \u003cb>not\u003c/b> see plaintext VM memory.\u003c/li>\u003cli>\u003cb>AMD Secure Processor (AMD-SP)\u003c/b> — initializes SEV, generates/manages VM-specific keys, keeps keys in hardware; the hypervisor \u003cb>can&#39;t read the VM key\u003c/b>.\u003c/li>\u003cli>\u003cb>Memory encryption engine\u003c/b> — in the memory-access path; encrypts/decrypts automatically.\u003c/li>\u003c/ol>"},{"id":"1bwvyqn","k":"q","f":"How does SEV protect memory ?","b":"\u003col>\u003cli>AMD-SP initializes SEV. 2. Hypervisor creates a VM and requests SEV. 3. A VM-specific key is associated. 4. VM runs. 5. Writes are encrypted with the VM&#39;s key. 6. Reads are decrypted automatically. 7. If the hypervisor inspects the memory it sees only \u003cb>ciphertext\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"10oz6kd","k":"def","f":"VEK (VM Encryption Key)","b":"the secret key of an SEV-protected VM, used by the hardware to encrypt that VM&#39;s memory."},{"id":"izupoo","k":"def","f":"ASID (Address Space Identifier)","b":"identifies a VM&#39;s encryption context. \u003cb>ASID is NOT an encryption key\u003c/b> and isn&#39;t secret."},{"id":"1afmno4","k":"tbl","f":"Fill in the table: Extension · Main protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Extension\u003c/th>\u003cth>Main protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>SEV\u003c/b>\u003c/td>\u003ctd>Encrypts VM memory (confidentiality from the hypervisor)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SEV-ES\u003c/b>\u003c/td>\u003ctd>+ protects \u003cb>CPU register state\u003c/b> when the VM exits to the hypervisor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SEV-SNP\u003c/b>\u003c/td>\u003ctd>+ \u003cb>memory integrity\u003c/b>: against malicious remapping and \u003cb>replay\u003c/b> attacks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"9i3kk0","k":"def","f":"Intel SGX (Software Guard Extensions)","b":"protects \u003cb>selected application code and data\u003c/b> inside an \u003cb>enclave\u003c/b> (not the whole VM)."},{"id":"1wmwihq","k":"q","f":"What are the components of Intel SGX ?","b":"\u003col>\u003cli>\u003cb>Application outside the enclave\u003c/b> — ordinary, not automatically trusted.\u003c/li>\u003cli>\u003cb>Enclave\u003c/b> — protected memory with selected code and secrets (e.g. crypto operations and keys).\u003c/li>\u003cli>\u003cb>EPC (Enclave Page Cache)\u003c/b> — protected memory holding enclave pages.\u003c/li>\u003cli>\u003cb>CPU and SGX key hierarchy\u003c/b> — hardware key material used to \u003cb>derive\u003c/b> keys; not exposed to OS/hypervisor.\u003c/li>\u003c/ol>"},{"id":"11wkc76","k":"q","f":"How does SGX protect data ?","b":"\u003col>\u003cli>Create an enclave. 2. Load protected code and data. 3. Establish enclave identity. 4. Enter with \u003cb>ECALL\u003c/b>. 5. Process secrets inside. 6. Leave with \u003cb>EEXIT\u003c/b> and return permitted results. 7. Hardware blocks the OS and hypervisor from reading enclave memory.\u003c/li>\u003c/ol>"},{"id":"18rszoj","k":"def","f":"EGETKEY","b":"the instruction an enclave uses to ask the \u003cb>CPU to derive a key\u003c/b> (the OS/hypervisor never receive the root secret)."},{"id":"1or6j4s","k":"def","f":"Sealing","b":"encrypting enclave data so it can be \u003cb>stored outside the enclave\u003c/b> and later recovered by an authorized enclave."},{"id":"826ai6","k":"q","f":"What are the steps of sealing ?","b":"\u003col>\u003cli>Hold a sensitive key. 2. Request a \u003cb>sealing key\u003c/b> via EGETKEY. 3. Encrypt the data. 4. Store it outside (e.g. disk). 5. Later request the sealing key again and decrypt.\u003c/li>\u003c/ol>"},{"id":"hvggha","k":"tbl","f":"Compare: AMD SEV \u003ci>vs\u003c/i> Intel SGX","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>AMD SEV\u003c/th>\u003cth>Intel SGX\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Protects the \u003cb>whole VM&#39;s memory\u003c/b>\u003c/td>\u003ctd>Protects \u003cb>selected code/data\u003c/b> in an enclave\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Keys managed by the \u003cb>AMD Secure Processor\u003c/b> (VEK per VM)\u003c/td>\u003ctd>Keys \u003cb>derived by the CPU\u003c/b> (EGETKEY)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hides the VM from the hypervisor\u003c/td>\u003ctd>Hides the enclave from the OS and hypervisor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extensions: SEV-ES, SEV-SNP\u003c/td>\u003ctd>Sealing for storing secrets outside\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ya50e5","k":"def","f":"VM escape","b":"compromising a VM and then exploiting a hypervisor/virtualization flaw to reach the \u003cb>host or other VMs\u003c/b>."},{"id":"4x36we","k":"q","f":"What are the steps of a VM escape ?","b":"\u003col>\u003cli>Compromise a VM (app/OS flaw in VM1).\u003c/li>\u003cli>Send crafted requests to a \u003cb>virtual device\u003c/b> (network adapter, storage controller).\u003c/li>\u003cli>Trigger a hypervisor vulnerability → code runs \u003cb>outside\u003c/b> the VM.\u003c/li>\u003cli>Escape to the host/hypervisor.\u003c/li>\u003cli>Attack other VMs or steal data.\u003c/li>\u003c/ol>"},{"id":"ldxdq2","k":"def","f":"Side-channel attack","b":"inferring secrets from \u003cb>indirect information\u003c/b> (timing, cache behaviour) instead of reading data directly — possible because VMs share CPU cores and caches."},{"id":"145k0kj","k":"q","f":"What are the steps of a cache side-channel between two VMs ?","b":"\u003col>\u003cli>Both VMs share one physical CPU. 2. VM1 processes secrets (keys, passwords). 3. Attacker in VM2 observes shared cache activity. 4. Measures timing/access patterns. 5. Infers VM1&#39;s secrets from repeated measurements.\u003c/li>\u003c/ol>"},{"id":"f1uxj9","k":"tbl","f":"Fill in the table: Side-channel technique · Observes","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Side-channel technique\u003c/th>\u003cth>Observes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cache attacks\u003c/td>\u003ctd>CPU cache access patterns and timing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Timing attacks\u003c/td>\u003ctd>Execution time of sensitive operations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Speculative-execution attacks\u003c/td>\u003ctd>Microarchitectural side effects of CPU speculation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1jhuc02","k":"def","f":"SSRF (Server-Side Request Forgery)","b":"making a server send unauthorized requests to \u003cb>internal\u003c/b> systems (cloud management interfaces, internal APIs, \u003cb>metadata services\u003c/b>)."},{"id":"ai2fn2","k":"q","f":"What are the steps of SSRF in the cloud ?","b":"\u003col>\u003cli>Find an app that fetches user-supplied URLs.\u003c/li>\u003cli>Supply a URL pointing to an \u003cb>internal\u003c/b> service.\u003c/li>\u003cli>The server sends the request from \u003cb>its own network\u003c/b>.\u003c/li>\u003cli>The internal service answers (inadequately restricted).\u003c/li>\u003cli>Abuse the metadata/credentials to reach more cloud resources.\u003c/li>\u003c/ol>"},{"id":"1advbaf","k":"tbl","f":"Fill in the table: Threat · Layer it targets","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Threat\u003c/th>\u003cth>Layer it targets\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>VM escape\u003c/td>\u003ctd>The \u003cb>isolation boundary\u003c/b> enforced by the hypervisor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Side-channel\u003c/td>\u003ctd>\u003cb>Shared hardware\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>SSRF\u003c/td>\u003ctd>A \u003cb>vulnerable application\u003c/b> reaching internal cloud services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Insecure configuration\u003c/td>\u003ctd>Settings across the stack\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"lecture-4-wireless-network-security","label":"L4","title":"Wireless Network Security","cards":[{"id":"19mjjbf","k":"q","f":"Why is security even more essential in wireless networks ?","b":"\u003cul>\u003cli>Wireless signals aren&#39;t contained in a wire: \u003cb>any device in range can receive the traffic\u003c/b>. Wired LAN traffic is often unencrypted, but traffic between wireless clients and the \u003cb>AP must be encrypted\u003c/b>.\u003c/li>\u003c/ul>"},{"id":"xqe8mf","k":"def","f":"Authentication","b":"verifying the identity of a user and/or device. Clients must authenticate before associating with an AP; ideally clients also authenticate the AP (to avoid a \u003cb>malicious AP\u003c/b> and man-in-the-middle)."},{"id":"1r4r9go","k":"def","f":"Encryption","b":"scrambling a message so only the sender and intended recipient can read it (both must use the same protocol)."},{"id":"19yrbwg","k":"def","f":"Integrity","b":"the message isn&#39;t modified by a third party — checked with a \u003cb>MIC (Message Integrity Check)\u003c/b>."},{"id":"1dkf2lu","k":"q","f":"How does a MIC work ?","b":"\u003col>\u003cli>Sender calculates a MIC and attaches it.\u003c/li>\u003cli>Sender encrypts the message + MIC and sends the frame.\u003c/li>\u003cli>Recipient decrypts and \u003cb>recalculates\u003c/b> the MIC with the same protocol.\u003c/li>\u003cli>Recipient \u003cb>compares\u003c/b>: same → not tampered; different → \u003cb>discarded\u003c/b>.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">More accurate: a MIC helps \u003cb>detect\u003c/b> that integrity was compromised.\u003c/div>"},{"id":"1dzscdt","k":"tbl","f":"Fill in the table: Layer · Name · Job","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Layer\u003c/th>\u003cth>Name\u003c/th>\u003cth>Job\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Physical\u003c/td>\u003ctd>Sends/receives radio waves\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Data Link\u003c/td>\u003ctd>Frames; MAC addresses pick the local device\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Network (IP)\u003c/td>\u003ctd>Routes packets between networks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"f1ydlm","k":"def","f":"Frame","b":"the basic unit of data at Layer 2."},{"id":"bqii9q","k":"def","f":"MAC address","b":"a \u003cb>48-bit\u003c/b> hardware address (00:1A:2B:3C:4D:5E) used to deliver frames."},{"id":"12yusc3","k":"def","f":"802.11","b":"the technical name for Wi-Fi (IEEE WLAN standards)."},{"id":"f9m84h","k":"def","f":"BSS (Basic Service Set)","b":"an AP plus its clients, identified by the \u003cb>BSSID\u003c/b> (the AP radio&#39;s MAC)."},{"id":"horvuy","k":"def","f":"SSID","b":"the human-readable network name."},{"id":"b747ej","k":"def","f":"ESS (Extended Service Set)","b":"several BSSs sharing one SSID, so clients \u003cb>roam\u003c/b> between APs."},{"id":"i8rn7n","k":"def","f":"Infrastructure mode","b":"clients communicate through an AP. \u003cb>IBSS / ad hoc\u003c/b> : clients talk directly, no AP."},{"id":"1ys2nkb","k":"tbl","f":"Compare: Symmetric \u003ci>vs\u003c/i> Asymmetric (public-key)","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Symmetric\u003c/th>\u003cth>Asymmetric (public-key)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One shared secret key\u003c/td>\u003ctd>Public key (anyone) + private key (owner)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast\u003c/td>\u003ctd>Far slower\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bulk data: WEP, TKIP, CCMP, GCMP\u003c/td>\u003ctd>Briefly: authenticate and agree on a symmetric key (inside PEAP/EAP-TLS TLS tunnels)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"11hu9hh","k":"tbl","f":"Compare: Block cipher \u003ci>vs\u003c/i> Stream cipher","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Block cipher\u003c/th>\u003cth>Stream cipher\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Encrypts fixed-size chunks; needs a mode of operation\u003c/td>\u003ctd>Continuous keystream XORed with plaintext bit by bit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>AES\u003c/b> — used by CCMP, GCMP (in \u003cb>counter mode\u003c/b>, acting like a stream cipher)\u003c/td>\u003ctd>\u003cb>RC4\u003c/b> — used by WEP, TKIP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"19qk1ky","k":"def","f":"XOR","b":"1 if the bits differ, 0 if they match; XOR-ing the same keystream twice cancels out (plaintext ⊕ keystream = ciphertext; ciphertext ⊕ keystream = plaintext)."},{"id":"1e4sxyx","k":"def","f":"Digital signature","b":"(1) hash the document, (2) encrypt the hash with the signer&#39;s \u003cb>private key\u003c/b>, (3) anyone verifies with the signer&#39;s \u003cb>public key\u003c/b>."},{"id":"1r9yghs","k":"def","f":"Certificate Authority (CA)","b":"a trusted third party that signs a document binding a public key to an identity. This trust structure is \u003cb>PKI\u003c/b>."},{"id":"y0s1on","k":"tbl","f":"Compare: Hash function \u003ci>vs\u003c/i> MIC","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Hash function\u003c/th>\u003cth>MIC\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>No secret key — anyone can recompute\u003c/td>\u003ctd>Uses a \u003cb>shared secret key\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protects against accidental corruption\u003c/td>\u003ctd>Protects against \u003cb>deliberate tampering\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1nhpj8y","k":"def","f":"Pairwise key","b":"each client&#39;s own key with the AP — clients can&#39;t decrypt each other&#39;s \u003cb>unicast\u003c/b> traffic."},{"id":"1jozc6n","k":"def","f":"Group key","b":"shared by all clients, refreshed by the AP — used only for \u003cb>broadcast/multicast\u003c/b>."},{"id":"1fjq4tv","k":"def","f":"Open authentication","b":"the AP accepts every request, no credentials. Not secure alone, but combined with other methods (e.g. public Wi-Fi + web login page)."},{"id":"1qohq9v","k":"def","f":"WEP (Wired Equivalent Privacy)","b":"authentication \u003cb>and\u003c/b> encryption with \u003cb>RC4\u003c/b>; shared key of \u003cb>40 or 104 bits + 24-bit IV = 64 or 128 bits\u003c/b>. Easily cracked — \u003cb>don&#39;t use\u003c/b>."},{"id":"eib797","k":"q","f":"How does WEP challenge-response authentication work ?","b":"\u003col>\u003cli>\u003cb>Challenge\u003c/b>: AP sends a challenge phrase.\u003c/li>\u003cli>\u003cb>Response\u003c/b>: client encrypts it with the WEP key and returns it.\u003c/li>\u003cli>\u003cb>Comparison\u003c/b>: AP compares with its own encryption; match → same key → authenticated.\u003c/li>\u003c/ol>"},{"id":"dsy22f","k":"def","f":"EAP (Extensible Authentication Protocol)","b":"not one protocol but a \u003cb>framework\u003c/b> that EAP methods (LEAP, EAP-FAST, PEAP, EAP-TLS) build on."},{"id":"12yus9m","k":"def","f":"802.1X","b":"\u003cb>port-based network access control\u003c/b> — limits access until the client authenticates (wired and wireless)."},{"id":"1vesyc2","k":"tbl","f":"Fill in the table: 802.1X entity · Role · In a WLAN","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>802.1X entity\u003c/th>\u003cth>Role\u003c/th>\u003cth>In a WLAN\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Supplicant\u003c/b>\u003c/td>\u003ctd>Device that wants to connect\u003c/td>\u003ctd>Client laptop\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Authenticator\u003c/b>\u003c/td>\u003ctd>Device that provides access\u003c/td>\u003ctd>AP (or the \u003cb>WLC\u003c/b> in split-MAC)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Authentication server\u003c/b>\u003c/td>\u003ctd>Checks credentials, permits/denies\u003c/td>\u003ctd>Usually \u003cb>RADIUS\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"hougyr","k":"def","f":"PEAP","b":"server presents a \u003cb>digital certificate\u003c/b> → authenticates the server and builds the TLS tunnel; client authenticated inside (e.g. \u003cb>MS-CHAP\u003c/b>)."},{"id":"1ac54b9","k":"def","f":"EAP-TLS","b":"certificates on the \u003cb>server and every client\u003c/b>; mutual certificate authentication, no inner client authentication. \u003cb>Most secure, hardest to deploy\u003c/b>."},{"id":"1mi7vbn","k":"tbl","f":"Fill in the table: Method · Developer · Server authenticated by · Client authenticated by · Status","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Developer\u003c/th>\u003cth>Server authenticated by\u003c/th>\u003cth>Client authenticated by\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>LEAP\u003c/td>\u003ctd>Cisco\u003c/td>\u003ctd>Mutual challenge phrase\u003c/td>\u003ctd>Username/password + challenge\u003c/td>\u003ctd>Vulnerable — don&#39;t use\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EAP-FAST\u003c/td>\u003ctd>Cisco\u003c/td>\u003ctd>PAC → TLS tunnel\u003c/td>\u003ctd>Inside the tunnel\u003c/td>\u003ctd>Secure\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PEAP\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Server certificate → TLS tunnel\u003c/td>\u003ctd>Inside the tunnel (MS-CHAP)\u003c/td>\u003ctd>Secure; easier than EAP-TLS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EAP-TLS\u003c/td>\u003ctd>—\u003c/td>\u003ctd>Server certificate\u003c/td>\u003ctd>\u003cb>Client certificate\u003c/b>\u003c/td>\u003ctd>\u003cb>Most secure\u003c/b>; hardest\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"17ege0q","k":"def","f":"TKIP (Temporal Key Integrity Protocol)","b":"a \u003cb>temporary fix\u003c/b> based on WEP for old hardware; used in \u003cb>WPA\u003c/b>."},{"id":"1h2qys1","k":"q","f":"What does TKIP add to WEP ?","b":"\u003col>\u003cli>A \u003cb>MIC\u003c/b> for integrity.\u003c/li>\u003cli>\u003cb>Key mixing\u003c/b>: a unique WEP key per frame.\u003c/li>\u003cli>IV doubled \u003cb>24 → 48 bits\u003c/b>.\u003c/li>\u003cli>MIC includes the \u003cb>sender MAC address\u003c/b>.\u003c/li>\u003cli>\u003cb>Timestamp\u003c/b> against replay attacks.\u003c/li>\u003cli>\u003cb>Sequence number\u003c/b> per source MAC (wrong counter → frame dropped).\u003c/li>\u003c/ol>"},{"id":"1w7elve","k":"def","f":"CCMP (Counter Mode CBC-MAC Protocol)","b":"\u003cb>AES counter mode\u003c/b> encryption + \u003cb>CBC-MAC\u003c/b> integrity; used in \u003cb>WPA2\u003c/b>; needs hardware support."},{"id":"qvumgx","k":"def","f":"GCMP (Galois Counter Mode Protocol)","b":"\u003cb>AES counter mode\u003c/b> + \u003cb>GMAC\u003c/b> integrity; more secure and efficient (higher throughput); used in \u003cb>WPA3\u003c/b>."},{"id":"1ihfj2z","k":"tbl","f":"Fill in the table: Protocol · Encryption · Integrity · Used in","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Protocol\u003c/th>\u003cth>Encryption\u003c/th>\u003cth>Integrity\u003c/th>\u003cth>Used in\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>TKIP\u003c/td>\u003ctd>RC4 (WEP + per-frame key mixing, 48-bit IV)\u003c/td>\u003ctd>MIC (incl. sender MAC)\u003c/td>\u003ctd>WPA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CCMP\u003c/td>\u003ctd>AES counter mode\u003c/td>\u003ctd>CBC-MAC\u003c/td>\u003ctd>WPA2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>GCMP\u003c/td>\u003ctd>AES counter mode\u003c/td>\u003ctd>GMAC\u003c/td>\u003ctd>WPA3\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"o5wwfm","k":"def","f":"WPA (Wi-Fi Protected Access)","b":"standard sets of security protocols certified by the \u003cb>Wi-Fi Alliance\u003c/b> (the first is &quot;WPA&quot;, not WPA1)."},{"id":"1y5utel","k":"tbl","f":"Compare: Personal mode \u003ci>vs\u003c/i> Enterprise mode","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Personal mode\u003c/th>\u003cth>Enterprise mode\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Pre-shared key (PSK)\u003c/b> — home Wi-Fi password, SOHO\u003c/td>\u003ctd>\u003cb>802.1X + authentication server\u003c/b> with EAP methods (PEAP, EAP-TLS…)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PSK never sent over the air; \u003cb>four-way handshake\u003c/b> derives keys\u003c/td>\u003ctd>Any EAP method supported\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"r34ti","k":"q","f":"What extra features does WPA3 add ?","b":"\u003col>\u003cli>\u003cb>PMF (Protected Management Frames)\u003c/b>: protects management frames from eavesdropping/forging — optional in WPA2, \u003cb>mandatory\u003c/b> in WPA3.\u003c/li>\u003cli>\u003cb>SAE (Simultaneous Authentication of Equals)\u003c/b>: protects the four-way handshake in Personal mode.\u003c/li>\u003cli>\u003cb>Forward secrecy\u003c/b>: captured frames can&#39;t be decrypted later.\u003c/li>\u003c/ol>"},{"id":"1joswyl","k":"tbl","f":"Compare: WPA \u003ci>vs\u003c/i> WPA2 \u003ci>vs\u003c/i> WPA3","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>WPA\u003c/th>\u003cth>WPA2\u003c/th>\u003cth>WPA3\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Encryption &amp; integrity\u003c/td>\u003ctd>TKIP\u003c/td>\u003ctd>CCMP (AES-CTR + CBC-MAC)\u003c/td>\u003ctd>GCMP (AES-CTR + GMAC)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Personal mode\u003c/td>\u003ctd>PSK\u003c/td>\u003ctd>PSK\u003c/td>\u003ctd>PSK + \u003cb>SAE\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Enterprise mode\u003c/td>\u003ctd>802.1X + EAP\u003c/td>\u003ctd>802.1X + EAP\u003c/td>\u003ctd>802.1X + EAP\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protected management frames\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Optional\u003c/td>\u003ctd>\u003cb>Mandatory\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Forward secrecy\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003ctd>\u003cb>Yes\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]}];</script>
