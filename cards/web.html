<script>window.DECKS = [{"id":"lecture-1-2-intro-and-http","label":"L1–2","title":"Introduction & HTTP Deep Dive","cards":[{"id":"1hf39nn","k":"def","f":"Web application","b":"software that runs on a remote server and is accessed through a browser (Gmail, online banking, a university portal). None of its code runs permanently on your machine."},{"id":"1ge0sr6","k":"q","f":"What is the request/response cycle ?","b":"\u003cul>\u003cli>The browser sends a request → the server processes it (often talking to a database) → it sends back a response that the browser turns into the page. This happens on every click, form submit or page load.\u003c/li>\u003c/ul>"},{"id":"z66s90","k":"q","f":"What four steps happen before the browser &quot;talks&quot; to the application ?","b":"\u003col>\u003cli>\u003cb>DNS resolution\u003c/b>: the name (example.com) becomes an IP address.\u003c/li>\u003cli>\u003cb>TCP handshake\u003c/b>: SYN / SYN-ACK / ACK opens a reliable connection.\u003c/li>\u003cli>\u003cb>TLS handshake\u003c/b> (HTTPS): both sides agree on encryption keys — confidentiality, integrity, and server authentication through certificates.\u003c/li>\u003cli>\u003cb>HTTP request/response\u003c/b>: only now does the application conversation begin (GET /login …).\u003c/li>\u003c/ol>"},{"id":"s64h0q","k":"tbl","f":"Compare: Network security \u003ci>vs\u003c/i> Web application security","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Network security\u003c/th>\u003cth>Web application security\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Protects the \u003cb>pipes\u003c/b>: firewalls, routers, VPNs, TLS\u003c/td>\u003ctd>Protects what runs \u003cb>on top\u003c/b>: the application logic itself\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus: how data travels\u003c/td>\u003ctd>Focus: what the application \u003cb>does\u003c/b> with data once it arrives\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1db6p77","k":"q","f":"Split the attack surface of a web application.","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Client-side attacks (target the victim&#39;s browser)\u003c/th>\u003cth>Server-side attacks (target app server, database, backend)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cross-Site Scripting (XSS) — Week 6\u003c/td>\u003ctd>SQL Injection — Week 9\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cross-Site Request Forgery (CSRF) — Week 7\u003c/td>\u003ctd>Command Injection\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DOM-based manipulation\u003c/td>\u003ctd>Server-Side Request Forgery (SSRF)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Clickjacking\u003c/td>\u003ctd>Broken Access Control — Week 12\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1ynwoex","k":"q","f":"Why are web apps attractive targets ?","b":"\u003col>\u003cli>\u003cb>Publicly reachable\u003c/b>: anyone with a browser can reach the login page.\u003c/li>\u003cli>\u003cb>Valuable data\u003c/b>: passwords, payment details, personal records.\u003c/li>\u003cli>\u003cb>Complex\u003c/b>: more code = more places for a small mistake to hide.\u003c/li>\u003c/ol>"},{"id":"158ak0v","k":"def","f":"Confidentiality","b":"only authorized users can see the data (your bank balance stays private)."},{"id":"1fem0z2","k":"def","f":"Integrity","b":"data isn&#39;t changed without permission (no one edits your order total or grade)."},{"id":"jw3wrc","k":"def","f":"Availability","b":"the service stays reachable (a flood of fake requests can&#39;t take it offline)."},{"id":"a4h3zp","k":"def","f":"The fundamental flaw — mixing code and data","b":"letting user input be interpreted as \u003cb>executable instructions\u003c/b> instead of plain data. It is the root of SQL injection, command injection, XSS and more."},{"id":"9koe8e","k":"q","f":"List the OWASP Top 10 (2021) — the edition used in this course.","b":"\u003col>\u003cli>A01 Broken Access Control\u003c/li>\u003cli>A02 Cryptographic Failures\u003c/li>\u003cli>A03 Injection\u003c/li>\u003cli>A04 Insecure Design\u003c/li>\u003cli>A05 Security Misconfiguration\u003c/li>\u003cli>A06 Vulnerable and Outdated Components\u003c/li>\u003cli>A07 Identification and Authentication Failures\u003c/li>\u003cli>A08 Software and Data Integrity Failures\u003c/li>\u003cli>A09 Security Logging and Monitoring Failures\u003c/li>\u003cli>A10 Server-Side Request Forgery (SSRF)\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">The 2025 edition reshuffles it (Security Misconfiguration moves to #2; Software Supply Chain Failures is new). Always check the \u003cb>year\u003c/b> before comparing numbers.\u003c/div>"},{"id":"ft48ih","k":"def","f":"Rules of Engagement (RoE)","b":"a written agreement before testing that defines what is in scope / out of scope, timing, allowed methods and contacts."},{"id":"1e95cx1","k":"def","f":"Responsible (Coordinated) Disclosure","b":"report a flaw privately to the owner first and give them a fair window (commonly \u003cb>~90 days\u003c/b>) before going public."},{"id":"196gggo","k":"def","f":"Safe Harbor / Bug Bounty","b":"platforms (HackerOne, Bugcrowd) publish an official, legally protected scope so testing within it is authorized (and often paid)."},{"id":"mhtcxq","k":"q","f":"What are the four parts of every HTTP message ?","b":"\u003col>\u003cli>\u003cb>Start line / status line\u003c/b> — what is asked for (request) or what happened (response).\u003c/li>\u003cli>\u003cb>Headers\u003c/b> — metadata: format, size, cookies, caching…\u003c/li>\u003cli>\u003cb>Blank line\u003c/b> — marks the end of headers.\u003c/li>\u003cli>\u003cb>Body\u003c/b> — the payload (form data up, HTML/JSON down).\u003c/li>\u003c/ol>"},{"id":"qb8v2f","k":"def","f":"Safe method","b":"doesn&#39;t change server state."},{"id":"m0ww4n","k":"def","f":"Idempotent method","b":"sending it twice has the same effect as once."},{"id":"m11f0q","k":"tbl","f":"Fill in the table: Method · Purpose · Safe? · Idempotent?","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>Safe?\u003c/th>\u003cth>Idempotent?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>GET\u003c/td>\u003ctd>Retrieve a resource\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>POST\u003c/td>\u003ctd>Create / submit data\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PUT\u003c/td>\u003ctd>Replace a resource entirely\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PATCH\u003c/td>\u003ctd>Partially update\u003c/td>\u003ctd>No\u003c/td>\u003ctd>No\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DELETE\u003c/td>\u003ctd>Remove a resource\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HEAD\u003c/td>\u003ctd>Like GET, headers only\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OPTIONS\u003c/td>\u003ctd>Ask what&#39;s allowed (CORS preflight)\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Yes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1e4a127","k":"def","f":"Verb tampering (method override abuse)","b":"bypassing an access rule that checks only the literal method (e.g. blocks POST to /admin/delete but forgets GET/HEAD), or abusing a header like \u003cb>X-HTTP-Method-Override\u003c/b>. Fix: \u003cb>authorize the action, not the verb string\u003c/b>."},{"id":"z6dj56","k":"q","f":"What are the HTTP status code classes ?","b":"\u003col>\u003cli>\u003cb>1xx\u003c/b> Informational — 100 Continue.\u003c/li>\u003cli>\u003cb>2xx\u003c/b> Success — 200 OK, 201 Created.\u003c/li>\u003cli>\u003cb>3xx\u003c/b> Redirection — 301 Moved Permanently, 302 Found.\u003c/li>\u003cli>\u003cb>4xx\u003c/b> Client error — 400, 401, 403, 404.\u003c/li>\u003cli>\u003cb>5xx\u003c/b> Server error — 500, 503.\u003c/li>\u003c/ol>"},{"id":"1p1tukb","k":"tbl","f":"Compare: 401 Unauthorized \u003ci>vs\u003c/i> 403 Forbidden","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>401 Unauthorized\u003c/th>\u003cth>403 Forbidden\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Actually means \u003cb>unauthenticated\u003c/b>\u003c/td>\u003ctd>Identity known, \u003cb>permissions insufficient\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>&quot;Who are you?&quot;\u003c/td>\u003ctd>&quot;I know who you are, and the answer is still no.&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"fm8086","k":"def","f":"Username enumeration","b":"different messages for &quot;wrong password&quot; and &quot;no such user&quot; let an attacker discover valid usernames. Fix: one \u003cb>generic error\u003c/b> either way."},{"id":"1j8fqr9","k":"def","f":"HTTP is stateless","b":"every request is brand new; the server keeps no memory. Applications rebuild state with \u003cb>cookies\u003c/b>."},{"id":"19guks6","k":"q","f":"Which cookie attributes matter for security ?","b":"\u003col>\u003cli>\u003cb>Secure\u003c/b>: sent only over HTTPS.\u003c/li>\u003cli>\u003cb>HttpOnly\u003c/b>: JavaScript can&#39;t read it — limits what XSS can steal.\u003c/li>\u003cli>\u003cb>SameSite\u003c/b>: restricts sending the cookie with cross-site requests — core CSRF defense.\u003c/li>\u003cli>\u003cb>Domain\u003c/b>: which hosts receive it. \u003cb>Path\u003c/b>: which URL paths.\u003c/li>\u003c/ol>"},{"id":"1si9unc","k":"tbl","f":"Fill in the table: SameSite value · Behaviour","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>SameSite value\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Strict\u003c/b>\u003c/td>\u003ctd>Never sent on any cross-site request, even a link click. Strongest; can break cross-site flows\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Lax\u003c/b>\u003c/td>\u003ctd>Sent only with safe top-level navigation (clicking a link), not cross-site POSTs, images, iframes. \u003cb>Modern browser default\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>None\u003c/b>\u003c/td>\u003ctd>Sent with every cross-site request; \u003cb>requires Secure\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"vk6n8o","k":"tbl","f":"Compare: Security header \u003ci>vs\u003c/i> Protects against","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Security header\u003c/th>\u003cth>Protects against\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Strict-Transport-Security (\u003cb>HSTS\u003c/b>)\u003c/td>\u003ctd>Forces HTTPS; blocks downgrade / SSL-stripping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Content-Security-Policy (\u003cb>CSP\u003c/b>)\u003c/td>\u003ctd>Restricts which scripts/resources run — major XSS defense\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X-Content-Type-Options: nosniff\u003c/td>\u003ctd>Browser guessing file types (content-type confusion)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>X-Frame-Options\u003c/td>\u003ctd>Being framed by another site — \u003cb>clickjacking\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Access-Control-Allow-Origin\u003c/td>\u003ctd>CORS: which origins may read the response via JS\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Referrer-Policy: no-referrer\u003c/td>\u003ctd>Leaking the full previous URL (with tokens) to third parties\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1p0hd34","k":"q","f":"How do headers leak data without any &quot;attack&quot; ?","b":"\u003col>\u003cli>\u003cb>Referer\u003c/b>: a URL like /reset?token=abc123 with a third-party image or link hands the token to that third party → fix with \u003cb>Referrer-Policy\u003c/b>.\u003c/li>\u003cli>\u003cb>Caching\u003c/b>: without \u003cb>Cache-Control: no-store\u003c/b>, a bank statement stays in the browser cache after logout; the next user on a shared PC can press Back.\u003c/li>\u003c/ol>"},{"id":"1vx0u8x","k":"def","f":"Host Header Injection","b":"the app trusts the client-supplied \u003cb>Host\u003c/b> header to build absolute URLs."},{"id":"18krine","k":"def","f":"Password-reset poisoning","b":"the attacker requests a reset for the victim with \u003ccode>Host: attacker.com\u003c/code>; the email link points to the attacker&#39;s domain, so the victim&#39;s reset \u003cb>token is sent to the attacker\u003c/b>. Fix: never build security-sensitive URLs from client input; \u003cb>allow-list\u003c/b> real domains."},{"id":"fsyjl3","k":"def","f":"HTTPS = HTTP + TLS","b":"the same HTTP conversation wrapped in TLS, giving \u003cb>confidentiality\u003c/b> (encrypted), \u003cb>integrity\u003c/b> (can&#39;t be altered) and \u003cb>authenticity\u003c/b> (certificate). Never dismiss a &quot;connection not secure&quot; warning."}]},{"id":"lecture-3-authentication-and-sessions","label":"L3","title":"Authentication & Session Management","cards":[{"id":"aqyu7i","k":"def","f":"Authentication (AuthN)","b":"answers &quot;\u003cb>who are you?\u003c/b>&quot; — proving identity (e.g. username + password)."},{"id":"ivh2w1","k":"def","f":"Authorization (AuthZ)","b":"answers &quot;\u003cb>what are you allowed to do?\u003c/b>&quot; — which resources and actions the known identity may use."},{"id":"948x7p","k":"tbl","f":"Compare: Authentication \u003ci>vs\u003c/i> Authorization","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Authentication\u003c/th>\u003cth>Authorization\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Who are you?\u003c/td>\u003ctd>What may you do?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fails → \u003cb>401\u003c/b> (identity unknown)\u003c/td>\u003ctd>Fails → \u003cb>403\u003c/b> (identity known, action denied)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comes first\u003c/td>\u003ctd>Comes after identity is verified\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"oge3wk","k":"def","f":"Authentication factor","b":"a category of evidence used to prove identity."},{"id":"hiyrbs","k":"tbl","f":"Fill in the table: Factor · Examples · Weakness if used alone","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Factor\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Weakness if used alone\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Something you \u003cb>know\u003c/b>\u003c/td>\u003ctd>Password, PIN, security question\u003c/td>\u003ctd>Guessed, phished, or reused from another breach\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Something you \u003cb>have\u003c/b>\u003c/td>\u003ctd>Phone (OTP app / SMS), hardware key (YubiKey)\u003c/td>\u003ctd>Lost, stolen, or SMS intercepted (SIM swap)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Something you \u003cb>are\u003c/b>\u003c/td>\u003ctd>Fingerprint, face recognition\u003c/td>\u003ctd>Can&#39;t be &quot;reset&quot; if the biometric data is compromised\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"kx4wa3","k":"def","f":"MFA (Multi-Factor Authentication)","b":"combining factors from at least \u003cb>two different categories\u003c/b>."},{"id":"s5knku","k":"q","f":"Why is MFA stronger than one factor ?","b":"\u003cul>\u003cli>It forces the attacker to defeat \u003cb>two unrelated categories\u003c/b> at once; a leaked password alone is no longer enough.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sm-key\">Two passwords = still one factor (both &quot;something you know&quot;).\u003c/div>"},{"id":"1aybz6k","k":"q","f":"How must passwords NOT be stored ?","b":"\u003col>\u003cli>In \u003cb>plaintext\u003c/b>.\u003c/li>\u003cli>With \u003cb>reversible encryption\u003c/b> (they must never be recoverable).\u003c/li>\u003c/ol>"},{"id":"1058ewr","k":"def","f":"Hashing","b":"a one-way function. Login = re-hash the entered password and \u003cb>compare hashes\u003c/b> — never decrypt."},{"id":"4al1cz","k":"def","f":"Salt","b":"a unique random value per user added before hashing, so identical passwords give different hashes — defeats \u003cb>rainbow tables\u003c/b>."},{"id":"1sj8gws","k":"def","f":"Slow hash","b":"deliberately expensive algorithm so guessing millions of passwords per second becomes costly."},{"id":"1wui5t4","k":"q","f":"Rank the acceptable password hashing algorithms (OWASP).","b":"\u003col>\u003cli>\u003cb>Argon2id\u003c/b> — first choice.\u003c/li>\u003cli>\u003cb>scrypt\u003c/b> — fallback.\u003c/li>\u003cli>\u003cb>bcrypt\u003c/b> — legacy systems.\u003c/li>\u003cli>\u003cb>PBKDF2\u003c/b> — where FIPS-140 compliance is required.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Plain \u003cb>MD5 or SHA-256 are NOT acceptable\u003c/b> for passwords: they&#39;re designed to be \u003cb>fast\u003c/b>, exactly the wrong property here.\u003c/div>"},{"id":"j8oyu2","k":"def","f":"Session ID","b":"a long, random, unguessable value issued after login via \u003cb>Set-Cookie\u003c/b>; the browser resends it with every request and the server looks it up in its \u003cb>session store\u003c/b>."},{"id":"10fyf94","k":"q","f":"What two operational rules matter for sessions ?","b":"\u003col>\u003cli>\u003cb>Idle timeout\u003c/b>: sessions expire after inactivity.\u003c/li>\u003cli>\u003cb>Regenerate the session ID at login\u003c/b>: always issue a fresh ID, replacing whatever the browser held before.\u003c/li>\u003c/ol>"},{"id":"bxinct","k":"def","f":"Session Fixation","b":"the attacker gets the victim to authenticate using a session ID \u003cb>the attacker already knows\u003c/b>; if the server keeps the same ID after login, the attacker is now logged in as the victim. The attacker never touches the victim&#39;s credentials."},{"id":"g9imkk","k":"tbl","f":"Fill in the table: Attack · How it works · Primary mitigation","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Attack\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Primary mitigation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Brute force\u003c/b>\u003c/td>\u003ctd>Automated tool tries many passwords against one account\u003c/td>\u003ctd>Account lockout / rate limiting, CAPTCHA, MFA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Credential stuffing\u003c/b>\u003c/td>\u003ctd>Replays username/password pairs leaked from \u003cb>other\u003c/b> breaches\u003c/td>\u003ctd>MFA, check new passwords against breach lists, per-IP rate limiting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Session hijacking\u003c/b>\u003c/td>\u003ctd>Steals a valid session ID via XSS, sniffing plain HTTP, or a leaked log\u003c/td>\u003ctd>\u003cb>HttpOnly + Secure\u003c/b> cookies, HTTPS everywhere\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Session fixation\u003c/b>\u003c/td>\u003ctd>Victim logs in with an attacker-known session ID\u003c/td>\u003ctd>\u003cb>Regenerate\u003c/b> the session ID at login\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"3isdq","k":"tbl","f":"Compare: Brute force \u003ci>vs\u003c/i> Credential stuffing","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Brute force\u003c/th>\u003cth>Credential stuffing\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Guesses passwords\u003c/td>\u003ctd>Reuses real leaked pairs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One account, many guesses\u003c/td>\u003ctd>Many accounts, one leaked pair each\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lockout helps\u003c/td>\u003ctd>MFA and breach-list checks help\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1quayau","k":"def","f":"Token-based authentication (JWT)","b":"a self-contained token of three \u003cb>base64url\u003c/b> parts — \u003ccode>header.payload.signature\u003c/code>."},{"id":"171fti8","k":"q","f":"What does each JWT part contain ?","b":"\u003col>\u003cli>\u003cb>Header\u003c/b>: the signing algorithm.\u003c/li>\u003cli>\u003cb>Payload\u003c/b>: claims (who the user is, when the token expires).\u003c/li>\u003cli>\u003cb>Signature\u003c/b>: created with a server-held secret or private key, so the server can verify the token wasn&#39;t tampered with \u003cb>without storing it\u003c/b>.\u003c/li>\u003c/ol>"},{"id":"ky0cp9","k":"tbl","f":"Compare: Session cookie \u003ci>vs\u003c/i> JWT","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Session cookie\u003c/th>\u003cth>JWT\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Server keeps a lookup table of sessions\u003c/td>\u003ctd>Stateless: nothing stored server-side\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Revoke by deleting the session entry\u003c/td>\u003ctd>A stolen token stays \u003cb>valid until it expires\u003c/b> (no entry to revoke)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"sr4z5y","k":"def","f":"OAuth 2.0 / SSO (Single Sign-On)","b":"the user authenticates \u003cb>once\u003c/b> with a trusted identity provider (Google, Microsoft, university account) and reuses that identity across many applications — the app avoids storing passwords at all."},{"id":"wde8ij","k":"q","f":"What is the common theme behind session fixation ?","b":"\u003cul>\u003cli>Trusting something that should have been \u003cb>regenerated\u003c/b> — the same lesson as Weeks 1–2: don&#39;t trust values the client (or attacker) controls.\u003c/li>\u003c/ul>"}]},{"id":"lecture-4-web-app-architecture","label":"L4","title":"Web Application Architecture","cards":[{"id":"2qwosd","k":"def","f":"Three-tier (N-tier) architecture","b":"the application split into a \u003cb>presentation\u003c/b> tier (what the user sees), an \u003cb>application\u003c/b> tier (business logic) and a \u003cb>data\u003c/b> tier (persistent storage)."},{"id":"1fg600g","k":"tbl","f":"Fill in the table: Component · Role · Key security consideration","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Component\u003c/th>\u003cth>Role\u003c/th>\u003cth>Key security consideration\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Reverse proxy / Load balancer\u003c/td>\u003ctd>Distributes traffic, often terminates TLS\u003c/td>\u003ctd>Forward the real client IP; handle the \u003cb>Host\u003c/b> header safely\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API gateway\u003c/td>\u003ctd>Single entry point for backend APIs\u003c/td>\u003ctd>Good place for auth and rate limiting — but one misconfiguration exposes everything behind it\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application server\u003c/td>\u003ctd>Executes business logic\u003c/td>\u003ctd>Where most \u003cb>injection\u003c/b> vulnerabilities live\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cache (e.g. Redis)\u003c/td>\u003ctd>Speeds up repeated reads\u003c/td>\u003ctd>Can leak data across users if not access-controlled per session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CDN\u003c/td>\u003ctd>Serves static assets from edge locations\u003c/td>\u003ctd>Cache poisoning / deception risk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Database\u003c/td>\u003ctd>Persistent storage\u003c/td>\u003ctd>Never directly reachable from the internet; least-privilege accounts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Third-party APIs\u003c/td>\u003ctd>Payments, maps, analytics\u003c/td>\u003ctd>Expands attack surface beyond your code — \u003cb>supply-chain\u003c/b> risk\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1c8ap3i","k":"def","f":"MVC (Model-View-Controller)","b":"\u003cb>Model\u003c/b> holds data and business rules; \u003cb>View\u003c/b> renders what the user sees; \u003cb>Controller\u003c/b> receives requests, decides what happens, coordinates the other two."},{"id":"ypx2ca","k":"q","f":"Where do input validation and authorization checks belong in MVC ?","b":"\u003cul>\u003cli>In the \u003cb>Controller and Model\u003c/b>, before any business logic runs — \u003cb>never\u003c/b> left to the View, never assumed done upstream.\u003c/li>\u003c/ul>"},{"id":"ohs5j9","k":"def","f":"Trust boundary","b":"any point where data crosses from a zone you don&#39;t control into one you do, or from lower to higher privilege."},{"id":"1ga3ica","k":"q","f":"What are the six STRIDE categories ?","b":"\u003col>\u003cli>\u003cb>S\u003c/b>poofing — pretending to be someone/something else.\u003c/li>\u003cli>\u003cb>T\u003c/b>ampering — altering data in transit or at rest.\u003c/li>\u003cli>\u003cb>R\u003c/b>epudiation — denying an action with no proof otherwise.\u003c/li>\u003cli>\u003cb>I\u003c/b>nformation disclosure — exposing data to the wrong people.\u003c/li>\u003cli>\u003cb>D\u003c/b>enial of service — making the system unavailable.\u003c/li>\u003cli>\u003cb>E\u003c/b>levation of privilege — gaining more access than granted.\u003c/li>\u003c/ol>"},{"id":"2buj14","k":"def","f":"Threat modeling","b":"walking the architecture \u003cb>boundary by boundary\u003c/b>, asking which STRIDE category applies and what the defense is — \u003cb>before\u003c/b> the system is built."},{"id":"bg7qfg","k":"tbl","f":"Fill in the table: Boundary · Likely STRIDE threat · Impact &amp; primary defense","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Boundary\u003c/th>\u003cth>Likely STRIDE threat\u003c/th>\u003cth>Impact &amp; primary defense\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Client → CDN / Proxy\u003c/td>\u003ctd>Tampering, DoS\u003c/td>\u003ctd>Traffic altered or flooded → TLS everywhere, rate limiting, WAF\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Proxy → App server\u003c/td>\u003ctd>Spoofing, Info disclosure\u003c/td>\u003ctd>Forged client IP or Host header → validate X-Forwarded-For, allow-list domains\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App server → Database\u003c/td>\u003ctd>Tampering, Elevation\u003c/td>\u003ctd>SQLi or over-privileged DB account → parameterized queries + least privilege\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App → Other microservices\u003c/td>\u003ctd>Spoofing, Elevation\u003c/td>\u003ctd>&quot;Internal = safe&quot; assumption → \u003cb>mTLS + Zero Trust\u003c/b>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1of1ld","k":"def","f":"Web Cache Poisoning","b":"abuses \u003cb>unkeyed inputs\u003c/b> (headers/parameters that change the response but aren&#39;t part of the cache key, e.g. \u003cb>X-Forwarded-Host\u003c/b>). One malicious request poisons the cached copy served to \u003cb>everyone\u003c/b> afterwards."},{"id":"apzj5q","k":"def","f":"Web Cache Deception","b":"tricks the cache into storing a \u003cb>private\u003c/b> page. A request like \u003ccode>/account/profile.css\u003c/code> hits a dynamic, authenticated endpoint, but the cache — fooled by the \u003ccode>.css\u003c/code> suffix — stores the personal page as a static asset, retrievable by anyone requesting the same URL."},{"id":"ja74oh","k":"tbl","f":"Compare: Cache poisoning \u003ci>vs\u003c/i> Cache deception","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Cache poisoning\u003c/th>\u003cth>Cache deception\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Poisons \u003cb>shared\u003c/b> content for everyone\u003c/td>\u003ctd>Exposes \u003cb>one victim&#39;s private\u003c/b> content\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abuses an unkeyed input\u003c/td>\u003ctd>Abuses a static-looking extension / path mapping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Attacker&#39;s response reaches victims\u003c/td>\u003ctd>Victim&#39;s response reaches the attacker\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"s3ll53","k":"def","f":"HTTP Request Smuggling","b":"a request carries both \u003cb>Content-Length\u003c/b> and \u003cb>Transfer-Encoding: chunked\u003c/b>, and the proxy trusts one while the backend trusts the other (classic \u003cb>CL.TE\u003c/b>: proxy uses CL, backend uses TE). A second, hidden request reaches the backend \u003cb>without passing the proxy&#39;s filters\u003c/b>."},{"id":"1qrfk7k","k":"tbl","f":"Compare: Monolith \u003ci>vs\u003c/i> Microservices","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Monolith\u003c/th>\u003cth>Microservices\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>One deployable unit\u003c/td>\u003ctd>Many small, independently deployed services\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Simpler to build\u003c/td>\u003ctd>Limits how far one compromised service reaches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>One vulnerability can expose everything (one blast radius)\u003c/td>\u003ctd>Many more network boundaries, each needs auth and validation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1fgreyn","k":"def","f":"Zero Trust (ZTNA)","b":"no request is trusted because of where it came from — every service-to-service call is \u003cb>authenticated and authorized every time\u003c/b>."},{"id":"180jxm9","k":"def","f":"mTLS (mutual TLS)","b":"both sides present certificates, so Service A proves who it is to Service B \u003cb>and vice versa\u003c/b> (normal HTTPS: only the server proves itself)."},{"id":"opdp0n","k":"def","f":"Service mesh","b":"an infrastructure layer that automatically wraps every internal call in mTLS."},{"id":"femrtn","k":"def","f":"SSRF (Server-Side Request Forgery, A10:2021)","b":"tricking the app server into requesting an \u003cb>internal-only\u003c/b> address; internal services that &quot;trust the inside&quot; respond — including cloud metadata endpoints like \u003cb>169.254.169.254\u003c/b> that can hand over credentials."},{"id":"v1844t","k":"tbl","f":"Fill in the table: Account · Privileges · Used by","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Account\u003c/th>\u003cth>Privileges\u003c/th>\u003cth>Used by\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>App read account\u003c/td>\u003ctd>SELECT only\u003c/td>\u003ctd>Reports, search, read-heavy endpoints\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App write account\u003c/td>\u003ctd>SELECT, INSERT, UPDATE (no DROP/ALTER)\u003c/td>\u003ctd>Core transactional logic (checkout, profile)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Migration / admin\u003c/td>\u003ctd>Full schema privileges\u003c/td>\u003ctd>CI/CD migration jobs only — \u003cb>never\u003c/b> the running app\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"qfgno4","k":"def","f":"Insecure Design (A04:2021)","b":"flaws baked into the architecture before any code is written. A well-coded implementation of a badly designed architecture is still insecure."},{"id":"8etnol","k":"q","f":"Booking/payment app — apply the lecture&#39;s rules.","b":"\u003col>\u003cli>Redis (sessions) on a \u003cb>private segment\u003c/b>, reachable only from the app tier.\u003c/li>\u003cli>Payment API keys and DB credentials in a \u003cb>secrets manager\u003c/b>, injected at startup, never hard-coded or returned.\u003c/li>\u003cli>App server \u003cb>forbidden\u003c/b> from requesting internal IPs / metadata (anti-SSRF).\u003c/li>\u003cli>Internal call to the payment microservice over \u003cb>mTLS\u003c/b> (Zero Trust).\u003c/li>\u003c/ol>"}]},{"id":"lecture-5-securing-web-app-data","label":"L5","title":"Securing Web Application Data","cards":[{"id":"15hai9b","k":"def","f":"Data classification","b":"sorting data into levels so each level gets the protection it needs. Treating everything the same wastes effort in one direction and creates risk in the other."},{"id":"98kyco","k":"tbl","f":"Fill in the table: Level · Example · Required protection","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Level\u003c/th>\u003cth>Example\u003c/th>\u003cth>Required protection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Public\u003c/b>\u003c/td>\u003ctd>Marketing pages, published prices\u003c/td>\u003ctd>Integrity checks only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Internal\u003c/b>\u003c/td>\u003ctd>Internal docs, non-public reports\u003c/td>\u003ctd>Access control and authentication\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Confidential\u003c/b>\u003c/td>\u003ctd>Financial records, business strategy\u003c/td>\u003ctd>Access control + \u003cb>encryption at rest\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Restricted\u003c/b>\u003c/td>\u003ctd>National ID, health records, payment cards\u003c/td>\u003ctd>Encryption at rest \u003cb>and\u003c/b> in transit, strict access logging, often regulation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"xjc595","k":"def","f":"Data in transit","b":"moving across a network (browser ↔ server, service ↔ service) — protected mainly by \u003cb>TLS\u003c/b>."},{"id":"g7weik","k":"def","f":"Data at rest","b":"sitting in storage (database, files, backups, cache)."},{"id":"1n2z9hm","k":"def","f":"Encoding","b":"changes data format for compatibility (Base64, URL encoding). \u003cb>No key, reversible by anyone\u003c/b> → provides \u003cb>no confidentiality\u003c/b>."},{"id":"1eyerra","k":"def","f":"Encryption","b":"transforms data with a \u003cb>secret key\u003c/b>; only the key holder can reverse it."},{"id":"1058ewr","k":"def","f":"Hashing","b":"\u003cb>one-way\u003c/b>, no key, no reversal; used for password storage and integrity checks. A hash alone does \u003cb>not\u003c/b> provide authenticity."},{"id":"1hec5k6","k":"tbl","f":"Fill in the table: Technique · Reversible? · Needs a key? · Typical use","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Technique\u003c/th>\u003cth>Reversible?\u003c/th>\u003cth>Needs a key?\u003c/th>\u003cth>Typical use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Encoding\u003c/td>\u003ctd>Yes, by \u003cb>anyone\u003c/b>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Format compatibility (Base64, URL)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Encryption\u003c/td>\u003ctd>Yes, \u003cb>only with the key\u003c/b>\u003c/td>\u003ctd>Yes\u003c/td>\u003ctd>Confidentiality in transit / at rest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hashing\u003c/td>\u003ctd>\u003cb>No\u003c/b>\u003c/td>\u003ctd>No\u003c/td>\u003ctd>Passwords (Week 3), integrity verification\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"pnnddr","k":"tbl","f":"Compare: Symmetric \u003ci>vs\u003c/i> Asymmetric","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Symmetric\u003c/th>\u003cth>Asymmetric\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>One shared key\u003c/b> encrypts and decrypts\u003c/td>\u003ctd>\u003cb>Key pair\u003c/b>: public key (shared) + private key (secret)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fast — good for large data\u003c/td>\u003ctd>Computationally expensive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Example: \u003cb>AES\u003c/b>\u003c/td>\u003ctd>Data encrypted with the public key decrypts only with the private key\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1j7jxnm","k":"q","f":"How does TLS use both ?","b":"\u003col>\u003cli>The handshake uses asymmetric cryptography \u003cb>only long enough\u003c/b> to authenticate and agree on a shared session key (modern TLS: asymmetric for \u003cb>authentication/signatures\u003c/b>, \u003cb>ephemeral Diffie–Hellman\u003c/b> for key exchange).\u003c/li>\u003cli>Every following byte is protected with \u003cb>fast symmetric\u003c/b> encryption.\u003c/li>\u003c/ol>"},{"id":"1t1o7x1","k":"q","f":"What are the three principles of key management ?","b":"\u003col>\u003cli>\u003cb>Never store the key with the data\u003c/b> it protects — use a \u003cb>key management service (KMS)\u003c/b> or \u003cb>HSM\u003c/b> / secrets manager.\u003c/li>\u003cli>\u003cb>Rotate keys\u003c/b> on a schedule, so a past exposure doesn&#39;t stay valid forever.\u003c/li>\u003cli>\u003cb>Never hard-code keys\u003c/b> in source code or config committed to version control — that publishes them to anyone with repository access.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Same stolen backup, two outcomes: encrypted at rest with the key stored \u003cb>separately\u003c/b> → useless to the attacker; key next to the data → fully readable.\u003c/div>"},{"id":"e72c08","k":"def","f":"Key lifecycle","b":"generate → store securely → use → rotate → revoke/destroy."},{"id":"1t4gcf0","k":"def","f":"Tokenization","b":"replace a sensitive value (e.g. a card number) with a \u003cb>random token\u003c/b> that has no mathematical relationship to it; the real mapping lives in a separate, tightly controlled \u003cb>vault\u003c/b>. A breached database yields only meaningless tokens."},{"id":"zcqx2x","k":"def","f":"Data minimization","b":"collect only what a feature really needs, and \u003cb>delete it\u003c/b> once its purpose is fulfilled. Data never collected can&#39;t leak."},{"id":"290n50","k":"tbl","f":"Compare: Tokenization \u003ci>vs\u003c/i> Encryption","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Tokenization\u003c/th>\u003cth>Encryption\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Random token, no math link to the original\u003c/td>\u003ctd>Ciphertext derived from the original with a key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reverse only by looking up the vault\u003c/td>\u003ctd>Reverse with the key\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Common for payment cards\u003c/td>\u003ctd>General confidentiality\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1tfuo0s","k":"def","f":"Cryptographic Failures (OWASP A02:2021)","b":"this lecture&#39;s category."},{"id":"1fjwsrm","k":"q","f":"What does A02:2021 Cryptographic Failures cover ?","b":"\u003col>\u003cli>Sending sensitive data in \u003cb>plain text\u003c/b> instead of over TLS.\u003c/li>\u003cli>\u003cb>Outdated or weak algorithms\u003c/b> such as MD5 or DES.\u003c/li>\u003cli>Sensitive data \u003cb>unencrypted at rest\u003c/b>.\u003c/li>\u003cli>Keys \u003cb>stored or generated improperly\u003c/b> (hard-coded, next to the data, never rotated).\u003c/li>\u003cli>\u003cb>Predictable random numbers\u003c/b> where a cryptographically secure source was needed.\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">Nearly every item is a direct violation of a principle from this lecture.\u003c/div>"}]},{"id":"lecture-6-xss","label":"L6","title":"Cross-Site Scripting (XSS)","cards":[{"id":"1abl7wn","k":"def","f":"Cross-Site Scripting (XSS)","b":"the application puts untrusted input into a page \u003cb>without neutralizing it\u003c/b>, so the browser runs it as \u003cb>script\u003c/b> instead of showing it as text."},{"id":"lk1zp1","k":"tbl","f":"Fill in the table: Category · Where the payload lives · Persistence · Typical delivery","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Where the payload lives\u003c/th>\u003cth>Persistence\u003c/th>\u003cth>Typical delivery\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Reflected\u003c/b>\u003c/td>\u003ctd>In the request itself (URL parameter)\u003c/td>\u003ctd>Not stored; one response only\u003c/td>\u003ctd>A crafted link, often by phishing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Stored\u003c/b>\u003c/td>\u003ctd>Saved on the server (comment, profile field)\u003c/td>\u003ctd>\u003cb>Persistent\u003c/b>; served to every visitor\u003c/td>\u003ctd>No further interaction once posted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>DOM-based\u003c/b>\u003c/td>\u003ctd>Never reaches the server; written by client-side script\u003c/td>\u003ctd>Depends on the script\u003c/td>\u003ctd>Manipulating a URL fragment or other client source\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"ha7z4z","k":"q","f":"Which XSS category is the most consequential and why ?","b":"\u003cul>\u003cli>\u003cb>Stored\u003c/b>: one successful injection runs in the browser of \u003cb>every later visitor\u003c/b>, with no further action from the attacker.\u003c/li>\u003c/ul>"},{"id":"1mysu44","k":"def","f":"Source","b":"where untrusted data \u003cb>enters\u003c/b> client-side script."},{"id":"4akv3q","k":"def","f":"Sink","b":"a function/property that turns a string into \u003cb>parsed markup or executed code\u003c/b>."},{"id":"19zuaos","k":"tbl","f":"Compare: Sources \u003ci>vs\u003c/i> Sinks","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Sources\u003c/th>\u003cth>Sinks\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>location.hash, location.search\u003c/td>\u003ctd>element.innerHTML, element.outerHTML\u003c/td>\u003c/tr>\u003ctr>\u003ctd>document.referrer, document.URL\u003c/td>\u003ctd>document.write(), document.writeln()\u003c/td>\u003c/tr>\u003ctr>\u003ctd>window.name\u003c/td>\u003ctd>eval(), new Function()\u003c/td>\u003c/tr>\u003ctr>\u003ctd>postMessage data\u003c/td>\u003ctd>setTimeout()/setInterval() with a \u003cb>string\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>Event-handler attribute set from untrusted data\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1q7el3y","k":"q","f":"What does an attacker gain from XSS ?","b":"\u003col>\u003cli>\u003cb>Session theft\u003c/b> (most common): read the session cookie and send it to the attacker&#39;s server → impersonate the victim without the password.\u003c/li>\u003cli>Capture \u003cb>keystrokes\u003c/b>.\u003c/li>\u003cli>Redirect to a \u003cb>fake login\u003c/b> form.\u003c/li>\u003cli>\u003cb>Submit requests\u003c/b> on the victim&#39;s behalf (links to CSRF, Week 7).\u003c/li>\u003cli>\u003cb>Deface\u003c/b> the page.\u003c/li>\u003c/ol>"},{"id":"1tazp1","k":"def","f":"Output encoding","b":"converting special characters (like &lt; &gt;) to harmless text \u003cb>at the exact point\u003c/b> data is written into the page. The primary defense."},{"id":"3a3rak","k":"tbl","f":"Fill in the table: Output context · Where · Correct encoding","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Output context\u003c/th>\u003cth>Where\u003c/th>\u003cth>Correct encoding\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>HTML body\u003c/td>\u003ctd>Text between tags (inside p or div)\u003c/td>\u003ctd>\u003cb>HTML entity\u003c/b> encoding (&lt; &gt; &amp; &quot; &#39;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HTML attribute\u003c/td>\u003ctd>Inside value=&quot;…&quot; or href\u003c/td>\u003ctd>Entity-encode \u003cb>everything outside a small safe set\u003c/b> (attributes can be closed by more than &gt;)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>JavaScript variable\u003c/td>\u003ctd>Inside a script, as an already-quoted string\u003c/td>\u003ctd>\u003cb>Unicode escaping\u003c/b>; only ever inside an existing quoted string\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CSS value\u003c/td>\u003ctd>Stylesheet or style attribute\u003c/td>\u003ctd>\u003cb>CSS hex\u003c/b> encoding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>URL parameter\u003c/td>\u003ctd>Query string / URL part\u003c/td>\u003ctd>\u003cb>Percent\u003c/b> encoding\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"1hxuund","k":"q","f":"What are the additional layers of defense ?","b":"\u003col>\u003cli>\u003cb>Input validation\u003c/b> with an \u003cb>allow list\u003c/b> of permitted characters/formats (not a block list).\u003c/li>\u003cli>A \u003cb>sanitization library\u003c/b> when some HTML must be accepted (parse and rebuild, no custom filters).\u003c/li>\u003cli>\u003cb>Content-Security-Policy\u003c/b>: blocks inline scripts and limits script sources — limits damage even if injection slips through.\u003c/li>\u003cli>\u003cb>HttpOnly\u003c/b> cookies: doesn&#39;t prevent XSS, but stops script reading the session cookie.\u003c/li>\u003c/ol>"},{"id":"1ynh30o","k":"def","f":"React","b":"values in \u003ccode>{curly braces}\u003c/code> are escaped automatically. Escape hatch: \u003cb>dangerouslySetInnerHTML\u003c/b> (name is deliberate)."},{"id":"e0m72j","k":"def","f":"Angular","b":"\u003cb>DomSanitizer\u003c/b> sanitizes HTML, style and URL bindings. Escape hatch: \u003cb>bypassSecurityTrustHtml\u003c/b>."},{"id":"882qeu","k":"tbl","f":"Fill in the table: Defense · Prevents XSS? · What it does","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Defense\u003c/th>\u003cth>Prevents XSS?\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Output encoding\u003c/td>\u003ctd>\u003cb>Yes\u003c/b> (primary)\u003c/td>\u003ctd>Data shown as text, not code\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Input validation\u003c/td>\u003ctd>Helps\u003c/td>\u003ctd>Restricts what&#39;s accepted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CSP\u003c/td>\u003ctd>Limits damage\u003c/td>\u003ctd>Blocks inline / foreign scripts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>HttpOnly\u003c/td>\u003ctd>\u003cb>No\u003c/b>\u003c/td>\u003ctd>Protects the cookie from theft\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"198v6u2","k":"def","f":"OWASP placement","b":"XSS was its own category in older editions; \u003cb>2021 merged it into A03:2021 Injection\u003c/b>, because it shares SQL injection&#39;s root cause (an interpreter that can&#39;t tell code from data) — only the interpreter differs (browser vs database)."}]},{"id":"lecture-7-csrf","label":"L7","title":"Cross-Site Request Forgery (CSRF)","cards":[{"id":"tlqb2v","k":"def","f":"Cross-Site Request Forgery (CSRF)","b":"a malicious page makes the victim&#39;s browser send a \u003cb>state-changing request\u003c/b> to a site where the victim is logged in. The browser attaches the session cookie automatically, so the site thinks the victim meant it."},{"id":"cn34jm","k":"tbl","f":"Compare: CSRF \u003ci>vs\u003c/i> XSS","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>CSRF\u003c/th>\u003cth>XSS\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Attacker&#39;s code runs on \u003cb>another site\u003c/b>\u003c/td>\u003ctd>Attacker&#39;s code runs \u003cb>on the target site\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Abuses the browser&#39;s automatic cookies\u003c/td>\u003ctd>Injects script into the page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Can&#39;t read responses\u003c/td>\u003ctd>Can read the page, tokens, cookies (if not HttpOnly)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Defense: tokens, SameSite, Origin check\u003c/td>\u003ctd>Defense: output encoding, CSP\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"16ep674","k":"def","f":"Ambient authority","b":"performing an action just by naming the resource, without presenting a permission scoped to that action. Cookies work this way: attached by destination domain, \u003cb>never checking which page initiated\u003c/b> the request."},{"id":"z5u0ko","k":"def","f":"Confused deputy problem","b":"a program holding more authority than the requester is tricked into misusing it. In CSRF: the \u003cb>browser\u003c/b> is the deputy, the \u003cb>session cookie\u003c/b> is the authority, the \u003cb>malicious page\u003c/b> tricks it."},{"id":"12llkdy","k":"q","f":"Why is a state-changing GET dangerous ?","b":"\u003col>\u003cli>GET is supposed to be \u003cb>safe\u003c/b> (no state change).\u003c/li>\u003cli>A forged GET needs only an \u003cb>image tag or a link\u003c/b> — the browser sends it as soon as the tag is parsed; no script, no click.\u003c/li>\u003cli>A forged POST needs at least an auto-submitting form; exposing a transfer or password change via GET removes even that step.\u003c/li>\u003c/ol>"},{"id":"1eaxdg5","k":"tbl","f":"Fill in the table: Defense · Mechanism · Limitation","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Defense\u003c/th>\u003cth>Mechanism\u003c/th>\u003cth>Limitation\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cb>Synchronizer Token Pattern\u003c/b>\u003c/td>\u003ctd>Server generates a unique, unpredictable token per session, embeds it in every state-changing form, rejects mismatches\u003c/td>\u003ctd>Server-side state; must be in every form/API call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Double submit cookie\u003c/b>\u003c/td>\u003ctd>Random value set as a cookie \u003cb>and\u003c/b> repeated as a request parameter; another origin can&#39;t read the cookie to copy it\u003c/td>\u003ctd>Naive version weak unless \u003cb>signed and session-bound\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Custom request header\u003c/b>\u003c/td>\u003ctd>Script adds a custom header; only same-origin script can set it\u003c/td>\u003ctd>Not usable for plain forms or links\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>SameSite cookie\u003c/b>\u003c/td>\u003ctd>Browser withholds the cookie on most cross-site requests\u003c/td>\u003ctd>\u003cb>Lax\u003c/b> (default) still sends it on top-level navigation like a clicked link\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Origin / Referer check\u003c/b>\u003c/td>\u003ctd>Compare the declared source with your own origin\u003c/td>\u003ctd>Referer can be stripped by Referrer-Policy or privacy settings\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"171tbr1","k":"def","f":"Naive double submit","b":"assumes an attacker can&#39;t set cookies on your domain — broken by a vulnerable subdomain, \u003cb>subdomain takeover\u003c/b>, or plain-HTTP access."},{"id":"153bptq","k":"def","f":"Signed double submit cookie","b":"value generated with a server secret (\u003cb>HMAC\u003c/b>) and \u003cb>bound to the session ID\u003c/b>; a planted cookie can&#39;t pass the signature check. (Current OWASP guidance.)"},{"id":"1pcup8b","k":"tbl","f":"Compare: Origin header \u003ci>vs\u003c/i> Referer header","b":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"sm-tbl\">\u003cthead>\u003ctr>\u003cth>Origin header\u003c/th>\u003cth>Referer header\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Scheme + host + port only (no path)\u003c/td>\u003ctd>\u003cb>Full URL\u003c/b> of the requesting page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sent on all cross-origin requests and same-origin POST/PUT/DELETE\u003c/td>\u003ctd>Can be suppressed by Referrer-Policy or browser settings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>More dependable\u003c/b> — check first\u003c/td>\u003ctd>Fallback when Origin is absent\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"id":"152v1zx","k":"q","f":"When does SameSite=Lax (the default since 2020) still allow a forged request ?","b":"\u003col>\u003cli>\u003cb>Top-level GET navigation\u003c/b> — a link the victim clicks — so a state-changing GET is still forgeable.\u003c/li>\u003cli>Chromium&#39;s \u003cb>temporary exception\u003c/b>: a cookie \u003cb>under 2 minutes old\u003c/b> is sent on a top-level cross-site \u003cb>POST\u003c/b> (kept for SSO/identity flows; expected to be removed).\u003c/li>\u003c/ol>\n\u003cdiv class=\"sm-key\">SameSite is a valuable \u003cb>default, not a substitute\u003c/b> for an explicit token.\u003c/div>"},{"id":"1cbqnns","k":"q","f":"Why can an XSS vulnerability defeat token-based CSRF protection ?","b":"\u003cul>\u003cli>Injected script runs with the page&#39;s full privileges, so it can \u003cb>read the token\u003c/b> from the page (or a readable cookie) and copy it into the forged request. One XSS removes the protection against a completely different attack.\u003c/li>\u003c/ul>"},{"id":"198v6u2","k":"def","f":"OWASP placement","b":"CSRF was \u003cb>#5 (2007)\u003c/b> and \u003cb>#8 (2013)\u003c/b>, then \u003cb>dropped from 2017\u003c/b> (declining incidence; frameworks added built-in protection). In 2021 it is \u003cb>CWE-352\u003c/b>, included under \u003cb>A01:2021 Broken Access Control\u003c/b> — processing a state-changing request without verifying the user&#39;s genuine intent is a failure to control access to that action."}]}];</script>
